<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    html, body { height:100%; width:100%; margin:0; padding:0; overflow:hidden; background-color:#0b0719; font-family:'Plus Jakarta Sans',sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
    .video-swipe-area { touch-action:none; }
  </style>
</head>
<body class="text-white select-none">
  <div id="root" class="h-full w-full"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const SUPABASE_URL = "https://yommeqomnbzlnszbfghm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_no3M4ZhcpnxkywA-UwJBRw_9JbbYsYj";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.type='sine'; osc.frequency.setValueAtTime(600,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800,ctx.currentTime+0.05);
          gain.gain.setValueAtTime(0.15,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.05); osc.start(); osc.stop(ctx.currentTime+0.05);
        } else if (type === 'like') {
          osc.type='triangle'; osc.frequency.setValueAtTime(440,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.1);
          gain.gain.setValueAtTime(0.2,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.1); osc.start(); osc.stop(ctx.currentTime+0.1);
        }
      } catch(e) {}
    };

    const INITIAL_POSTS = [{
        id: 1, authorId: "@neon_vibes", user: "@neon_vibes",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop",
        desc: "Lumières de la ville 🌌 #néon #city #vibes #fyp",
        music: "Son original - Neon Vibes 🎵", likes: 12400, comments: 842, bookmarks: 320, shares: 156, viewsCount: 145200, views: "145.2K", followers: 45200, followingCount: 120, totalLikes: 210000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4",
        commentsList: [{ id: 1, user: "@lucas_92", text: "Incroyable cette vidéo ! 🔥", time: "Il y a 2h" }]
      }];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [userPosts, setUserPosts] = useState([]);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [isLoadingPosts, setIsLoadingPosts] = useState(true);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedPosts, setLikedPosts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(() => posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {}));
      const [savedCounts, setSavedCounts] = useState(() => posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks }), {}));
      const [following, setFollowing] = useState({});
      const [toastMessage, setToastMessage] = useState("");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [newCaption, setNewCaption] = useState("");
      const [selectedFile, setSelectedFile] = useState(null);
      const [userName, setUserName] = useState("Aziz Enbiri");
      const [userTag, setUserTag] = useState("@azizenbiri");
      const [userBio, setUserBio] = useState("Créateur de contenu néon ⚡");
      const [userAvatar, setUserAvatar] = useState("https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop");
      const [userFollowersCount, setUserFollowersCount] = useState(1280);
      const [userFollowingCount, setUserFollowingCount] = useState(245);
      const [userLikesCount, setUserLikesCount] = useState(9420);
      const touchStartY = useRef(0); const videoRef = useRef(null);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(p => {
            if (p >= 100) { clearInterval(interval); setTimeout(() => setShowSplash(false), 300); return 100; }
            return p + 2;
          });
        }, 30);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (toastMessage) {
          const timer = setTimeout(() => setToastMessage(""), 2500);
          return () => clearTimeout(timer);
        }
      }, [toastMessage]);

      // CHARGEMENT DEPUIS SUPABASE - TABLE clips
      useEffect(() => {
        const fetchClips = async () => {
          try {
            setIsLoadingPosts(true);
            const { data, error } = await supabaseClient.from('clips').select('*').order('created_at', { ascending: false });
            if (error) { console.log("Erreur Supabase:", error); setIsLoadingPosts(false); return; }
            if (data && data.length > 0) {
              const mapped = data.map(c => ({
                id: c.id,
                authorId: c.author_id || userTag,
                user: c.author_id || userTag,
                avatar: userAvatar,
                desc: c.caption || "",
                music: "Son original - ClipClap",
                likes: c.likes || 0,
                comments: 0,
                bookmarks: 0,
                shares: 0,
                viewsCount: 0,
                views: "0",
                followers: userFollowersCount,
                followingCount: userFollowingCount,
                totalLikes: userLikesCount,
                video: c.video_url,
                commentsList: []
              }));
              setUserPosts(mapped);
              setPosts([...mapped, ...INITIAL_POSTS]);
            }
            setIsLoadingPosts(false);
          } catch (e) {
            console.log("Erreur fetch", e);
            setIsLoadingPosts(false);
          }
        };
        fetchClips();
      }, []);

      useEffect(() => {
        setLikeCounts(posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {}));
        setSavedCounts(posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks }), {}));
      }, [posts]);

      const showToast = (msg) => setToastMessage(msg);

      const handleLike = (postId) => {
        const isLiked = likedPosts[postId];
        playSound('like');
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({ ...prev, [postId]: isLiked ? prev[postId] - 1 : prev[postId] + 1 }));
      };

      const handleSave = (postId) => {
        const isSaved = savedPosts[postId];
        playSound('click');
        setSavedPosts(prev => ({ ...prev, [postId]: !isSaved }));
        setSavedCounts(prev => ({ ...prev, [postId]: isSaved ? prev[postId] - 1 : prev[postId] + 1 }));
        showToast(isSaved ? "Retiré des favoris" : "Ajouté aux favoris");
      };

      const handleFollow = (authorId) => {
        const isFollowing = following[authorId];
        playSound('click');
        setFollowing(prev => ({ ...prev, [authorId]: !isFollowing }));
        showToast(isFollowing ? "Vous ne suivez plus" : "Abonné !");
      };
      const handleSwipe = (direction) => {
        if (direction === 'up' && currentIndex < posts.length - 1) setCurrentIndex(i => i + 1);
        if (direction === 'down' && currentIndex > 0) setCurrentIndex(i => i - 1);
      };

      const handleTouchStart = (e) => { touchStartY.current = e.touches[0].clientY; };
      const handleTouchEnd = (e) => {
        const diff = touchStartY.current - e.changedTouches[0].clientY;
        if (Math.abs(diff) > 50) { handleSwipe(diff > 0 ? 'up' : 'down'); }
      };

      const handlePublish = async (e) => {
        e.preventDefault();
        if (!newCaption.trim() && !selectedFile) { showToast("Ajoute une vidéo ou une description"); return; }
        playSound('click');
        showToast("Publication vers Supabase...");
        
        let videoUrl = "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4";
        if (selectedFile) {
          videoUrl = URL.createObjectURL(selectedFile);
        }

        try {
          const { data, error } = await supabaseClient.from('clips').insert([{
            author_id: userTag,
            caption: newCaption,
            video_url: videoUrl,
            likes: 0
          }]).select();

          if (error) {
            console.log("Erreur insert:", error);
            showToast("Erreur Supabase: " + error.message);
            return;
          }

          if (data && data[0]) {
            const newPost = {
              id: data[0].id,
              authorId: userTag,
              user: userTag,
              avatar: userAvatar,
              desc: newCaption,
              music: "Son original - ClipClap",
              likes: 0, comments: 0, bookmarks: 0, shares: 0, viewsCount: 0, views: "0",
              followers: userFollowersCount, followingCount: userFollowingCount, totalLikes: userLikesCount,
              video: videoUrl,
              commentsList: []
            };
            setPosts(prev => [newPost, ...prev]);
            setUserPosts(prev => [newPost, ...prev]);
            setCurrentIndex(0);
            setActiveTab('feed');
            showToast("Publié avec succès !");
          }
        } catch (err) {
          console.log(err);
          showToast("Erreur réseau");
        }

        setShowUploadModal(false);
        setNewCaption("");
        setSelectedFile(null);
      };

      const currentPost = posts[currentIndex];

      if (showSplash) {
        return (
          <div className="h-full w-full bg-[#0b0719] flex flex-col items-center justify-center relative">
            <div className="flex flex-col items-center">
              <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-3xl font-black mb-4">C</div>
              <h1 className="text-3xl font-black tracking-tight">ClipClap</h1>
              <p className="text-sm text-gray-400 mt-1">Chargement...</p>
            </div>
            <div className="absolute bottom-10 left-8 right-8">
              <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-pink-500 to-purple-600 transition-all duration-100" style={{ width: `${progress}%` }}></div>
              </div>
              <p className="text-center text-xs text-gray-500 mt-2">{progress}%</p>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full w-full bg-black relative overflow-hidden flex flex-col">
          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div className="absolute inset-0 bg-black video-swipe-area" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} onClick={() => { if(videoRef.current){ if(isPlaying){ videoRef.current.pause(); setIsPlaying(false); setShowPlayIcon(true); setTimeout(()=>setShowPlayIcon(false),800); } else { videoRef.current.play(); setIsPlaying(true); } } }}>
                {isLoadingPosts ? (
                  <div className="h-full flex items-center justify-center text-gray-400 text-sm">Chargement Supabase...</div>
                ) : currentPost ? (
                  <div className="h-full w-full relative">
                    <video ref={videoRef} src={currentPost.video} className="h-full w-full object-cover" loop playsInline autoPlay muted={isMuted} />
                    {showPlayIcon && <div className="absolute inset-0 flex items-center justify-center bg-black/20"><div className="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-3xl">▶</div></div>}
                    <div className="absolute top-0 left-0 right-0 h-24 bg-gradient-to-b from-black/60 to-transparent z-10 pointer-events-none"></div>
                    <div className="absolute top-4 left-0 right-0 z-20 flex items-center justify-center gap-6">
                      <button onClick={() => setFeedTab('following')} className={`text-sm font-bold pb-1 border-b-2 transition ${feedTab === 'following' ? 'text-white border-white' : 'text-gray-400 border-transparent'}`}>Abonnements</button>
                      <button onClick={() => setFeedTab('foryou')} className={`text-sm font-bold pb-1 border-b-2 transition ${feedTab === 'foryou' ? 'text-white border-pink-500' : 'text-gray-400 border-transparent'}`}>Pour toi</button>
                    </div>
                    <button onClick={() => setIsMuted(!isMuted)} className="absolute top-4 right-4 z-30 w-8 h-8 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-sm border border-white/10">{isMuted ? "🔇" : "🔊"}</button>
                    <div className="absolute right-2 bottom-20 flex flex-col items-center gap-5 z-30">
                      <button onClick={() => handleFollow(currentPost.authorId)} className="relative"><div className="w-12 h-12 rounded-full overflow-hidden border-2 border-white"><img src={currentPost.avatar} className="w-full h-full object-cover" /></div><div className={`absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ${following[currentPost.authorId] ? 'bg-gray-600' : 'bg-pink-500'}`}>{following[currentPost.authorId] ? "✓" : "+"}</div></button>
                      <button onClick={() => handleLike(currentPost.id)} className="flex flex-col items-center"><div className={`w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl transition ${likedPosts[currentPost.id] ? 'bg-pink-500 text-white' : ''}`}>❤</div><span className="text-xs font-bold mt-1">{likeCounts[currentPost.id] || 0}</span></button>
                      <button onClick={() => showToast("Commentaires bientôt")} className="flex flex-col items-center"><div className="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl">💬</div><span className="text-xs font-bold mt-1">{currentPost.comments}</span></button>
                      <button onClick={() => handleSave(currentPost.id)} className="flex flex-col items-center"><div className={`w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl ${savedPosts[currentPost.id] ? 'bg-yellow-500' : ''}`}>📌</div><span className="text-xs font-bold mt-1">{savedCounts[currentPost.id] || 0}</span></button>
                      <button onClick={() => { navigator.clipboard.writeText(window.location.href); showToast("Lien copié !"); }} className="flex flex-col items-center"><div className="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl">↗️</div><span className="text-xs font-bold mt-1">{currentPost.shares}</span></button>
                    </div>
                    <div className="absolute left-4 bottom-20 right-16 z-30"><div className="flex items-center gap-2 mb-2"><span className="font-extrabold text-base text-white">{currentPost.user}</span></div><p className="text-sm text-gray-200 mb-2.5 font-normal leading-relaxed">{currentPost.desc}</p><div className="flex items-center gap-2 text-xs text-gray-300 bg-black/30 backdrop-blur-md px-3 py-1.5 rounded-full w-fit border border-white/10"><span>🎵</span><span className="truncate max-w-[200px]">{currentPost.music}</span></div></div>
                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400"><span className="text-4xl mb-2">📭</span><p className="text-sm font-medium">Aucune vidéo dans Supabase</p><p className="text-xs mt-1">Publie ta première vidéo avec +</p></div>
                )}
              </div>
            )}
            {activeTab === 'profile' && (
              <div className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-10 pb-24 video-swipe-area">
                <div className="flex flex-col items-center mt-4">
                  <div className="relative mb-3"><div className="w-24 h-24 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 shadow-xl"><img src={userAvatar} alt="avatar" className="w-full h-full object-cover" /></div></div>
                  <h2 className="text-xl font-extrabold text-white flex items-center gap-1.5">{userName} <span className="text-pink-500 text-sm">✓</span></h2>
                  <p className="text-xs text-gray-400 font-medium mb-3">{userTag}</p>
                  <p className="text-xs text-gray-200 text-center max-w-xs mb-5 font-normal px-4">{userBio}</p>
                  <div className="flex items-center gap-6 mb-6 text-center"><div><span className="block font-extrabold text-base">{Object.keys(following).filter(k => following[k]).length + 245}</span><span className="text-[11px] text-gray-400">Abonnements</span></div><div className="w-[1px] h-6 bg-white/15"></div><div><span className="block font-extrabold text-base">{userFollowersCount}</span><span className="text-[11px] text-gray-400">Abonnés</span></div><div className="w-[1px] h-6 bg-white/15"></div><div><span className="block font-extrabold text-base">{userLikesCount}</span><span className="text-[11px] text-gray-400">J'aime</span></div></div>
                </div>
                <div className="border-t border-white/10 pt-4">
                  <div className="flex justify-center gap-8 mb-4"><span className="text-xs font-bold text-white border-b-2 border-pink-500 pb-1">Mes vidéos (Supabase)</span></div>
                  <div className="grid grid-cols-3 gap-1 overflow-y-auto max-h-[55vh] pb-24">
                    {posts.filter(p => p.authorId === userTag || p.user === userTag).map((p, idx) => (
                      <div key={idx} onClick={() => { const indexInFeed = posts.findIndex(post => post.id === p.id); if (indexInFeed !== -1) { setCurrentIndex(indexInFeed); setActiveTab('feed'); }}} className="relative aspect-[9/16] bg-gray-900 overflow-hidden rounded-lg cursor-pointer group">
                        <video src={p.video} className="w-full h-full object-cover" muted playsInline />
                        <div className="absolute top-2 left-2 z-10 flex items-center gap-1 text-[11px] text-white font-bold bg-black/70 px-2 py-0.5 rounded">▶ {p.viewsCount || 0}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
          <div className="absolute bottom-0 left-0 right-0 h-16 bg-[#090514]/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-2 z-40">
            <button onClick={() => { playSound('click'); setActiveTab('feed'); }} className={`flex flex-col items-center gap-1 ${activeTab === 'feed' ? 'text-pink-500 font-bold' : 'text-gray-400'}`}><span className="text-xl">🏠</span><span className="text-[10px]">Accueil</span></button>
            <button onClick={() => { playSound('click'); setShowUploadModal(true); }} className="relative -top-2 w-12 h-12 bg-gradient-to-tr from-pink-500 via-purple-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg">+</button>
            <button onClick={() => { playSound('click'); setActiveTab('profile'); }} className={`flex flex-col items-center gap-1 ${activeTab === 'profile' ? 'text-pink-500 font-bold' : 'text-gray-400'}`}><span className="text-xl">👤</span><span className="text-[10px]">Profil</span></button>
          </div>
          {showUploadModal && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="w-full sm:max-w-md bg-[#120c24] border border-white/10 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-4"><h3 className="text-lg font-extrabold text-white">Publier vers Supabase</h3><button onClick={() => setShowUploadModal(false)} className="text-gray-400 hover:text-white text-xl font-bold">✕</button></div>
                <form onSubmit={handlePublish} className="space-y-4">
                  <div><label className="block text-xs font-semibold text-gray-300 mb-1.5">Fichier Vidéo</label><input type="file" accept="video/*" onChange={(e) => setSelectedFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer" /></div>
                  <div><label className="block text-xs font-semibold text-gray-300 mb-1.5">Description</label><textarea value={newCaption} onChange={(e) => setNewCaption(e.target.value)} placeholder="Décris ta vidéo..." rows="3" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 resize-none"></textarea></div>
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-white font-extrabold text-sm shadow-lg">Publier dans Supabase 🚀</button>
                </form>
              </div>
            </div>
          )}
          {toastMessage && <div className="absolute bottom-20 left-1/2 -translate-x-1/2 z-50 bg-white text-black px-4 py-2 rounded-full text-xs font-bold shadow-xl">{toastMessage}</div>}
        </div>
      );
    }
    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
