<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white selection:bg-pink-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const VIDEOS = [
      {
        id: 1,
        url: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes",
        music: "Son original - Neon Vibes",
        likes: "12.4k",
        comments: "842"
      },
      {
        id: 2,
        url: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4",
        user: "@cyber_dancer",
        desc: "Session freestyle sous les néons 💃✨",
        music: "Cyberpunk 2077 Beats",
        likes: "45.2k",
        comments: "1.2k"
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [activeTab, setActiveTab] = useState('feed');
      const [currentVideo, setCurrentVideo] = useState(0);

      useEffect(() => {
        const timer = setTimeout(() => setShowSplash(false), 2000);
        return () => clearTimeout(timer);
      }, []);

      if (showSplash) {
        return (
          <div class="h-screen w-full bg-[#0a0a1a] flex flex-col items-center justify-center relative overflow-hidden">
            <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 p-1 animate-spin">
              <div class="w-full h-full bg-[#0a0a1a] rounded-full flex items-center justify-center">
                <span class="text-4xl">🎬</span>
              </div>
            </div>
            <h1 class="mt-6 text-4xl font-extrabold bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent tracking-wider">
              ClipClap
            </h1>
            <p class="mt-2 text-xs text-cyan-400 tracking-widest uppercase">The Neon Experience</p>
          </div>
        );
      }

      return (
        <div class="h-screen w-full max-w-md mx-auto bg-[#0a0a1a] flex flex-col relative overflow-hidden border-x border-pink-500/20 shadow-[0_0_50px_rgba(255,0,128,0.2)]">
          
          {/* Contenu principal */}
          <div class="flex-1 relative bg-black">
            {activeTab === 'feed' && (
              <div class="h-full w-full relative">
                <video 
                  src={VIDEOS[currentVideo].url} 
                  class="w-full h-full object-cover" 
                  autoPlay 
                  loop 
                  muted 
                  playsInline
                />
                
                {/* Overlay Infos */}
                <div class="absolute bottom-4 left-4 right-16 z-10 space-y-2 text-shadow">
                  <h3 class="font-bold text-lg text-cyan-400">{VIDEOS[currentVideo].user}</h3>
                  <p class="text-sm text-gray-200">{VIDEOS[currentVideo].desc}</p>
                  <div class="flex items-center gap-2 text-xs text-pink-400">
                    <span>🎵</span>
                    <span>{VIDEOS[currentVideo].music}</span>
                  </div>
                </div>

                {/* Actions latérales */}
                <div class="absolute right-3 bottom-12 z-10 flex flex-col items-center gap-6">
                  <button class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-pink-500/50 text-pink-500 text-xl">
                      ♥
                    </div>
                    <span class="text-xs mt-1">{VIDEOS[currentVideo].likes}</span>
                  </button>
                  <button class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-cyan-400/50 text-cyan-400 text-xl">
                      💬
                    </div>
                    <span class="text-xs mt-1">{VIDEOS[currentVideo].comments}</span>
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div class="h-full w-full p-6 overflow-y-auto bg-[#0a0a1a] space-y-6">
                <div class="text-center space-y-3 mt-4">
                  <div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-tr from-pink-500 to-cyan-400 shadow-[0_0_20px_rgba(255,0,128,0.5)]">
                    <div class="w-full h-full bg-[#0a0a1a] rounded-full flex items-center justify-center text-3xl">
                      👾
                    </div>
                  </div>
                  <h2 class="text-2xl font-bold text-white">@azizenbiri</h2>
                  <p class="text-xs text-gray-400">Créateur de contenu néon ⚡</p>
                </div>

                <div class="flex justify-around py-4 border-y border-white/10 text-center">
                  <div><div class="font-bold text-pink-500">24</div><div class="text-xs text-gray-400">Vidéos</div></div>
                  <div><div class="font-bold text-cyan-400">12.8k</div><div class="text-xs text-gray-400">Abonnés</div></div>
                  <div><div class="font-bold text-purple-400">95.4k</div><div class="text-xs text-gray-400">J'aime</div></div>
                </div>

                <button class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-semibold shadow-[0_0_15px_rgba(255,0,128,0.4)] active:scale-95 transition">
                  Éditer le profil
                </button>
              </div>
            )}
          </div>

          {/* Barre de navigation */}
          <div class="h-16 bg-[#0a0a1a]/95 backdrop-blur-lg border-t border-white/10 flex justify-around items-center z-50">
            <button onClick={() => setActiveTab('feed')} class={`flex flex-col items-center ${activeTab === 'feed' ? 'text-pink-500' : 'text-gray-400'}`}>
              <span class="text-lg">🏠</span>
              <span class="text-[10px]">Accueil</span>
            </button>
            <button onClick={() => setActiveTab('search')} class="flex flex-col items-center text-gray-400">
              <span class="text-lg">🔍</span>
              <span class="text-[10px]">Découvrir</span>
            </button>
            <button class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 flex items-center justify-center text-black font-bold shadow-[0_0_10px_rgba(0,255,255,0.5)]">
              +
            </button>
            <button onClick={() => setActiveTab('notifs')} class="flex flex-col items-center text-gray-400">
              <span class="text-lg">🔔</span>
              <span class="text-[10px]">Alertes</span>
            </button>
            <button onClick={() => setActiveTab('profile')} class={`flex flex-col items-center ${activeTab === 'profile' ? 'text-cyan-400' : 'text-gray-400'}`}>
              <span class="text-lg">👤</span>
              <span class="text-[10px]">Profil</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClipClapApp />);
  </script>
</body>
</html>
