const fmt = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n); };
const ago = (d) => {
  const m = Math.floor((Date.now() - new Date(d).getTime()) / 60000);
  if (m < 1) return "À l'instant"; if (m < 60) return `Il y a ${m} min`;
  const h = Math.floor(m / 60); return h < 24 ? `Il y a ${h} h` : `Il y a ${Math.floor(h/24)} j`;
};
const click = (type = 'click') => {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type === 'like' ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(type === 'like' ? 440 : 600, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(type === 'like' ? 880 : 800, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.15, c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.08);
    o.start(); o.stop(c.currentTime + 0.08);
  } catch (e) {}
};

/* ================= ENVOI AVEC PROGRESSION & DURÉE ================= */
const uploadWithProgress = (path, f, token, onProgress) => new Promise((resolve, reject) => {
  const x = new XMLHttpRequest();
  x.open('POST', `${SB_URL}/storage/v1/object/videos/${path}`);
  x.setRequestHeader('Authorization', `Bearer ${token}`);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Content-Type', f.type || 'video/mp4');
  x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
  x.onload = () => (x.status >= 200 && x.status < 300 ? resolve() : reject(new Error(x.responseText || ('Erreur ' + x.status))));
  x.onerror = () => reject(new Error('Réseau indisponible'));
  x.send(f);
});
const videoDuration = (f) => new Promise((res) => {
  const v = document.createElement('video'); v.preload = 'metadata';
  const url = URL.createObjectURL(f);
  v.onloadedmetadata = () => { URL.revokeObjectURL(url); res(isFinite(v.duration) ? v.duration : 0); };
  v.onerror = () => { URL.revokeObjectURL(url); res(0); };
  v.src = url;
});

/* ================= BEATMAKERS : OUTILS ================= */

const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const toWav = (ab) => {
  const d = ab.getChannelData(0); const n = d.length;
  const buf = new ArrayBuffer(44 + n * 2); const v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, ab.sampleRate, true);
  v.setUint32(28, ab.sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
};
// Crée l'aperçu de 15 s (mono, 22 kHz, fondu de sortie) directement sur le téléphone
const makePreview = async (file, secs = 15) => {
  const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC(); let buf;
  try { const ab = await file.arrayBuffer(); buf = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)); }
  finally { try { ctx.close(); } catch (e) {} }
  const dur = buf.duration; const len = Math.min(secs, dur);
  const start = dur <= secs ? 0 : Math.min(dur * 0.2, dur - secs);
  const rate = 22050; const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new OAC(1, Math.max(1, Math.ceil(len * rate)), rate);
  const src = off.createBufferSource(); src.buffer = buf;
  const g = off.createGain();
  g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(1, 0.05);
  g.gain.setValueAtTime(1, Math.max(0.06, len - 1.5)); g.gain.linearRampToValueAtTime(0, len);
  src.connect(g); g.connect(off.destination); src.start(0, start, len);
  const out = await new Promise((res, rej) => { const p = off.startRendering(); if (p && p.then) p.then(res, rej); else off.oncomplete = (e) => res(e.renderedBuffer); });
  return { blob: toWav(out), duration: dur };
};

/* ================= FEUILLE GLISSANTE (swipe vers le bas pour fermer) ================= */
const Sheet = ({ onClose, children, height = 'max-h-[85%]', pos = 'absolute', z = 'z-50' }) => {
  const [y, setY] = useState(0); const [drag, setDrag] = useState(false);
  const t = useRef({ y: 0, active: false }); const body = useRef(null);
  const start = (e) => {
    const inBody = body.current && body.current.contains(e.target);
    t.current = { y: e.touches[0].clientY, active: !inBody || body.current.scrollTop <= 0 };
  };
  const move = (e) => {
    if (!t.current.active) return;
    const dy = e.touches[0].clientY - t.current.y;
    if (dy > 0) { setDrag(true); setY(dy); } else if (y) setY(0);
  };
  const end = () => { setDrag(false); if (t.current.active && y > 90) onClose(); setY(0); };
  return (
    <div className={`${pos} inset-0 ${z} bg-black/70 backdrop-blur-sm flex items-end justify-center`} onClick={onClose}>
      <div className={`w-full max-w-md bg-[#120c24] border-t border-white/10 rounded-t-3xl flex flex-col ${height}`}
           style={{ transform: `translateY(${y}px)`, transition: drag ? 'none' : 'transform .25s ease' }}
           onClick={e => e.stopPropagation()} onTouchStart={start} onTouchMove={move} onTouchEnd={end}>
        <div className="w-full flex justify-center pt-2.5 pb-1 flex-shrink-0"><div className="w-12 h-1.5 bg-white/25 rounded-full"></div></div>
        <div ref={body} className="flex-1 min-h-0 overflow-y-auto overscroll-contain">{children}</div>
      </div>
    </div>
  );
};

function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
  const [username, setUsername] = useState(''); const [name, setName] = useState('');
  const [msg, setMsg] = useState(''); const [busy, setBusy] = useState(false);
  const [legal, setLegal] = useState(null); const [accepted, setAccepted] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setMsg(''); setBusy(true);
    try {
      if (mode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        setMsg('Email envoyé ! Clique sur le lien reçu pour choisir un nouveau mot de passe.');
      } else if (mode === 'signup') {
        const u = username.trim().replace(/^@+/, '').toLowerCase();
        if (!/^[a-z0-9_.]{3,20}$/.test(u)) throw new Error("Pseudo : 3 à 20 caractères (lettres, chiffres, _ ou .)");
        if (!accepted) throw new Error("Accepte les conditions d'utilisation pour continuer");
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username: u, display_name: name.trim() || u } } });
        if (error) throw error;
        if (!data.session) { setMode('login'); setMsg("Compte créé ! Confirme ton email puis connecte-toi."); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) { setMsg(err.message || 'Erreur'); }
    setBusy(false);
  };

  const inp = "w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-fuchsia-500";
  return (
    <div className="h-full w-full flex flex-col items-center justify-center bg-app px-6">
      <div className="mb-3"><Logo size={84} id="lga" /></div>
      <h1 className="text-3xl font-black mb-1 grad-text">ClipClap</h1>
      <p className="text-xs text-gray-400 mb-5">{mode === 'login' ? 'Connecte-toi pour continuer' : mode === 'forgot' ? 'Recevoir un lien de réinitialisation' : 'Crée ton compte'}</p>
      <form onSubmit={submit} className="w-full max-w-xs space-y-3">
        {mode === 'signup' && <>
          <input className={inp} placeholder="Nom d'affichage" value={name} onChange={e => setName(e.target.value)} />
          <input className={inp} placeholder="@pseudo" autoCapitalize="none" value={username} onChange={e => setUsername(e.target.value)} />
        </>}
        <input className={inp} type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required />
        {mode !== 'forgot' && <input className={inp} type="password" placeholder="Mot de passe (6 caractères min.)" minLength={6} value={password} onChange={e => setPassword(e.target.value)} required />}
        {mode === 'signup' && <label className="flex items-start gap-2 text-[11px] text-gray-300 leading-snug">
          <input type="checkbox" checked={accepted} onChange={e => setAccepted(e.target.checked)} className="mt-0.5" />
          <span>J'ai 15 ans ou plus et j'accepte les <button type="button" onClick={() => setLegal('cgu')} className="underline text-fuchsia-300">conditions d'utilisation</button> et la <button type="button" onClick={() => setLegal('privacy')} className="underline text-fuchsia-300">politique de confidentialité</button>.</span>
        </label>}
        <LegalSheet type={legal} onClose={() => setLegal(null)} />
        {msg && <p className="text-xs text-pink-300 text-center">{msg}</p>}
        <button disabled={busy} className="w-full py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl font-extrabold text-sm disabled:opacity-60">
          {busy ? '...' : mode === 'login' ? 'Se connecter' : mode === 'forgot' ? 'Envoyer le lien' : "S'inscrire"}
        </button>
      </form>
      {mode === 'login' && <button onClick={() => { setMode('forgot'); setMsg(''); }} className="mt-3 text-xs text-fuchsia-300 underline">Mot de passe oublié ?</button>}
      <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setMsg(''); }} className="mt-4 text-xs text-gray-400 underline">
        {mode === 'login' ? "Pas de compte ? S'inscrire" : 'Déjà un compte ? Se connecter'}
      </button>
    </div>
  );
}

        <div key={v.id} onClick={() => openVideo(v)} className="relative aspect-[9/16] bg-gray-900 overflow-hidden rounded-lg cursor-pointer">
          <Thumb poster={v.thumb_url} />
          {v.kind === 'clash' && <span className="absolute top-1 left-1 text-[9px] font-bold bg-pink-600 px-1.5 py-0.5 rounded flex items-center gap-1">{v.clash_win && <Icon n="trophy" size={9} />}CLASH</span>}
          <div className="absolute bottom-1 left-1 right-1 text-[10px] font-bold bg-black/70 px-1.5 py-0.5 rounded flex justify-between"><span className="flex items-center gap-1"><Icon n="play" size={9} fill />{fmt(v.views_count)}</span><span className="flex items-center gap-1"><Icon n="heart" size={9} fill />{fmt(v.likes_count)}</span><span className="flex items-center gap-1"><Icon n="msg" size={9} fill />{fmt(v.comments_count)}</span></div>
          {canDelete && <button onClick={(e) => removeVideo(v, e)} className="absolute top-1 right-1 w-6 h-6 bg-black/70 rounded-full flex items-center justify-center"><Icon n="trash" size={12} /></button>}
        </div>))}</div>;

  if (!splashDone || !booted) return <Splash />;
  if (recovering) return <ResetScreen onDone={() => setRecovering(false)} />;
  if (!session) return <AuthScreen />;
  if (!me) return <div className="h-full flex flex-col items-center justify-center bg-app gap-3"><span className="text-4xl">🎬</span><p className="text-xs text-gray-400">Chargement du profil...</p><button onClick={() => sb.auth.signOut()} className="text-xs underline text-gray-500">Se déconnecter</button></div>;

  const myVideos = videos.filter(v => v.user_id === me.id);
  const myFree = myVideos.filter(v => v.kind === 'freestyle' || v.clash_win); const myClips = myVideos.filter(v => v.kind === 'clash' && !v.clash_win);
  const savedList = videos.filter(v => saved[v.id]);
  const myStats = stats[me.id];
  const myLikes = myVideos.reduce((s, v) => s + v.likes_count, 0);
  const btn = "w-11 h-11 rounded-full flex items-center justify-center bg-black/35 backdrop-blur-md border border-white/20 text-white transition-all";
  const act = "!bg-gradient-to-tr from-fuchsia-500 to-violet-600 !border-transparent shadow-[0_0_18px_rgba(217,70,239,0.75)] scale-110";

  // Battle en cours
  const bEnded = battle ? new Date(battle.ends_at) <= new Date() : false;
  const bLeft = battle ? Math.max(0, new Date(battle.ends_at) - new Date()) : 0;
  const bDaysLeft = Math.floor(bLeft / 86400000);
  const bH = Math.floor((bLeft % 86400000) / 3600000), bM = Math.floor((bLeft % 3600000) / 60000);
  const bCount = bEnded ? 'Terminée' : bDaysLeft >= 1 ? `Reste ${bDaysLeft} jour${bDaysLeft > 1 ? 's' : ''}` : `Reste ${bH} h ${bM} min`;
  const bVideos = battle ? videos.filter(v => v.battle_id === battle.id && !blocked[v.user_id]) : [];
  const board = Object.values(bVideos.reduce((a, v) => {
    a[v.user_id] = a[v.user_id] || { id: v.user_id, name: v.username, avatar: v.avatar_url, views: 0, vid: v };
    a[v.user_id].views += v.views_count; return a;
  }, {})).map(c => ({ ...c, votes: votes.filter(x => x.candidate_id === c.id).length }))
    .sort((a, b) => b.votes - a.votes || b.views - a.views).map((c, i) => ({ ...c, rank: i + 1 }));
  const myVoteId = (votes.find(x => x.user_id === me.id) || {}).candidate_id;
  const winner = bEnded && board.length && board[0].votes > 0 ? board[0] : null;
  const wins = results.reduce((a, r) => ({ ...a, [r.candidate_id]: (a[r.candidate_id] || 0) + 1 }), {});
  const pastResults = results.filter(r => !battle || r.battle_id !== battle.id);

  // --- Clash Tag : cartes côte à côte ---
  const clashList = clashes.filter(c => !blocked[c.challenger_id] && !blocked[c.opponent_id]);
  const toReply = clashList.filter(c => c.opponent_id === me.id && clashState(c) === 'open');
  const mineOpen = clashList.filter(c => c.challenger_id === me.id && ['open', 'pending_payment'].includes(clashState(c)));
  const restList = clashList.filter(c => !toReply.includes(c) && !mineOpen.includes(c) && clashState(c) !== 'pending_payment');
  const votingList = restList.filter(c => clashState(c) === 'voting');
  const restOthers = restList.filter(c => clashState(c) !== 'voting');
  const toVoteCount = votingList.filter(c => c.challenger_id !== me.id && c.opponent_id !== me.id && !clashVotes.some(v => v.clash_id === c.id && v.user_id === me.id)).length;
  const renderClash = (c) => {
    const st = clashState(c);
    const vC = clashVotes.filter(v => v.clash_id === c.id && v.side === 'c').length;
    const vO = clashVotes.filter(v => v.clash_id === c.id && v.side === 'o').length;
    const myV = clashVotes.find(v => v.clash_id === c.id && v.user_id === me.id);
    const total = vC + vO;
    const isPart = c.challenger_id === me.id || c.opponent_id === me.id;
    const winner = st === 'forfeit' ? 'c' : st === 'finished' ? (vC > vO ? 'c' : vO > vC ? 'o' : null) : null;
    const left = (ms) => { const h = Math.max(0, Math.floor(ms / 3600000)); return h >= 24 ? `${Math.floor(h / 24)} j ${h % 24} h` : `${h} h ${Math.max(0, Math.floor((ms % 3600000) / 60000))} min`; };
    const only = (e) => document.querySelectorAll('video[data-clash]').forEach(v => { if (v !== e.target) v.pause(); });
    const side = (vid, user, key) => (
      <div className="flex-1 min-w-0">
        <div className={`relative aspect-[9/16] rounded-xl overflow-hidden bg-gray-900 border-2 ${winner === key ? 'border-amber-400' : 'border-white/10'}`}>
          {vid ? <>
            <PosterVideo dataClash controls onPlay={only} src={vid.video_url} poster={(clashStats[vid.id] || {}).thumb} className="w-full h-full" />
            <Watermark user={user?.username} gid="wmk" />
          </> : <div className="w-full h-full flex flex-col items-center justify-center text-center p-3 text-gray-400 gap-2">
            <Icon n="swords" size={28} className="text-fuchsia-400" />
            <p className="text-xs">{st === 'forfeit' ? 'Forfait' : st === 'pending_payment' ? 'Paiement en attente' : `En attente de @${user?.username}`}</p>
          </div>}
        </div>
        <p className="text-xs font-bold mt-1.5 truncate flex items-center gap-1">{winner === key && <Icon n="trophy" size={12} className="text-amber-300" />}@{user?.username}</p>
      </div>
    );
    if (st === 'finished' && winner && (winner === 'c' ? c.cv : c.ov)) {
      const wVid = winner === 'c' ? c.cv : c.ov; const wUser = winner === 'c' ? c.challenger : c.opponent; const loser = winner === 'c' ? c.opponent : c.challenger;
      const wId = winner === 'c' ? c.challenger_id : c.opponent_id;
      const wVotes = winner === 'c' ? vC : vO, lVotes = winner === 'c' ? vO : vC;
      const stat = clashStats[wVid.id] || {}; const likedIt = !!liked[wVid.id];
      return (
        <div key={c.id} className="rounded-3xl p-3 border-2 border-amber-400/70 bg-gradient-to-b from-amber-500/15 to-fuchsia-900/20" style={{ boxShadow: '0 0 40px rgba(251,191,36,.35)' }}>
          <div className="flex items-center justify-center gap-2 mb-2 text-amber-300 font-black tracking-widest text-xs"><Icon n="trophy" size={16} /> VAINQUEUR DU CLASH <Icon n="trophy" size={16} /></div>
          <div className="relative aspect-[9/16] rounded-2xl overflow-hidden bg-gray-900 border-2 border-amber-400" style={{ animation: 'winnerPop .8s cubic-bezier(.2,1.3,.3,1) both' }}>
            <PosterVideo dataClash controls onPlay={only} src={wVid.video_url} poster={stat.thumb} className="w-full h-full" />
            <Watermark user={wUser?.username} gid="wmk" />
            <button onClick={() => likeClashVideo(wVid)} className={`absolute right-3 bottom-16 z-20 w-12 h-12 rounded-full flex items-center justify-center text-white border ${likedIt ? 'bg-gradient-to-tr from-fuchsia-500 to-violet-600 border-transparent shadow-[0_0_18px_rgba(217,70,239,0.8)] scale-110' : 'bg-black/45 border-white/25'}`}><Icon n="heart" size={22} fill={likedIt} /></button>
            <span className="absolute right-3 bottom-9 z-20 w-12 text-center text-[11px] font-bold drop-shadow">{fmt(stat.likes || 0)}</span>
          </div>
          <p className="text-center text-lg font-black mt-3 flex items-center justify-center gap-2"><Icon n="trophy" size={18} className="text-amber-300" /> @{wUser?.username}</p>
          <p className="text-center text-sm font-black grad-text mt-1" style={{ animation: 'fadeUp .7s .4s both' }}>Et boom, c'est plié ! Les votes sont tombés !</p>
          <p className="text-center text-[11px] text-gray-300 mt-1">{wVotes} vote{wVotes > 1 ? 's' : ''} contre {lVotes} · face à @{loser?.username}</p>
          <p className="text-center text-[11px] text-amber-200/90 mt-1">Aime la vidéo du champion !</p>
          {wId === me.id && (stat.win
            ? <p className="text-center text-xs font-bold text-emerald-300 mt-3">Publié sur l'accueil ✓</p>
            : <button onClick={() => publishWin(wVid)} className="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-fuchsia-500 text-black font-black text-sm flex items-center justify-center gap-2"><Icon n="trophy" size={16} /> Publier sur l'accueil</button>)}
          {!isPart && <button onClick={() => reportClash(c)} className="mt-2 text-[10px] text-gray-500">Signaler</button>}
        </div>
      );
    }
    const timeInfo = st === 'open' ? `Reste ${left(new Date(c.expires_at) - Date.now())} pour répondre` : st === 'voting' ? 'Votes ouverts' : st === 'finished' ? 'Terminé' : st === 'forfeit' ? 'Forfait' : 'Paiement en attente';
    return (
      <div key={c.id} className="rounded-2xl p-3 bg-slate-900/60 border border-white/10">
        <div className="flex items-center justify-between mb-2">
          <span className="text-[10px] font-bold uppercase tracking-wider text-fuchsia-300">{`Clash · ${c.max_seconds || 30} s`}</span>
          <span className="text-[10px] text-gray-400">{timeInfo}</span>
        </div>
        <div className="flex items-stretch gap-2 relative">
          {side(c.cv, c.challenger, 'c')}
          <div className="absolute left-1/2 top-[38%] -translate-x-1/2 z-10 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-[10px] font-black px-2 py-1 rounded-full border-2 border-slate-900">VS</div>
          {side(c.ov, c.opponent, 'o')}
        </div>

        {st === 'open' && c.opponent_id === me.id && <div className="mt-3 space-y-2">
          <button onClick={() => { click(); goStudio({ type: 'reply', clash: c, max: c.max_seconds || 30, instruUrl: c.instru_url, instruTitle: c.instru_title }); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-extrabold text-sm flex items-center justify-center gap-2"><Icon n="mic" size={16} /> Répondre ({c.max_seconds || 30} s)</button>
          
        </div>}

        {st === 'forfeit' && <p className="text-center text-xs font-bold text-amber-300 mt-3">Forfait de @{c.opponent?.username} : @{c.challenger?.username} gagne</p>}

        {(st === 'voting' || st === 'finished') && <div className="mt-3 space-y-2">
          <div className="flex justify-between text-[11px] font-bold"><span>{vC} vote{vC > 1 ? 's' : ''}</span><span>{vO} vote{vO > 1 ? 's' : ''}</span></div>
          <div className="h-2 bg-slate-800 rounded-full overflow-hidden flex"><div className="h-full bg-fuchsia-500" style={{ width: `${total ? (vC / total) * 100 : 50}%` }} /><div className="h-full bg-violet-500" style={{ width: `${total ? (vO / total) * 100 : 50}%` }} /></div>
          {st === 'voting' && !isPart && (myV
            ? <p className="text-center text-[11px] text-emerald-300">Tu as voté pour @{myV.side === 'c' ? c.challenger?.username : c.opponent?.username}</p>
            : <div className="flex gap-2">
                <button onClick={() => voteClash(c, 'c')} className="flex-1 py-2 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 text-xs font-bold truncate px-2">Voter @{c.challenger?.username}</button>
                <button onClick={() => voteClash(c, 'o')} className="flex-1 py-2 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 text-xs font-bold truncate px-2">Voter @{c.opponent?.username}</button>
              </div>)}
          {st === 'voting' && isPart && <p className="text-center text-[11px] text-gray-400">Fin des votes dans {left(new Date(c.answered_at).getTime() + CLASH_VOTE_H * 3600000 - Date.now())}</p>}
          {st === 'finished' && <p className="text-center text-xs font-bold text-amber-300">{winner ? `Vainqueur : @${winner === 'c' ? c.challenger?.username : c.opponent?.username}` : 'Égalité'}</p>}
        </div>}

        {!isPart && <button onClick={() => reportClash(c)} className="mt-2 text-[10px] text-gray-500">Signaler</button>}
      </div>
    );
  };

  return (
    <div className="h-full w-full flex flex-col bg-black overflow-hidden relative"
         onTouchStart={e => { gx.current = e.touches[0].clientX; gy.current = e.touches[0].clientY; gt.current = e.target; }}
         onTouchEnd={e => {
           const dx = e.changedTouches[0].clientX - gx.current, dy = e.changedTouches[0].clientY - gy.current, t = gt.current;
           if (t && (['INPUT', 'TEXTAREA', 'AUDIO'].includes(t.tagName) || (t.closest && t.closest('video[controls]')))) return;
           if (dx > 90 && Math.abs(dy) < 60 && Math.abs(dx) > Math.abs(dy) * 2) back();
         }}>
      {toast && <div className="absolute top-16 left-1/2 -translate-x-1/2 z-[60] bg-black/80 border border-white/10 text-xs font-semibold px-4 py-2 rounded-full">⚡ {toast}</div>}

      <div className="flex-1 relative overflow-hidden">
        {/* ===== FIL ===== */}
        {isPlayerTab && (
          <div className="absolute inset-0 swipe bg-app" onTouchStart={e => { tx.current = e.touches[0].clientX; ty.current = e.touches[0].clientY; }} onTouchEnd={onTouchEnd}>
            {cur ? (
              <div className="relative h-full w-full bg-black">
                <video ref={setVideoEl} src={cur.video_url} className="absolute inset-0 h-full w-full object-cover" loop playsInline autoPlay muted={muted} onClick={onVideoTap} />
                <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>
                <Watermark user={cur.username} />
                {hearts.map(h => <div key={h.id} className="absolute z-20 pointer-events-none" style={{ left: h.x - 40, top: h.y - 40, animation: 'heartPop .9s ease-out forwards' }}><Icon n="heart" size={80} fill className="text-fuchsia-500 drop-shadow-[0_0_18px_rgba(217,70,239,0.9)]" /></div>)}
                {(() => { const i = displayed.findIndex(v => v.id === cur.id); const nx = displayed[i + 1]; return nx ? <video key={nx.id} src={nx.video_url} preload="auto" muted playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} /> : null; })()}
                {playIcon && <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20"><div className="w-16 h-16 bg-black/60 rounded-full flex items-center justify-center text-white animate-ping"><Icon n="play" size={26} fill /></div></div>}
                <button onClick={() => { click(); setMenuVideo(cur); }} className={`absolute top-14 right-[4.5rem] z-30 ${btn}`}><Icon n="more" size={20} fill /></button>
                <button onClick={() => { click(); setMuted(!muted); }} className={`absolute top-14 right-4 z-30 ${btn}`}><Icon n={muted ? 'volx' : 'vol'} size={20} /></button>

                <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">
                  <div className="relative mb-1">
                    <div onClick={() => { click(); setViewing({ id: cur.user_id, username: cur.username, avatar_url: cur.avatar_url }); }} className="w-11 h-11 rounded-full border-2 border-fuchsia-500 overflow-hidden bg-purple-900 flex items-center justify-center cursor-pointer"><Av src={cur.avatar_url} /></div>
                    {cur.user_id !== me.id && !following[cur.user_id] && <button onClick={e => follow(cur.user_id, e)} className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-full text-xs font-bold">+</button>}
                  </div>
                  {[
                    ['like', 'heart', liked[cur.id], fmt(cur.likes_count), e => like(cur, e)],
                    ['comment', 'msg', false, fmt(cur.comments_count), () => openComments()],
                    ['save', 'bookmark', saved[cur.id], fmt(cur.saves_count), e => save(cur, e)],
                    ['share', 'send', false, fmt(cur.shares_count), e => share(cur, e)],
                  ].map(([k, ic, on, count, fn]) => (
                    <button key={k} onClick={fn} className="flex flex-col items-center gap-1">
                      <div className={`${btn} ${on ? act : ''}`}><Icon n={ic} size={22} fill={on} /></div>
                      <span className="text-[11px] font-bold drop-shadow">{count}</span>
                    </button>))}
                </div>

                <div className="absolute left-4 bottom-20 right-16 z-30">
                  <div className="flex items-center gap-2 mb-2">
                    <span onClick={() => setViewing({ id: cur.user_id, username: cur.username, avatar_url: cur.avatar_url })} className="font-extrabold text-base cursor-pointer">@{cur.username}</span>
                    <WinBadge n={wins[cur.user_id]} compact />
                    {cur.kind === 'clash' && <span className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-300 bg-amber-400/15 border border-amber-400/30 px-2 py-0.5 rounded-full"><Icon n="trophy" size={11} /> Vainqueur de clash</span>}
                    {following[cur.user_id] && <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">Abonné</span>}
                  </div>
                  <p className="text-sm text-gray-200 mb-2 line-clamp-2">{cur.caption}</p>
                  <p className="text-[11px] text-gray-300 mb-2 flex items-center gap-1.5"><Icon n="eye" size={13} /> {fmt(cur.views_count)} vue{cur.views_count > 1 ? 's' : ''}</p>
                  <div className="text-xs text-gray-200 bg-black/35 px-3 py-1.5 rounded-full w-fit border border-white/15 flex items-center gap-1.5 max-w-[240px]"><Icon n="music" size={12} /><span className="truncate">{cur.music}</span></div>
                </div>
              </div>
            ) : (
              <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400">
                <Icon n="clap" size={56} className="text-fuchsia-400 mb-3" />
                {feedTab === 'following'
                  ? <><p className="text-sm font-semibold text-white mb-1">Aucune vidéo de tes abonnements</p><button onClick={() => setFeedTab('foryou')} className="mt-3 px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Voir "Pour toi"</button></>
                  : <>{tab === 'clips'
                    ? <><p className="text-sm font-semibold text-white mb-1">Aucun clip pour l'instant</p><p className="text-xs mb-3">Sois le premier à publier ton clip !</p><button onClick={() => setShowUpload(true)} className="px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Publier un clip 🚀</button></>
                    : <><p className="text-sm font-semibold text-white mb-1">Aucun freestyle pour l'instant</p><p className="text-xs mb-3">Les freestyles du Studio et de la Battle apparaissent ici.</p><button onClick={() => setTab('studio')} className="px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Aller au Studio 🎙️</button></>}</>}
              </div>
            )}
            
            <div className="absolute top-0 left-0 right-0 z-30 pt-3 pb-2 flex justify-center gap-6 bg-gradient-to-b from-black/90 to-transparent">
              <span className="absolute left-4 top-3 text-[13px] font-black grad-text tracking-wide pointer-events-none">ClipClap</span>
              <button onClick={() => { click(); setSearchQ(''); setSearchRes([]); setShowSearch(true); }} className="absolute right-12 top-2 p-1.5 text-white"><Icon n="search" size={20} /></button>
              <button onClick={() => { click(); openNotifs(); }} className="absolute right-3 top-2 p-1.5 text-white"><Icon n="bell" size={20} />{unread > 0 && <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-fuchsia-500 text-[10px] font-bold flex items-center justify-center">{unread > 9 ? '9+' : unread}</span>}</button>
              {[['following', 'Abonnements'], ['foryou', 'Pour toi']].map(([k, l]) => (
                <button key={k} onClick={() => { click(); setFeedTab(k); }} className={`text-sm font-bold ${feedTab === k ? 'border-b-2 border-fuchsia-500 pb-1' : 'text-white/60'}`}>{l}</button>))}
            </div>
          </div>
        )}

        {/* ===== BATTLE ===== */}
        {tab === 'search' && (
          <div className="absolute inset-0 bg-app overflow-y-auto p-4 pt-10 pb-24">
            <h2 className="text-2xl font-black mb-4 grad-text">Battle & Clash</h2>
            <div className="grid grid-cols-2 gap-3 mb-4">
              <button onClick={() => { click(); if (!battle || bEnded) return say('Aucune battle en cours'); goStudio({ type: 'battle' }); }} className="rounded-2xl p-4 text-left bg-gradient-to-br from-fuchsia-600/40 to-violet-700/30 border border-fuchsia-500/40 active:scale-95 transition">
                <Icon n="flame" size={26} className="text-fuchsia-300" />
                <p className="font-black text-base mt-2">Battle</p>
                <p className="text-[11px] text-gray-300 leading-snug">{battle && !bEnded ? `Instru imposé · ${battle.max_seconds || 45} s` : 'Aucune battle en cours'}</p>
              </button>
              <button onClick={() => { click(); openCompose(); }} className="rounded-2xl p-4 text-left bg-gradient-to-br from-fuchsia-600/40 to-violet-700/30 border border-fuchsia-500/40 active:scale-95 transition">
                <Icon n="swords" size={26} className="text-fuchsia-300" />

                <p className="text-[11px] text-gray-300 leading-snug">Défie un rival · {(clashInstru && clashInstru.max_seconds) || 30} s</p>
              </button>
            </div>
            <button onClick={() => { click(); setBeatShop(null); setTab('beats'); }} className="w-full rounded-2xl p-4 mb-4 text-left bg-gradient-to-br from-amber-500/25 to-fuchsia-600/25 border border-amber-400/40 active:scale-95 transition flex items-center gap-3">

        <button onClick={() => { click(); setTab('clash'); setViewing(null); }} className="flex flex-col items-center gap-1 -mt-3">
          <div className={`w-12 h-12 rounded-2xl bg-gradient-to-r from-fuchsia-500 to-violet-600 flex items-center justify-center clip-glow ${tab === 'clash' ? 'ring-2 ring-white' : ''}`}><Icon n="swords" size={26} className="text-white" /></div>
          <span className={`text-[10px] ${tab === 'clash' ? 'text-fuchsia-400 font-bold drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]' : 'text-gray-400'}`}>Clash</span>
        </button>
        {[['studio', 'mic', 'Studio'], ['profile', 'user', 'Profil']].map(([k, i, l]) => (
          <button key={k} onClick={() => { click(); setTab(k); setViewing(null); }} className={`flex flex-col items-center gap-1 ${tab === k ? 'text-fuchsia-400 font-bold drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]' : 'text-gray-400'}`}><Icon n={i} size={22} /><span className="text-[10px]">{l}</span></button>))}
      </div>

      {/* ===== NOTIFICATIONS ===== */}
      {showNotifs && (
        <Sheet onClose={() => setShowNotifs(false)} height="h-[75%]">
          <div className="flex items-center justify-between p-4 border-b border-white/10"><h3 className="text-sm font-extrabold">Notifications</h3><button onClick={() => setShowNotifs(false)} className="text-gray-400 text-lg px-2">✕</button></div>
          <div className="p-3 space-y-1">
            {notifs.filter(n => !blocked[n.actor_id]).length === 0 && <p className="text-center text-xs text-gray-500 pt-10">Aucune notification pour le moment.</p>}
            {notifs.filter(n => !blocked[n.actor_id]).map(n => (
              <button key={n.id} onClick={() => openNotif(n)} className={`w-full flex items-center gap-3 p-3 rounded-2xl text-left ${n.read ? '' : 'bg-fuchsia-500/10'}`}>
                <div className="w-10 h-10 rounded-full bg-purple-900 overflow-hidden flex items-center justify-center flex-shrink-0"><Av src={n.profiles?.avatar_url} /></div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs"><span className="font-bold">@{n.profiles?.username}</span> {n.type === 'like' ? 'a aimé ta vidéo' : n.type === 'follow' ? "s'est abonné à toi" : n.type === 'clash' ? `t'a lancé un clash : réponds avant ${CLASH_REPLY_H} h` : n.type === 'clash_reply' ? 'a répondu à ton clash' : 'a commenté : '}{n.type === 'comment' && <span className="text-gray-300">« {n.comment_text} »</span>}</p>
                  <p className="text-[10px] text-gray-500 mt-0.5">{ago(n.created_at)}</p>
                </div>
              </button>))}
          </div>
        </Sheet>
      )}

      {/* ===== RECHERCHE D'UTILISATEURS ===== */}
      {showSearch && (
        <Sheet onClose={() => setShowSearch(false)} height="h-[75%]">
          <div className="flex items-center gap-2 p-4 border-b border-white/10">
            <Icon n="search" size={18} className="text-gray-400" />
            <input autoFocus value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Rechercher un pseudo..." className="flex-1 min-w-0 bg-transparent text-sm focus:outline-none" />
            <button onClick={() => setShowSearch(false)} className="text-gray-400 text-lg px-2">✕</button>
          </div>
          <div className="p-3 space-y-1">
            {searchQ.trim().length < 2 && <p className="text-center text-xs text-gray-500 pt-10">Tape au moins 2 lettres.</p>}
            {searchQ.trim().length >= 2 && searchRes.length === 0 && <p className="text-center text-xs text-gray-500 pt-10">Aucun utilisateur trouvé.</p>}
            {searchRes.map(u => (
              <button key={u.id} onClick={() => { setShowSearch(false); setViewing({ id: u.id, username: u.username, avatar_url: u.avatar_url }); }} className="w-full flex items-center gap-3 p-3 rounded-2xl text-left hover:bg-white/5">
                <div className="w-10 h-10 rounded-full bg-purple-900 overflow-hidden flex items-center justify-center flex-shrink-0"><Av src={u.avatar_url} /></div>
                <div className="min-w-0"><p className="text-sm font-bold">@{u.username}</p>{u.display_name && <p className="text-[11px] text-gray-400">{u.display_name}</p>}</div>
              </button>))}
          </div>
        </Sheet>
      )}

      {/* ===== OPTIONS DE LA VIDÉO ===== */}
      {menuVideo && (() => {
        const v = menuVideo; const mine = v.user_id === me.id;
        const reasons = ['Contenu inapproprié', 'Harcèlement ou haine', "Droits d'auteur", 'Spam'];
        return (
          <Sheet onClose={() => setMenuVideo(null)}>
            <div className="p-5 space-y-3">
              {!mine && <>
                <p className="text-xs font-bold text-gray-300">Signaler cette vidéo</p>
                <div className="flex flex-wrap gap-2">{reasons.map(r => <button key={r} onClick={() => reportVideo(v, r)} className="text-xs px-3 py-2 rounded-full bg-white/10 border border-white/10">{r}</button>)}</div>
                <button onClick={() => blockUser(v)} className="w-full py-3 rounded-xl bg-white/10 text-sm font-bold">Bloquer @{v.username}</button>
              </>}
              {(mine || isAdmin) && <button onClick={() => removeFromMenu(v)} className="w-full py-3 rounded-xl bg-red-600/80 text-sm font-bold">{mine ? 'Supprimer ma vidéo' : 'Retirer cette vidéo (admin)'}</button>}
              <button onClick={() => setMenuVideo(null)} className="w-full py-3 rounded-xl text-sm text-gray-400">Annuler</button>
            </div>
          </Sheet>
        );
      })()}

      {/* ===== RÉGLAGES ===== */}
      {showSettings && (
        <Sheet onClose={() => setShowSettings(false)} height="max-h-[85%]">
          <div className="p-5 space-y-2">
            <h3 className="text-base font-extrabold mb-2">Réglages</h3>
            <p className="text-[11px] text-gray-400 leading-snug bg-white/5 rounded-xl p-3">Installe ClipClap comme une vraie app : sur iPhone, appuie sur Partager puis « Sur l'écran d'accueil ». Sur Android, menu du navigateur puis « Installer l'application ».</p>
            <button onClick={() => { setShowSettings(false); setTourStep(0); setShowTour(true); }} className="w-full text-left py-3 px-4 rounded-xl bg-white/5 text-sm">Revoir le tutoriel</button>
            <button onClick={() => setLegal('cgu')} className="w-full text-left py-3 px-4 rounded-xl bg-white/5 text-sm">Conditions d'utilisation</button>
            <button onClick={() => setLegal('privacy')} className="w-full text-left py-3 px-4 rounded-xl bg-white/5 text-sm">Politique de confidentialité</button>
            {blockedList.length > 0 && <div className="pt-2">
              <p className="text-xs font-bold text-gray-400 mb-1">Utilisateurs bloqués</p>
              {blockedList.map(b => <div key={b.blocked_id} className="flex items-center justify-between py-2 text-sm"><span>@{b.profiles?.username}</span><button onClick={() => unblock(b.blocked_id)} className="text-xs px-3 py-1.5 rounded-full bg-white/10">Débloquer</button></div>)}
            </div>}
            <button onClick={() => { setShowSettings(false); sb.auth.signOut(); }} className="w-full py-3 rounded-xl bg-white/10 text-sm font-bold mt-2">Se déconnecter</button>
            <button onClick={deleteAccount} className="w-full py-3 rounded-xl text-sm font-bold text-red-400 border border-red-500/30">Supprimer mon compte</button>
            <p className="text-center text-[10px] text-gray-500 pt-2">Contact : {CONTACT_EMAIL}</p>
          </div>
        </Sheet>
      )}
      <LegalSheet type={legal} onClose={() => setLegal(null)} />

      {/* ===== CLASH OUVERT DEPUIS UN PROFIL ===== */}
      {clashView && (
        <Sheet onClose={() => setClashView(null)} height="max-h-[92%]" z="z-[60]">
          <div className="p-4">
            {clashView.clash
              ? renderClash(clashView.clash)
              : <video controls autoPlay playsInline src={clashView.video.video_url} className="w-full rounded-xl bg-black max-h-[70vh]" />}
          </div>
        </Sheet>
      )}

      {/* ===== CONFETTIS ===== */}
      {confetti > 0 && <Confetti key={confetti} />}

      {/* ===== TUTORIEL DE BIENVENUE ===== */}
      {showTour && (() => {
        const slides = [
          { icon: 'clap', title: 'Freestyle', text: "Filme ton freestyle au Studio. Il passe sur l'accueil avec le filigrane ClipClap : partage-le partout." },
          { icon: 'flame', title: 'Battle', text: "Une instru imposée, un chrono, la communauté vote. Le plus de votes gagne un trophée." },
          { icon: 'swords', title: 'Clash', text: `Tag un rival : il a ${CLASH_REPLY_H} h pour te répondre. Vos deux vidéos côte à côte, la communauté tranche.` },
        ];
        const last = tourStep === slides.length - 1; const sl = slides[tourStep];
        const finish = () => { try { localStorage.setItem('cc_tour_done', '1'); } catch (e) {} setShowTour(false); setTourStep(0); };
        return (
          <div className="absolute inset-0 z-[80] bg-app flex flex-col items-center justify-between px-8 py-10 text-center"
               onTouchStart={e => { window._tx = e.touches[0].clientX; }}
               onTouchEnd={e => { const d = e.changedTouches[0].clientX - window._tx; if (d < -60 && !last) setTourStep(x => x + 1); if (d > 60 && tourStep > 0) setTourStep(x => x - 1); }}>
            <button onClick={finish} className="self-end text-xs text-gray-400 px-2 py-1">Passer</button>
            <div key={tourStep} className="flex flex-col items-center" style={{ animation: 'fadeUp .5s both' }}>
              <div className="w-28 h-28 rounded-[2rem] bg-gradient-to-br from-fuchsia-500 to-violet-600 flex items-center justify-center clip-glow mb-8"><Icon n={sl.icon} size={56} className="text-white" /></div>
              <h2 className="text-3xl font-black grad-text mb-3">{sl.title}</h2>
              <p className="text-sm text-gray-300 leading-relaxed max-w-xs">{sl.text}</p>
            </div>
            <div className="w-full max-w-xs space-y-3">
              <div className="flex justify-center gap-2">{slides.map((_, i) => <span key={i} className={`h-1.5 rounded-full transition-all ${i === tourStep ? 'w-6 bg-fuchsia-500' : 'w-1.5 bg-white/20'}`} />)}</div>
              {last ? <>
                <button onClick={() => { finish(); setTab('studio'); }} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-extrabold text-sm">Lancer mon premier freestyle</button>
                <button onClick={() => shareProfile(me.username)} className="w-full py-3 rounded-xl bg-white/10 text-sm font-bold flex items-center justify-center gap-2"><Icon n="send" size={16} /> Inviter un pote à me clasher</button>
                <button onClick={finish} className="w-full py-2 text-xs text-gray-400">Explorer d'abord</button>
              </> : <button onClick={() => setTourStep(x => x + 1)} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-extrabold text-sm">Suivant</button>}
            </div>
          </div>
        );
      })()}

      {/* ===== LANCER UN CLASH ===== */}
      {showCompose && (
        <Sheet onClose={() => setShowCompose(false)} height="h-[85%]">
          <div className="p-5 space-y-5">
            <h3 className="text-base font-extrabold">Lancer un clash</h3>
            <div>
              <p className="text-xs font-bold text-gray-300 mb-2">1. Qui veux-tu défier ?</p>
              {compose.opp
                ? <div className="flex items-center justify-between bg-white/5 rounded-xl p-3"><span className="text-sm font-bold">@{compose.opp.username}</span><button onClick={() => setCompose(c => ({ ...c, opp: null }))} className="text-xs text-gray-400">Changer</button></div>
                : <>
                    <input value={oppQ} onChange={e => setOppQ(e.target.value)} placeholder="Rechercher un pseudo..." className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-fuchsia-500" />
                    <div className="mt-2 space-y-1">{oppRes.map(u => (
                      <button key={u.id} onClick={() => setCompose(c => ({ ...c, opp: u }))} className="w-full flex items-center gap-3 p-2.5 rounded-xl text-left hover:bg-white/5">
                        <div className="w-8 h-8 rounded-full bg-purple-900 overflow-hidden flex items-center justify-center"><Av src={u.avatar_url} /></div>
                        <span className="text-sm font-bold">@{u.username}</span>
                      </button>))}</div>
                  </>}
            </div>
            <div className="rounded-xl bg-white/5 border border-white/10 p-3 text-xs text-gray-300">
              Instru imposé : <span className="font-bold text-white">{clashInstru ? clashInstru.title : 'aucun pour le moment'}</span> · {(clashInstru && clashInstru.max_seconds) || 30} s de freestyle
            </div>
            <div>
              <button onClick={() => {
                if (!compose.opp) return say('Choisis un adversaire');
                setShowCompose(false);
                goStudio({ type: 'challenge', opp: compose.opp, max: (clashInstru && clashInstru.max_seconds) || 30, instruUrl: clashInstru && clashInstru.instru_url, instruTitle: clashInstru && clashInstru.title });
              }} className="w-full py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-extrabold text-sm flex items-center justify-center gap-2 mb-2"><Icon n="mic" size={16} /> Aller au Studio</button>
              {uploading && <div className="h-1.5 bg-white/10 rounded-full overflow-hidden mt-3"><div className="h-full bg-gradient-to-r from-fuchsia-500 to-violet-600" style={{ width: `${progress}%` }} /></div>}
            </div>
            <p className="text-[11px] text-gray-500 leading-snug">Ton adversaire a {CLASH_REPLY_H} h pour répondre. Sans réponse, il perd par forfait. Ensuite, la communauté vote pendant {CLASH_VOTE_H} h.</p>
          </div>
        </Sheet>
      )}

{/* ===== NOUVELLE BATTLE (admin) ===== */}
      {showBattleForm && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <form onSubmit={createBattle} className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Nouvelle battle</h3>
            <input value={bTitle} onChange={e => setBTitle(e.target.value)} placeholder="Titre (ex : Beat de la Semaine #2)" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <input type="file" accept="audio/*" onChange={e => setBFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
            <div className="flex items-center gap-2 text-xs text-gray-300"><span>Durée (jours)</span><input type="number" min="1" max="30" value={bDays} onChange={e => setBDays(e.target.value)} className="w-16 bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-center" /></div>
            <div className="flex items-center gap-2 text-xs text-gray-300"><span>Temps de freestyle (secondes)</span><input type="number" min="10" max="300" value={bSecs} onChange={e => setBSecs(e.target.value)} className="w-16 bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-center" /></div>
            <p className="text-[10px] text-gray-500">La battle précédente est remplacée. Ses votes et ses résultats restent en base.</p>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowBattleForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button disabled={uploading} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold disabled:opacity-60">{uploading ? 'Envoi...' : 'Lancer 🏆'}</button>
            </div>
          </form>
        </div>
      )}

      {/* ===== INSTRU DU CLASH (admin) ===== */}
      {showBmForm && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowBmForm(false)}>
          <form onSubmit={saveBeatmaker} onClick={e => e.stopPropagation()} className="w-full max-w-sm max-h-[92%] overflow-y-auto bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Ouvrir ma boutique de beatmaker</h3>
            <input value={bmF.name} onChange={e => setBmF({ ...bmF, name: e.target.value })} maxLength={30} placeholder="Nom de beatmaker" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <textarea value={bmF.bio} onChange={e => setBmF({ ...bmF, bio: e.target.value })} maxLength={200} rows={3} placeholder="Ton style, tes références (facultatif)" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500 resize-none" />
            <label className="flex items-start gap-2.5 text-[11px] text-gray-300 leading-snug">
              <input type="checkbox" checked={bmF.rights} onChange={e => setBmF({ ...bmF, rights: e.target.checked })} className="mt-0.5 accent-fuchsia-500 w-4 h-4 flex-shrink-0" />
              <span>Je certifie être l'auteur des instrus que je vends et détenir tous les droits dessus (aucun sample sans autorisation).</span>
            </label>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowBmForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold">Ouvrir</button>
            </div>
          </form>
        </div>
      )}
      {showBeatForm && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => { if (!bfBusy) setShowBeatForm(false); }}>
          <form onSubmit={publishBeat} onClick={e => e.stopPropagation()} className="w-full max-w-sm max-h-[92%] overflow-y-auto bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Mettre un instru en vente</h3>
            <input value={bf.title} onChange={e => setBf({ ...bf, title: e.target.value })} maxLength={60} placeholder="Titre de l'instru" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <div>
              <input type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" onChange={e => setBf({ ...bf, file: e.target.files[0] || null })} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
              <p className="text-[10px] text-gray-500 mt-1.5">MP3 ou WAV, 15 Mo max. L'aperçu de 15 s est créé automatiquement ; le fichier complet reste privé.</p>
            </div>
            <div className="grid grid-cols-3 gap-2">
              <label className="text-[10px] text-gray-400">BPM
                <input inputMode="numeric" value={bf.bpm} onChange={e => setBf({ ...bf, bpm: e.target.value.replace(/\D/g, '').slice(0, 3) })} placeholder="95" className="mt-1 w-full bg-white/5 border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-fuchsia-500" />
              </label>
              <label className="text-[10px] text-gray-400">Style
                <select value={bf.style} onChange={e => setBf({ ...bf, style: e.target.value })} className="mt-1 w-full bg-[#1a1233] border border-white/10 rounded-xl px-2 py-2 text-xs text-white focus:outline-none focus:border-fuchsia-500">
                  {BEAT_STYLES.map(st => <option key={st} value={st}>{st}</option>)}
                </select>
              </label>
              <label className="text-[10px] text-gray-400">Prix (€)
                <input inputMode="decimal" value={bf.price} onChange={e => setBf({ ...bf, price: e.target.value.replace(/[^0-9.,]/g, '').slice(0, 6) })} placeholder="5" className="mt-1 w-full bg-white/5 border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-fuchsia-500" />
              </label>
            </div>
            <p className="text-[10px] text-gray-500 -mt-2">Prix de 5 € à 500 €. ClipClap prélèvera une commission à l'ouverture des paiements.</p>
            <label className="flex items-start gap-2.5 text-[11px] text-gray-300 leading-snug">
              <input type="checkbox" checked={bf.rights} onChange={e => setBf({ ...bf, rights: e.target.checked })} className="mt-0.5 accent-fuchsia-500 w-4 h-4 flex-shrink-0" />
              <span>Je certifie être l'auteur de cet instru et détenir tous les droits dessus.</span>
            </label>
            {bfBusy && <p className="text-xs text-fuchsia-300 text-center">{bfBusy}</p>}
            <div className="flex gap-2">
              <button type="button" disabled={!!bfBusy} onClick={() => setShowBeatForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold disabled:opacity-50">Annuler</button>
              <button disabled={!!bfBusy} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold disabled:opacity-60">{bfBusy ? 'Patiente…' : 'Publier'}</button>
            </div>
          </form>
        </div>
      )}
      {showClashInstruForm && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <form onSubmit={createClashInstru} className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Instru du Clash</h3>
            <input value={ciTitle} onChange={e => setCiTitle(e.target.value)} placeholder="Titre (ex : Instru Clash #3)" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <input type="file" accept="audio/*" onChange={e => setCiFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
            <div className="flex items-center gap-2 text-xs text-gray-300"><span>Temps de freestyle (secondes)</span><input type="number" min="10" max="300" value={ciSecs} onChange={e => setCiSecs(e.target.value)} className="w-16 bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-center" /></div>
            <p className="text-[10px] text-gray-500">Ne change que les nouveaux clashs. Les clashs déjà lancés gardent leur instru.</p>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowClashInstruForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button disabled={uploading} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold disabled:opacity-60">{uploading ? 'Envoi...' : 'Enregistrer'}</button>
            </div>
          </form>
        </div>
      )}

      {/* ===== COMMENTAIRES ===== */}
      {showComments && cur && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end justify-center">
          <div className="absolute inset-0" onClick={() => setShowComments(false)} />
          <div className="relative w-full max-w-md h-[70%] bg-[#120c24] border-t border-white/10 rounded-t-3xl flex flex-col"
               style={{ transform: `translateY(${sheetY}px)`, transition: sheetDrag ? 'none' : 'transform .25s ease' }}
               onTouchStart={sheetStart} onTouchMove={sheetMove} onTouchEnd={sheetEnd}>
            <div className="w-full flex justify-center pt-2.5 pb-1"><div className="w-12 h-1.5 bg-white/25 rounded-full"></div></div>
            <div className="flex items-center justify-between p-4 border-b border-white/10">
              <h3 className="text-sm font-extrabold">{comments.length} commentaire{comments.length > 1 ? 's' : ''}</h3>
              <button onClick={() => setShowComments(false)} className="text-gray-400 text-lg">✕</button>
            </div>
            <div ref={listRef} className="flex-1 overflow-y-auto overscroll-contain p-4 space-y-4">
              {(() => {
                const vis = comments.filter(c => !blocked[c.user_id]);
                const tops = vis.filter(c => !c.parent_id);
                const Row = (c, isReply) => (
                  <div key={c.id} className={`flex gap-3 ${isReply ? 'ml-11' : ''}`}>
                    <div className={`${isReply ? 'w-6 h-6 text-[10px]' : 'w-8 h-8 text-xs'} rounded-full bg-fuchsia-500 flex items-center justify-center font-bold flex-shrink-0`}>{(c.profiles?.username || '?')[0].toUpperCase()}</div>
                    <div className="flex-1 min-w-0">
                      <div className="flex gap-2"><span className="text-xs font-bold text-gray-300">@{c.profiles?.username}</span><span className="text-[10px] text-gray-500">{ago(c.created_at)}</span></div>
                      <p className="text-xs mt-0.5 break-words">{c.text}</p>
                      <div className="flex gap-4 mt-1">
                        <button onClick={() => { setReplyTo(c); setCText(isReply ? `@${c.profiles?.username} ` : ''); }} className="text-xs text-neutral-400">Répondre</button>
                        {(c.user_id === me.id || isAdmin) && <button onClick={() => deleteComment(c)} className="text-xs text-neutral-500">Supprimer</button>}
                        {c.user_id !== me.id && <button onClick={() => reportComment(c)} className="text-xs text-neutral-500">Signaler</button>}
                      </div>
                    </div>
                  </div>
                );
                return tops.length ? tops.map(c => (
                  <div key={c.id} className="space-y-3">
                    {Row(c, false)}
                    {vis.filter(r => r.parent_id === c.id).sort((x, y) => new Date(x.created_at) - new Date(y.created_at)).map(r => Row(r, true))}
                  </div>)) : <p className="text-center text-xs text-gray-400 pt-10">Aucun commentaire. Sois le premier !</p>;
              })()}
            </div>
            {replyTo && <div className="flex items-center justify-between px-4 py-2 bg-neutral-800 text-xs text-gray-300"><span>Réponse à @{replyTo.profiles?.username}</span><button onClick={() => { setReplyTo(null); setCText(''); }} className="text-gray-400 px-2">✕</button></div>}
            <form onSubmit={addComment} className="flex gap-2 p-3 bg-neutral-900 border-t border-neutral-800">
              <input value={cText} onChange={e => setCText(e.target.value)} placeholder="Ajouter un commentaire..." className="flex-1 min-w-0 bg-neutral-800 px-4 py-2.5 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
              <button className="bg-fuchsia-500 px-4 py-2.5 rounded-full text-sm font-semibold">Envoyer</button>
            </form>
          </div>
        </div>
      )}

      {/* ===== PROFIL D'UN CRÉATEUR ===== */}
      {viewing && (() => {
        const st = stats[viewing.id]; const list = videos.filter(v => v.user_id === viewing.id); const isMe = viewing.id === me.id;
        const p = st?.profile || viewing;
        return (
          <div className="absolute inset-0 z-50 bg-app overflow-y-auto p-4 pt-10 pb-24"
               >
            <button onClick={() => setViewing(null)} className="mb-4 w-9 h-9 bg-white/10 rounded-full text-base font-bold">‹</button>
            <div className="flex flex-col items-center">
              <div className="w-20 h-20 rounded-full border-2 border-fuchsia-500 overflow-hidden bg-purple-900 flex items-center justify-center mb-3"><Av src={p.avatar_url} size="text-3xl" /></div>
              <h2 className="text-lg font-extrabold">{p.display_name || p.username}</h2>
              <p className="text-xs text-gray-400 mb-2">@{p.username}</p>
              <div className="mb-2"><WinBadge n={wins[viewing.id]} /></div>
              {p.bio && <p className="text-xs text-gray-200 text-center max-w-xs mb-3">{p.bio}</p>}
              <div className="flex gap-6 mb-4 text-center">
                <div><span className="block font-bold text-sm">{list.length}</span><span className="text-[10px] text-gray-400">Vidéos</span></div>
                <div><span className="block font-bold text-sm">{st ? st.followers : 0}</span><span className="text-[10px] text-gray-400">Abonnés</span></div>
                <div><span className="block font-bold text-sm">{fmt(list.reduce((s, v) => s + v.likes_count, 0))}</span><span className="text-[10px] text-gray-400">J'aime</span></div>
              </div>
              {!isMe && <button onClick={e => follow(viewing.id, e)} className={`w-36 py-2 rounded-full text-xs font-bold mb-4 ${following[viewing.id] ? 'bg-white/20' : 'bg-gradient-to-r from-fuchsia-500 to-violet-600'}`}>{following[viewing.id] ? 'Abonné' : "S'abonner"}</button>}
              {!isMe && <button onClick={() => { const o = { id: viewing.id, username: p.username, avatar_url: p.avatar_url }; setViewing(null); setCompose({ opp: o }); setOppQ(''); setOppRes([]); setShowCompose(true); }} className="w-52 py-2.5 rounded-full text-xs font-bold mb-4 bg-gradient-to-r from-fuchsia-500 to-violet-600 flex items-center justify-center gap-2"><Icon n="swords" size={14} /> Défier @{p.username} en clash</button>}
            </div>
            <div className="border-t border-white/10 pt-4">{Grid({ list, canDelete: false })}</div>
          </div>
        );
      })()}

      {/* ===== MODIFIER PROFIL ===== */}
      {editing && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Modifier mon profil</h3>
            <input value={eName} onChange={e => setEName(e.target.value)} placeholder="Nom d'affichage" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <textarea value={eBio} onChange={e => setEBio(e.target.value)} rows="2" placeholder="Bio" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-fuchsia-500 resize-none"></textarea>
            <div className="flex items-center gap-3">
              {eAvatar && <img src={eAvatar} className="w-10 h-10 rounded-full object-cover" alt="" />}
              <input type="file" accept="image/*" onChange={e => pickAvatar(e.target.files[0])} className="flex-1 min-w-0 text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
            </div>
            <div className="flex gap-2">
              <button onClick={() => setEditing(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button onClick={saveProfile} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold">Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== APERÇU FREESTYLE ===== */}
      {previewUrl && (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-between p-6">
          <h2 className="text-xl font-bold pt-4">Aperçu de ton Freestyle 🎤</h2>
          <div className="relative w-full max-w-sm rounded-2xl overflow-hidden bg-black">
            <video src={previewUrl} controls autoPlay playsInline className="w-full max-h-[60vh] object-contain" />
            <Watermark user={me.username} gid="wmp" />
          </div>
          <div className="w-full max-w-sm flex gap-4 pb-6">
            <button onClick={() => { setPreviewUrl(null); setBlob(null); setRecMode(true); }} className="flex-1 py-3 rounded-xl bg-gray-800 font-semibold">Recommencer 🔄</button>
            <button disabled={uploading} onClick={publishFreestyle} className="flex-1 py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-semibold disabled:opacity-60">{uploading ? `${progress} %` : 'Publier 🚀'}</button>
          </div>
        </div>
      )}

      {/* ===== CAMÉRA & TÉLÉPROMPTEUR ===== */}
      {recMode && (
        <div className="fixed inset-0 bg-black z-50 flex flex-col justify-between overflow-hidden">
          <div className="absolute top-0 inset-x-0 z-50 flex items-center justify-between p-4">
            <span className="bg-pink-600/80 px-3 py-1.5 rounded-full text-xs font-bold uppercase">{intro ? 'Présentation…' : recording ? `${recSec} s / ${recMax} s` : `Max ${recMax} s`}</span>
            <button onClick={closeStudio} className="w-10 h-10 bg-white/20 rounded-full">✕</button>
          </div>
          <div className="absolute inset-0 bg-zinc-900">
            <video autoPlay playsInline muted className="w-full h-full object-cover scale-x-[-1]"
              ref={node => { camRef.current = node; if (node && !node.srcObject) navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'user' }, audio: true }).then(s => { node.srcObject = s; }).catch(() => {}); }} />
          </div>
          {intro && <div className="absolute inset-0 z-20 flex items-center justify-center pointer-events-none px-6">
            {intro.mic
              ? <div className="w-28 h-28 rounded-full bg-fuchsia-500/30 border-2 border-fuchsia-400 flex items-center justify-center" style={{ animation: 'pulseGlow 1.2s ease-in-out infinite' }}><Icon n="mic" size={52} className="text-white" /></div>
              : <p className="text-[9rem] leading-none font-black grad-text" style={{ filter: 'drop-shadow(0 4px 24px rgba(0,0,0,.8))' }}>{intro.count}</p>}
          </div>}
          <div className="relative z-10 mt-20 mx-4 max-h-48 overflow-y-auto bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-4 text-center">
            <p className="text-xs uppercase tracking-widest text-pink-400 font-bold mb-2">Téléprompteur 📜</p>
            {lyrics ? <p className="text-lg leading-relaxed whitespace-pre-wrap">{lyrics}</p> : <p className="text-sm text-gray-400 italic">Aucune parole écrite dans le bloc-notes.</p>}
          </div>
          <div className="relative z-10 p-6 pb-10 flex justify-center bg-gradient-to-t from-black/90 to-transparent">
            <button onClick={toggleRec} className={`flex items-center justify-center w-20 h-20 rounded-full border-4 border-white bg-red-600 ${recording ? 'animate-pulse' : ''}`}>
              <div className={`bg-white transition-all ${recording ? 'w-6 h-6 rounded-sm' : 'w-8 h-8 rounded-md'}`}></div>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ClipClapApp />);
</script>
</body>
</html>
