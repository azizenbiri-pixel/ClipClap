<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07040f] text-white select-none overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_POSTS = [
      {
        id: 1,
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes",
        likes: 12400,
        comments: 342,
        shares: 89,
        liked: false,
        bookmarked: false,
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4"
      },
      {
        id: 2,
        user: "@cyber_dancer",
        desc: "Session freestyle sous les néons 💃✨ #dance #cyberpunk",
        likes: 45200,
        comments: 1205,
        shares: 540,
        liked: false,
        bookmarked: false,
        video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4"
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [toastMessage, setToastMessage] = useState("");
      
      const touchStartY = useRef(0);
      const touchEndY = useRef(0);

      useEffect(() => {
        const totalDuration = 2500;
        const stepTime = 50; 
        const increment = (stepTime / totalDuration) * 100;

        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 200);
              return 100;
            }
            return prev + increment;
          });
        }, stepTime);

        return () => clearInterval(interval);
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2000);
      };

      const handleTouchStart = (e) => {
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        touchEndY.current = e.changedTouches[0].clientY;
        const diff = touchStartY.current - touchEndY.current;

        if (Math.abs(diff) > 50) {
          if (diff > 0 && currentIndex < posts.length - 1) {
            setCurrentIndex(prev => prev + 1);
          } else if (diff < 0 && currentIndex > 0) {
            setCurrentIndex(prev => prev - 1);
          }
        }
      };

      const toggleLike = (id) => {
        setPosts(posts.map(p => {
          if (p.id === id) {
            return {
              ...p,
              liked: !p.liked,
              likes: p.liked ? p.likes - 1 : p.likes + 1
            };
          }
          return p;
        }));
      };

      const toggleBookmark = (id) => {
        setPosts(posts.map(p => {
          if (p.id === id) {
            return { ...p, bookmarked: !p.bookmarked };
          }
          return p;
        }));
      };

      // 1. SPLASH SCREEN INITIAL (AVEC CLAPPERBOARD SVG D'ORIGINE)
      if (showSplash) {
        return (
          <div class="h-dvh w-full max-w-md mx-auto bg-gradient-to-b from-[#181033] via-[#0d071d] to-[#07040f] flex flex-col items-center justify-between py-16 px-6 relative overflow-hidden border-x border-purple-900/20">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-[#ff3b96]/15 blur-[90px] rounded-full pointer-events-none"></div>
            <div></div>

            <div class="flex flex-col items-center text-center z-10 space-y-4">
              <div class="relative mb-2">
                <svg width="110" height="110" viewBox="0 0 100 100" fill="none">
                  <path d="M18 32 L78 18 L86 32 L26 46 Z" fill="url(#pink-grad)" />
                  <path d="M32 28 L40 43" stroke="#ffffff" stroke-width="3.5" opacity="0.9" stroke-linecap="round" />
                  <path d="M52 23 L60 38" stroke="#ffffff" stroke-width="3.5" opacity="0.9" stroke-linecap="round" />
                  <rect x="18" y="42" width="68" height="46" rx="12" fill="none" stroke="url(#pink-grad)" stroke-width="5" />
                  <polygon points="54,57 54,73 68,65" fill="#ffffff" />
                  <circle cx="36" cy="65" r="11" fill="#0d071d" stroke="#ff3b96" stroke-width="2" />
                  <text x="31" y="70" fill="#ff74b8" font-size="11" font-weight="bold">🎵</text>
                  <defs>
                    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ff3b96" />
                      <stop offset="100%" stop-color="#9d3bff" />
                    </linearGradient>
                  </defs>
                </svg>
              </div>
              <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-[0_0_15px_#ff3b96]">ClipClap</h1>
              <p class="text-[10px] font-bold tracking-[0.22em] text-[#ff3b96] uppercase pt-1">Short Video Social Network</p>
            </div>

            <div class="w-full max-w-[240px] z-10">
              <div class="w-full h-[5px] bg-purple-950/90 rounded-full overflow-hidden border border-purple-800/30">
                <div class="h-full bg-gradient-to-r from-[#ff3b96] to-[#9d3bff] rounded-full shadow-[0_0_10px_#ff3b96] transition-all duration-75" style={{ width: `${progress}%` }}></div>
              </div>
            </div>
          </div>
        );
      }

      const currentPost = posts[currentIndex];

      // 2. FLUX VIDÉO PLEIN ÉCRAN
      return (
        <div class="h-dvh w-full max-w-md mx-auto bg-black flex flex-col relative overflow-hidden border-x border-white/5">
          
          {toastMessage && (
            <div class="absolute top-6 left-1/2 -translate-x-1/2 z-50 bg-[#ff3b96] text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">
              {toastMessage}
            </div>
          )}

          {/* En-tête haut */}
          <div class="absolute top-0 left-0 right-0 p-5 flex justify-between items-center z-30 bg-gradient-to-b from-black/80 to-transparent">
            <span class="text-xl font-extrabold tracking-tight text-white drop-shadow-[0_0_8px_#ff3b96]">ClipClap</span>
            <div class="flex gap-4 text-sm font-bold text-gray-400">
              <span class="text-white border-b-2 border-[#ff3b96] pb-0.5">Pour toi</span>
              <span onClick={() => showToast("Onglet Suivis bientôt dispo")}>Abonnements</span>
            </div>
            <button onClick={() => showToast("Recherche...")} class="text-lg">🔍</button>
          </div>

          {/* Zone vidéo interactive */}
          <div 
            class="flex-1 w-full h-full relative"
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
          >
            <video 
              key={currentPost.id}
              src={currentPost.video} 
              class="w-full h-full object-cover" 
              autoPlay 
              loop 
              playsInline 
            />

            {/* Overlay d'informations */}
            <div class="absolute bottom-6 left-4 right-16 z-20 space-y-2">
              <h3 class="font-extrabold text-base text-white drop-shadow-md">{currentPost.user}</h3>
              <p class="text-xs text-gray-200 line-clamp-2 drop-shadow-md">{currentPost.desc}</p>
            </div>

            {/* Boutons à droite */}
            <div class="absolute bottom-6 right-3 z-20 flex flex-col items-center gap-5">
              <button onClick={() => toggleLike(currentPost.id)} class="flex flex-col items-center gap-1">
                <div class={`w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-xl border border-white/10 ${currentPost.liked ? 'text-[#ff3b96]' : 'text-white'}`}>
                  {currentPost.liked ? '❤️' : '🤍'}
                </div>
                <span class="text-[10px] font-bold">{currentPost.likes}</span>
              </button>

              <button onClick={() => showToast("Commentaires...")} class="flex flex-col items-center gap-1">
                <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-xl border border-white/10">
                  💬
                </div>
                <span class="text-[10px] font-bold">{currentPost.comments}</span>
              </button>

              <button onClick={() => toggleBookmark(currentPost.id)} class="flex flex-col items-center gap-1">
                <div class={`w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-xl border border-white/10 ${currentPost.bookmarked ? 'text-yellow-400' : 'text-white'}`}>
                  {currentPost.bookmarked ? '⭐' : '🔖'}
                </div>
                <span class="text-[10px] font-bold">Fav</span>
              </button>
            </div>
          </div>

          {/* Navigation bas */}
          <div class="h-16 shrink-0 bg-black/90 backdrop-blur-lg border-t border-white/10 flex justify-around items-center z-30">
            <button class="flex flex-col items-center justify-center w-full h-full text-[#ff3b96] font-bold">
              <span class="text-xl">🏠</span>
              <span class="text-[10px]">Accueil</span>
            </button>

            <button 
              onClick={() => showToast("Module de publication prêt")}
              class="flex items-center justify-center w-12 h-9 rounded-xl bg-gradient-to-r from-[#ff3b96] to-purple-600 text-white font-extrabold text-xl shadow-[0_0_12px_rgba(255,59,150,0.6)] active:scale-90 transition"
            >
              +
            </button>

            <button onClick={() => showToast("Profil créateur")} class="flex flex-col items-center justify-center w-full h-full text-gray-400">
              <span class="text-xl">👤</span>
              <span class="text-[10px]">Profil</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClipClapApp />);
  </script>
</body>
</html>
