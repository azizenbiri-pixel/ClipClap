  const h = Math.floor(m / 60); return h < 24 ? `Il y a ${h} h` : `Il y a ${Math.floor(h/24)} j`;

    o.type = type === 'like' ? 'triangle' : 'sine';

  } catch (e) {}
};

/* ================= CONNEXION / INSCRIPTION ================= */
function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
  const [username, setUsername] = useState(''); const [name, setName] = useState('');
  const [msg, setMsg] = useState(''); const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setMsg(''); setBusy(true);
    try {
      if (mode === 'signup') {
        const u = username.trim().replace(/^@+/, '').toLowerCase();
        if (!/^[a-z0-9_.]{3,20}$/.test(u)) throw new Error("Pseudo : 3 à 20 caractères (lettres, chiffres, _ ou .)");
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username: u, display_name: name.trim() || u } } });
        if (error) throw error;
        if (!data.session) { setMode('login'); setMsg("Compte créé ! Confirme ton email puis connecte-toi."); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) { setMsg(err.message || 'Erreur'); }
    setBusy(false);
  };

  const inp = "w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-fuchsia-500";
  return (
    <div className="h-full w-full flex flex-col items-center justify-center bg-app px-6">

      <h1 className="text-3xl font-black mb-1 grad-text">ClipClap</h1>
      <p className="text-xs text-gray-400 mb-5">{mode === 'login' ? 'Connecte-toi pour continuer' : 'Crée ton compte'}</p>
      <form onSubmit={submit} className="w-full max-w-xs space-y-3">
        {mode === 'signup' && <>
          <input className={inp} placeholder="Nom d'affichage" value={name} onChange={e => setName(e.target.value)} />
          <input className={inp} placeholder="@pseudo" autoCapitalize="none" value={username} onChange={e => setUsername(e.target.value)} />
        </>}
        <input className={inp} type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required />
        <input className={inp} type="password" placeholder="Mot de passe (6 caractères min.)" minLength={6} value={password} onChange={e => setPassword(e.target.value)} required />
        {msg && <p className="text-xs text-pink-300 text-center">{msg}</p>}
        <button disabled={busy} className="w-full py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl font-extrabold text-sm disabled:opacity-60">
          {busy ? '...' : mode === 'login' ? 'Se connecter' : "S'inscrire"}
        </button>
      </form>
      <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setMsg(''); }} className="mt-4 text-xs text-gray-400 underline">
        {mode === 'login' ? "Pas de compte ? S'inscrire" : 'Déjà un compte ? Se connecter'}
      </button>
    </div>
  );
}

  const [me, setMe] = useState(null);

  const [videos, setVideos] = useState([]);
  const [liked, setLiked] = useState({}); const [saved, setSaved] = useState({}); const [following, setFollowing] = useState({});
  const [votes, setVotes] = useState([]);
  const [battle, setBattle] = useState(null); const [isAdmin, setIsAdmin] = useState(false); const [battleMode, setBattleMode] = useState(false);
  const [, setTick] = useState(0);
  const [showBattleForm, setShowBattleForm] = useState(false); const [bTitle, setBTitle] = useState(''); const [bDays, setBDays] = useState(7); const [bFile, setBFile] = useState(null);
  const [stats, setStats] = useState({}); // {userId: {followers, profile}}

  const [tab, setTab] = useState('feed'); const [feedTab, setFeedTab] = useState('foryou'); const [profTab, setProfTab] = useState('mine');
  const [currentId, setCurrentId] = useState(null);
  const [muted, setMuted] = useState(false); const [playIcon, setPlayIcon] = useState(false);
  const [toast, setToast] = useState('');

  const [showUpload, setShowUpload] = useState(false); const [file, setFile] = useState(null); const [caption, setCaption] = useState(''); const [uploading, setUploading] = useState(false);
  const [comments, setComments] = useState([]); const [showComments, setShowComments] = useState(false); const [cText, setCText] = useState(''); const [replyTo, setReplyTo] = useState(null);
  const [sheetY, setSheetY] = useState(0); const [sheetDrag, setSheetDrag] = useState(false);
  const sheetT = useRef({ y: 0, active: false }); const listRef = useRef(null);
  const [viewing, setViewing] = useState(null);
  const [editing, setEditing] = useState(false); const [eName, setEName] = useState(''); const [eBio, setEBio] = useState(''); const [eAvatar, setEAvatar] = useState(null);

  // Studio
  const [instru, setInstru] = useState(null); const [instruUrl, setInstruUrl] = useState(null); const [lyrics, setLyrics] = useState('');
  const [recMode, setRecMode] = useState(false); const [recording, setRecording] = useState(false); const [blob, setBlob] = useState(null); const [previewUrl, setPreviewUrl] = useState(null);
  const camRef = useRef(null); const recRef = useRef(null); const chunksRef = useRef([]); const audioRef = useRef(null);

  const videoRef = useRef(null); const viewedRef = useRef(new Set()); const tx = useRef(0); const ty = useRef(0);
  const audioElRef = useRef(null);
  const tabStack = useRef([]); const prevTab = useRef('feed'); const popping = useRef(false); const backRef = useRef(null); const lastRoot = useRef(0);
  const gx = useRef(0); const gy = useRef(0); const gt = useRef(null);
  // Quand le lecteur disparaît de l'écran, on coupe vraiment le son (certains navigateurs continuent sinon)
  const setVideoEl = React.useCallback((node) => {
    if (!node && videoRef.current) { const v = videoRef.current; try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} }
    videoRef.current = node;
  }, []);
  const setAudioEl = React.useCallback((node) => {
    if (!node && audioElRef.current) { try { audioElRef.current.pause(); } catch (e) {} }
    audioElRef.current = node;
  }, []);

  const say = (m) => { setToast(m); setTimeout(() => setToast(''), 2200); };
  const patch = (id, fn) => setVideos(vs => vs.map(v => v.id === id ? { ...v, ...fn(v) } : v));

  /* ---------- AUTH ---------- */
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setBooted(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  const uid = session?.user?.id;

  /* ---------- CHARGEMENT ---------- */
  const loadVideos = async () => {
    const { data } = await sb.from('video_stats').select('*').order('created_at', { ascending: false }).limit(100);
    if (data) setVideos(data);
  };
  const loadMine = async () => {
    const [l, s, f] = await Promise.all([

    setLiked(toMap(l.data, 'video_id')); setSaved(toMap(s.data, 'video_id')); setFollowing(toMap(f.data, 'following_id'));
    
  };
  const loadBattle = async () => {
    const { data: b } = await sb.from('battles').select('*').order('created_at', { ascending: false }).limit(1).maybeSingle();
    setBattle(b || null);
    if (b) { const { data: vs } = await sb.from('battle_votes').select('user_id,candidate_id').eq('battle_id', b.id); setVotes(vs || []); }
    else setVotes([]);
  };
  const loadMe = async () => {
    let { data } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();

      const u = (session.user.email || 'user').split('@')[0].toLowerCase().replace(/[^a-z0-9_.]/g, '') + Math.floor(Math.random() * 900 + 100);

    try { history.replaceState({ cc: 0 }, ''); history.pushState({ cc: 1 }, ''); } catch (e) {}

      const handled = backRef.current && backRef.current();
      if (handled) { history.pushState({ cc: 1 }, ''); return; }
      const now = Date.now();
      if (now - lastRoot.current < 2000) { history.back(); return; }
      lastRoot.current = now; history.pushState({ cc: 1 }, ''); say('Reviens encore une fois pour quitter');
    };
    window.addEventListener('popstate', onPop);
    return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('popstate', onPop); };
  }, []);

  /* ---------- FIL ---------- */
  const isPlayerTab = tab === 'feed' || tab === 'clips';
  // Accueil = freestyles (Studio + Battle) ; page Clip = clips uniquement
  const pool = videos.filter(v => tab === 'clips' ? v.kind === 'clip' : v.kind !== 'clip');
  const displayed = feedTab === 'following' ? pool.filter(v => following[v.user_id]) : pool;
  const cur = displayed.find(v => v.id === currentId) || displayed[0];
  const overlay = viewing || showUpload || showComments || recMode || previewUrl || editing || showBattleForm;

  // Vues réelles : +1 par vidéo et par session
  useEffect(() => {
    if (!cur || !isPlayerTab || overlay || viewedRef.current.has(cur.id)) return;
    viewedRef.current.add(cur.id);
    patch(cur.id, v => ({ views_count: v.views_count + 1 }));
    sb.rpc('increment_views', { vid: cur.id });
  }, [cur?.id, tab, !!overlay]);

  useEffect(() => {
    const el = videoRef.current; if (!el || !cur) return;
    if (!isPlayerTab || overlay) el.pause();
    else { el.muted = muted; el.currentTime = 0; const p = el.play(); if (p) p.catch(() => {}); }
  }, [cur?.id, muted, tab, !!overlay, feedTab]);

  const togglePlay = () => {
    const el = videoRef.current; if (!el) return; click();
    el.paused ? el.play() : el.pause(); setPlayIcon(true); setTimeout(() => setPlayIcon(false), 700);
  };

  const onTouchEnd = (e) => {
    if (!displayed.length) return;
    const dx = tx.current - e.changedTouches[0].clientX, dy = ty.current - e.changedTouches[0].clientY;
    if (dx > 40 && Math.abs(dy) < 50) { click(); setViewing({ id: cur.user_id, username: cur.username, avatar_url: cur.avatar_url }); return; }
    if (Math.abs(dy) > 40 && Math.abs(dx) < 50) {
      const i = displayed.findIndex(v => v.id === cur.id), n = displayed.length;
      setCurrentId(displayed[(i + (dy > 0 ? 1 : n - 1)) % n].id);
    }
  };

  /* ---------- ACTIONS ---------- */
  const toggleRel = async (table, map, setMap, v, delta, key) => {
    const on = !map[v.id];
    setMap(m => ({ ...m, [v.id]: on })); patch(v.id, x => ({ [key]: Math.max(0, x[key] + (on ? 1 : -1)) }));
    const q = on ? sb.from(table).insert({ user_id: uid, video_id: v.id }) : sb.from(table).delete().match({ user_id: uid, video_id: v.id });
    const { error } = await q;
    if (error) { say('Erreur réseau'); loadVideos(); loadMine(); }
  };
  const like = (v, e) => { e.stopPropagation(); click('like'); toggleRel('likes', liked, setLiked, v, 1, 'likes_count'); };
  const save = (v, e) => { e.stopPropagation(); click(); say(saved[v.id] ? 'Retirée des favoris' : 'Vidéo enregistrée ! 📌'); toggleRel('saves', saved, setSaved, v, 1, 'saves_count'); };

  const share = async (v, e) => {
    e.stopPropagation(); click(); let ok = false;
    try {
      if (navigator.share) { await navigator.share({ title: 'ClipClap', url: location.href }); ok = true; }
      else { await navigator.clipboard.writeText(location.href); ok = true; say('Lien copié ! 🔗'); }
    } catch (err) {}
    if (ok) { patch(v.id, x => ({ shares_count: x.shares_count + 1 })); sb.rpc('increment_shares', { vid: v.id }); }
  };

  const follow = async (userId, e) => {
    e && e.stopPropagation(); click();
    const on = !following[userId];
    setFollowing(f => ({ ...f, [userId]: on }));
    setStats(s => s[userId] ? { ...s, [userId]: { ...s[userId], followers: Math.max(0, s[userId].followers + (on ? 1 : -1)) } } : s);
    const { error } = on ? await sb.from('follows').insert({ follower_id: uid, following_id: userId }) : await sb.from('follows').delete().match({ follower_id: uid, following_id: userId });
    if (error) { say('Erreur réseau'); loadMine(); }
  };

  const openComments = async () => {
    click(); setShowComments(true); setComments([]); setReplyTo(null); setCText(''); setSheetY(0);
    const { data } = await sb.from('comments').select('id,text,created_at,user_id,parent_id,profiles(username)').eq('video_id', cur.id).order('created_at', { ascending: false });
    setComments(data || []);
  };
  const addComment = async (e) => {
    e.preventDefault(); const t = cText.trim(); if (!t) return; click();
    const { data, error } = await sb.from('comments').insert({ video_id: cur.id, user_id: uid, text: t, parent_id: replyTo ? (replyTo.parent_id || replyTo.id) : null }).select('id,text,created_at,user_id,parent_id,profiles(username)').single();
    if (error) return say('Commentaire non envoyé');
    setComments(c => [data, ...c]); patch(cur.id, x => ({ comments_count: x.comments_count + 1 })); setCText(''); setReplyTo(null);
  };

  const vote = async (candidateId) => {
    if (!battle) return say('Pas de battle en cours');
    if (candidateId === uid) return say('Tu ne peux pas voter pour toi');
    if (new Date(battle.ends_at) <= new Date()) return say('La battle est terminée');
    const { error } = await sb.from('battle_votes').insert({ battle_id: battle.id, user_id: uid, candidate_id: candidateId });
    if (error) return say('Tu as déjà voté');
    setVotes(v => [...v, { user_id: uid, candidate_id: candidateId }]); say('Vote enregistré ! 🏆');
  };

  const createBattle = async (e) => {
    e.preventDefault();
    if (!bTitle.trim() || !bFile) return say('Titre et instru (MP3) obligatoires');
    if (bFile.size > 20971520) return say('Instru trop lourde (20 Mo max)');
    setUploading(true);
    const path = `${uid}/${Date.now()}_${bFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const up = await sb.storage.from('instrus').upload(path, bFile, { contentType: bFile.type || 'audio/mpeg' });
    if (up.error) { setUploading(false); return say('Envoi impossible : ' + up.error.message); }
    const url = sb.storage.from('instrus').getPublicUrl(path).data.publicUrl;
    const ends = new Date(Date.now() + (Number(bDays) || 7) * 86400000).toISOString();
    const { error } = await sb.from('battles').insert({ title: bTitle.trim(), instru_url: url, instru_path: path, ends_at: ends, created_by: uid });
    setUploading(false);
    if (error) return say('Erreur : ' + error.message);
    setShowBattleForm(false); setBTitle(''); setBFile(null); await loadBattle(); say('Nouvelle battle lancée ! 🏆');
  };

  const upload = async (f, cap, music, battleId = null, kind = 'freestyle') => {
    if (f.size > 52428800) { say('Vidéo trop lourde (50 Mo max)'); return false; }
    if (battleId && battle && new Date(battle.ends_at) <= new Date()) { say('La battle est terminée'); return false; }
    setUploading(true);
    const ext = f.name ? f.name.split('.').pop().toLowerCase() : (f.type.includes('mp4') ? 'mp4' : 'webm');
    const path = `${uid}/${Date.now()}.${ext}`;
    const up = await sb.storage.from('videos').upload(path, f, { contentType: f.type || 'video/mp4' });
    if (up.error) { setUploading(false); say('Envoi impossible : ' + up.error.message); return false; }
    const url = sb.storage.from('videos').getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from('videos').insert({ user_id: uid, video_url: url, storage_path: path, caption: cap, music, battle_id: battleId, kind });
    setUploading(false);
    if (error) { say('Erreur : ' + error.message); return false; }
    await loadVideos(); setFeedTab('foryou'); setCurrentId(null); setTab(kind === 'clip' ? 'clips' : 'feed'); say(kind === 'clip' ? 'Clip publié ! 🎬' : 'Vidéo publiée ! 🚀'); return true;
  };

  const publishFile = async (e) => {
    e.preventDefault(); if (!file) return say("Choisis d'abord une vidéo 🎬");
    if (await upload(file, caption || 'Nouvelle vidéo ClipClap ! 🎬 #clipclap', `Son original - ${me.display_name || me.username} 🎵`, null, 'clip')) { setShowUpload(false); setFile(null); setCaption(''); }
  };
  const publishFreestyle = async () => {
    if (await upload(blob, battleMode ? `🏆 Battle : ${battle.title} #battle` : `Freestyle sur ${instru || 'une instru'} 🎤 #clipclap`, `Son original - ${me.display_name || me.username} 🎵`, battleMode ? battle.id : null)) { setPreviewUrl(null); setBlob(null); setInstru(null); setInstruUrl(null); setBattleMode(false); }
  };

  const removeVideo = async (v, e) => {
    e.stopPropagation(); if (!confirm('Supprimer cette vidéo définitivement ?')) return;
    await sb.storage.from('videos').remove([v.storage_path]);
    const { error } = await sb.from('videos').delete().eq('id', v.id);
    if (error) return say('Suppression impossible');
    setVideos(vs => vs.filter(x => x.id !== v.id)); say('Vidéo supprimée 🗑️');
  };

  const saveProfile = async () => {
    const upd = { display_name: eName.trim() || me.username, bio: eBio };
    if (eAvatar) upd.avatar_url = eAvatar;
    const { data, error } = await sb.from('profiles').update(upd).eq('id', uid).select().single();
    if (error) return say('Erreur : ' + error.message);
    setMe(data); setEditing(false); loadVideos(); say('Profil mis à jour ! ✨');
  };
  const pickAvatar = (f) => {
    if (!f) return; const r = new FileReader();
    r.onloadend = () => { const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = 150; c.height = img.height * (150 / img.width);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); setEAvatar(c.toDataURL('image/jpeg', 0.7));
    }; img.src = r.result; };
    r.readAsDataURL(f);
  };

  const openVideo = (v) => { setFeedTab('foryou'); setCurrentId(v.id); setViewing(null); setTab(v.kind === 'clip' ? 'clips' : 'feed'); };

  /* ---------- STUDIO ---------- */
  const stopCam = () => { const el = camRef.current; if (el && el.srcObject) { el.srcObject.getTracks().forEach(t => t.stop()); el.srcObject = null; } };
  const stopInstru = () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } };
  const closeStudio = () => {
    if (recRef.current && recRef.current.state !== 'inactive') { recRef.current.onstop = null; try { recRef.current.stop(); } catch (e) {} }
    stopCam(); stopInstru(); setRecording(false); setRecMode(false);
  };
  const toggleRec = () => {
    if (!recording) {
      const el = camRef.current; if (!el || !el.srcObject) return alert("La caméra n'est pas encore active !");
      try {
        chunksRef.current = [];
        const opt = MediaRecorder.isTypeSupported('video/webm') ? { mimeType: 'video/webm' } : {};
        const mr = new MediaRecorder(el.srcObject, opt); recRef.current = mr;
        mr.ondataavailable = (ev) => ev.data && ev.data.size && chunksRef.current.push(ev.data);
        mr.onstop = () => { const b = new Blob(chunksRef.current, { type: mr.mimeType || 'video/webm' }); setBlob(b); setPreviewUrl(URL.createObjectURL(b)); };
        mr.start(); setRecording(true);
        if (instruUrl) { const a = new Audio(instruUrl); audioRef.current = a; a.play().catch(() => {}); }
      } catch (err) { alert("Impossible de démarrer l'enregistrement."); }
    } else {
      if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop();
      stopCam(); stopInstru(); setRecording(false); setRecMode(false);
    }
  };

  /* ---------- GLISSER VERS LE BAS POUR FERMER LES COMMENTAIRES ---------- */
  const sheetStart = (e) => {
    const inList = listRef.current && listRef.current.contains(e.target);
    sheetT.current = { y: e.touches[0].clientY, active: !inList || listRef.current.scrollTop <= 0 };
  };
  const sheetMove = (e) => {
    if (!sheetT.current.active) return;
    const dy = e.touches[0].clientY - sheetT.current.y;
    if (dy > 0) { setSheetDrag(true); setSheetY(dy); } else if (sheetY !== 0) setSheetY(0);
  };
  const sheetEnd = () => {
    setSheetDrag(false);
    if (sheetT.current.active && sheetY > 90) setShowComments(false);
    setSheetY(0);
  };

  /* ---------- RETOUR EN ARRIÈRE ---------- */
  const back = () => {
    if (recMode) { closeStudio(); return true; }
    if (previewUrl) { setPreviewUrl(null); setBlob(null); return true; }
    if (showComments) { setShowComments(false); return true; }
    if (showUpload) { setShowUpload(false); setFile(null); return true; }
    if (showBattleForm) { setShowBattleForm(false); return true; }
    if (editing) { setEditing(false); return true; }
    if (viewing) { setViewing(null); return true; }
    if (tab !== 'feed') {
      let t = tabStack.current.pop();
      if (!t || t === tab) t = 'feed';
      popping.current = true; setTab(t); return true;
    }
    return false;
  };
  backRef.current = back;

  /* ---------- RENDU ---------- */
  const Grid = ({ list, canDelete }) => !list.length
    ? <p className="text-center text-xs text-gray-500 py-10">Aucune vidéo pour le moment.</p>
    : <div className="grid grid-cols-3 gap-1">{list.map(v => (
        <div key={v.id} onClick={() => openVideo(v)} className="relative aspect-[9/16] bg-gray-900 overflow-hidden rounded-lg cursor-pointer">
          <video src={v.video_url + '#t=0.1'} className="w-full h-full object-cover bg-gray-900" muted playsInline preload="metadata" onLoadedMetadata={e => { try { e.target.currentTime = 0.1; } catch (err) {} }} />
          {v.kind === 'clip' && <span className="absolute top-1 left-1 text-[9px] font-bold bg-pink-600 px-1.5 py-0.5 rounded">CLIP</span>}
          <div className="absolute bottom-1 left-1 right-1 text-[10px] font-bold bg-black/70 px-1.5 py-0.5 rounded flex justify-between"><span className="flex items-center gap-1"><Icon n="play" size={9} fill />{fmt(v.views_count)}</span><span className="flex items-center gap-1"><Icon n="heart" size={9} fill />{fmt(v.likes_count)}</span><span className="flex items-center gap-1"><Icon n="msg" size={9} fill />{fmt(v.comments_count)}</span></div>
          {canDelete && <button onClick={(e) => removeVideo(v, e)} className="absolute top-1 right-1 w-6 h-6 bg-black/70 rounded-full flex items-center justify-center"><Icon n="trash" size={12} /></button>}
        </div>))}</div>;

  if (!splashDone || !booted) return <Splash />;
  if (!session) return <AuthScreen />;
  if (!me) return <div className="h-full flex flex-col items-center justify-center bg-app gap-3"><span className="text-4xl">🎬</span><p className="text-xs text-gray-400">Chargement du profil...</p><button onClick={() => sb.auth.signOut()} className="text-xs underline text-gray-500">Se déconnecter</button></div>;

  const myVideos = videos.filter(v => v.user_id === me.id);
  const myFree = myVideos.filter(v => v.kind !== 'clip'); const myClips = myVideos.filter(v => v.kind === 'clip');
  const savedList = videos.filter(v => saved[v.id]);
  const myStats = stats[me.id];
  const myLikes = myVideos.reduce((s, v) => s + v.likes_count, 0);
  const btn = "w-11 h-11 rounded-full flex items-center justify-center bg-black/35 backdrop-blur-md border border-white/20 text-white transition-all";
  const act = "!bg-gradient-to-tr from-fuchsia-500 to-violet-600 !border-transparent shadow-[0_0_18px_rgba(217,70,239,0.75)] scale-110";

  // Battle en cours
  const bEnded = battle ? new Date(battle.ends_at) <= new Date() : false;
  const bLeft = battle ? Math.max(0, new Date(battle.ends_at) - new Date()) : 0;
  const bDaysLeft = Math.floor(bLeft / 86400000);
  const bH = Math.floor((bLeft % 86400000) / 3600000), bM = Math.floor((bLeft % 3600000) / 60000);
  const bCount = bEnded ? 'Terminée' : bDaysLeft >= 1 ? `Reste ${bDaysLeft} jour${bDaysLeft > 1 ? 's' : ''}` : `Reste ${bH} h ${bM} min`;
  const bVideos = battle ? videos.filter(v => v.battle_id === battle.id) : [];
  const board = Object.values(bVideos.reduce((a, v) => {
    a[v.user_id] = a[v.user_id] || { id: v.user_id, name: v.username, avatar: v.avatar_url, views: 0, vid: v };
    a[v.user_id].views += v.views_count; return a;
  }, {})).map(c => ({ ...c, votes: votes.filter(x => x.candidate_id === c.id).length }))
    .sort((a, b) => b.votes - a.votes || b.views - a.views).map((c, i) => ({ ...c, rank: i + 1 }));
  const myVoteId = (votes.find(x => x.user_id === me.id) || {}).candidate_id;
  const winner = bEnded && board.length && board[0].votes > 0 ? board[0] : null;

  return (
    <div className="h-full w-full flex flex-col bg-black overflow-hidden relative"
         onTouchStart={e => { gx.current = e.touches[0].clientX; gy.current = e.touches[0].clientY; gt.current = e.target; }}
         onTouchEnd={e => {
           const dx = e.changedTouches[0].clientX - gx.current, dy = e.changedTouches[0].clientY - gy.current, t = gt.current;
           if (t && (['INPUT', 'TEXTAREA', 'AUDIO'].includes(t.tagName) || (t.closest && t.closest('video[controls]')))) return;
           if (dx > 90 && Math.abs(dy) < 60 && Math.abs(dx) > Math.abs(dy) * 2) back();
         }}>
      {toast && <div className="absolute top-16 left-1/2 -translate-x-1/2 z-[60] bg-black/80 border border-white/10 text-xs font-semibold px-4 py-2 rounded-full">⚡ {toast}</div>}

      <div className="flex-1 relative overflow-hidden">
        {/* ===== FIL ===== */}
        {isPlayerTab && (
          <div className="absolute inset-0 swipe bg-app" onTouchStart={e => { tx.current = e.touches[0].clientX; ty.current = e.touches[0].clientY; }} onTouchEnd={onTouchEnd}>
            {cur ? (
              <div className="relative h-full w-full bg-black">
                <video ref={setVideoEl} src={cur.video_url} className="absolute inset-0 h-full w-full object-cover" loop playsInline autoPlay muted={muted} onClick={togglePlay} />
                <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>
                {playIcon && <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20"><div className="w-16 h-16 bg-black/60 rounded-full flex items-center justify-center text-white animate-ping"><Icon n="play" size={26} fill /></div></div>}
                <button onClick={() => { click(); setMuted(!muted); }} className={`absolute top-14 right-4 z-30 ${btn}`}><Icon n={muted ? 'volx' : 'vol'} size={20} /></button>

                <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">
                  <div className="relative mb-1">
                    <div onClick={() => { click(); setViewing({ id: cur.user_id, username: cur.username, avatar_url: cur.avatar_url }); }} className="w-11 h-11 rounded-full border-2 border-fuchsia-500 overflow-hidden bg-purple-900 flex items-center justify-center cursor-pointer"><Av src={cur.avatar_url} /></div>
                    {cur.user_id !== me.id && !following[cur.user_id] && <button onClick={e => follow(cur.user_id, e)} className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-full text-xs font-bold">+</button>}
                  </div>
                  {[
                    ['like', 'heart', liked[cur.id], fmt(cur.likes_count), e => like(cur, e)],
                    ['comment', 'msg', false, fmt(cur.comments_count), () => openComments()],
                    ['save', 'bookmark', saved[cur.id], fmt(cur.saves_count), e => save(cur, e)],
                    ['share', 'send', false, fmt(cur.shares_count), e => share(cur, e)],
                  ].map(([k, ic, on, count, fn]) => (
                    <button key={k} onClick={fn} className="flex flex-col items-center gap-1">
                      <div className={`${btn} ${on ? act : ''}`}><Icon n={ic} size={22} fill={on} /></div>
                      <span className="text-[11px] font-bold drop-shadow">{count}</span>
                    </button>))}
                </div>

                <div className="absolute left-4 bottom-20 right-16 z-30">
                  <div className="flex items-center gap-2 mb-2">
                    <span onClick={() => setViewing({ id: cur.user_id, username: cur.username, avatar_url: cur.avatar_url })} className="font-extrabold text-base cursor-pointer">@{cur.username}</span>
                    {following[cur.user_id] && <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">Abonné</span>}
                  </div>
                  <p className="text-sm text-gray-200 mb-2 line-clamp-2">{cur.caption}</p>
                  <p className="text-[11px] text-gray-300 mb-2 flex items-center gap-1.5"><Icon n="eye" size={13} /> {fmt(cur.views_count)} vue{cur.views_count > 1 ? 's' : ''}</p>
                  <div className="text-xs text-gray-200 bg-black/35 px-3 py-1.5 rounded-full w-fit border border-white/15 flex items-center gap-1.5 max-w-[240px]"><Icon n="music" size={12} /><span className="truncate">{cur.music}</span></div>
                </div>
              </div>
            ) : (
              <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400">
                <Icon n="clap" size={56} className="text-fuchsia-400 mb-3" />
                {feedTab === 'following'
                  ? <><p className="text-sm font-semibold text-white mb-1">Aucune vidéo de tes abonnements</p><button onClick={() => setFeedTab('foryou')} className="mt-3 px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Voir "Pour toi"</button></>
                  : <>{tab === 'clips'
                    ? <><p className="text-sm font-semibold text-white mb-1">Aucun clip pour l'instant</p><p className="text-xs mb-3">Sois le premier à publier ton clip !</p><button onClick={() => setShowUpload(true)} className="px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Publier un clip 🚀</button></>
                    : <><p className="text-sm font-semibold text-white mb-1">Aucun freestyle pour l'instant</p><p className="text-xs mb-3">Les freestyles du Studio et de la Battle apparaissent ici.</p><button onClick={() => setTab('studio')} className="px-4 py-2 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white rounded-full text-xs font-bold">Aller au Studio 🎙️</button></>}</>}
              </div>
            )}
            {tab === 'clips' && cur && <button onClick={() => { click(); setShowUpload(true); }} className="absolute top-14 left-4 z-30 bg-gradient-to-r from-fuchsia-500 to-violet-600 text-xs font-bold px-3 py-2 rounded-full shadow-lg flex items-center gap-1.5"><Icon n="plus" size={14} /> Publier un clip</button>}
            <div className="absolute top-0 left-0 right-0 z-30 pt-3 pb-2 flex justify-center gap-6 bg-gradient-to-b from-black/90 to-transparent">
              <span className="absolute left-4 top-3 text-[13px] font-black grad-text tracking-wide pointer-events-none">ClipClap</span>
              {[['following', 'Abonnements'], ['foryou', 'Pour toi']].map(([k, l]) => (
                <button key={k} onClick={() => { click(); setFeedTab(k); }} className={`text-sm font-bold ${feedTab === k ? 'border-b-2 border-fuchsia-500 pb-1' : 'text-white/60'}`}>{l}</button>))}
            </div>
          </div>
        )}

        {/* ===== BATTLE ===== */}
        {tab === 'search' && (
          <div className="absolute inset-0 bg-app overflow-y-auto p-4 pt-10 pb-24">
            <h2 className="text-2xl font-black mb-4 grad-text">Battle de la Semaine</h2>
            {isAdmin && <button onClick={() => setShowBattleForm(true)} className="w-full mb-4 bg-white/10 border border-fuchsia-500/40 text-fuchsia-300 font-bold py-2.5 rounded-xl text-xs">⚙️ Lancer une nouvelle battle (admin)</button>}
            {!battle ? <div className="p-6 bg-gradient-to-br from-purple-900/40 via-red-900/30 to-black border border-amber-500/40 rounded-2xl text-center space-y-3">
                <Icon n="mic" size={44} className="text-fuchsia-400 mx-auto" />
                <p className="font-bold">Aucune battle en cours</p>
                <p className="text-xs text-gray-400">Une nouvelle instru est lancée chaque semaine, avec un décompte et un classement. Reviens bientôt !</p>
                <button onClick={() => setTab('studio')} className="w-full bg-white/10 border border-white/10 font-bold py-3 rounded-xl text-sm">🎙️ En attendant, va au Studio</button>
              </div> : <>
              <div className="p-5 bg-gradient-to-br from-purple-900/40 via-red-900/30 to-black border border-amber-500/40 rounded-2xl space-y-3 mb-4">
                <div className="flex items-center justify-between">
                  <span className="bg-red-600 text-xs font-bold px-3 py-1 rounded-full uppercase">🏆 Concours</span>
                  <span className={`text-xs font-semibold ${bEnded ? 'text-gray-400' : 'text-amber-400'}`}>⏰ {bCount}</span>
                </div>
                <h3 className="text-lg font-bold">{battle.title}</h3>
                <p className="text-xs text-gray-400">Écoute l'instru imposé, puis pose ton freestyle dessus.</p>
                <audio ref={setAudioEl} controls src={battle.instru_url} className="w-full h-10" />
                {!bEnded
                  ? <button onClick={() => { click(); setInstru(battle.title); setInstruUrl(battle.instru_url); setBattleMode(true); setTab('studio'); }} className="w-full bg-gradient-to-r from-fuchsia-500 to-violet-600 font-extrabold py-3 rounded-xl">🎤 Poser sur l'instru de la Battle</button>
                  : <p className="text-center text-xs text-gray-400">Battle terminée : les votes sont fermés.</p>}
              </div>
              {winner && <div className="mb-4 p-4 rounded-2xl bg-amber-500/20 border border-amber-400/50 text-center"><p className="text-2xl">👑</p><p className="font-extrabold">Vainqueur : @{winner.name}</p><p className="text-xs text-amber-300">{winner.votes} vote{winner.votes > 1 ? 's' : ''}</p></div>}
              {bEnded && !winner && <p className="text-center text-xs text-gray-400 mb-4">Aucun vote : pas de vainqueur cette fois.</p>}
              <h3 className="font-bold text-sm text-gray-200 mb-2">Classement ({board.length} participant{board.length > 1 ? 's' : ''})</h3>
              {board.length === 0 && <p className="text-center text-xs text-gray-500 py-6">Personne n'a encore posé sur cette instru. Sois le premier !</p>}
              <div className="space-y-2">
                {board.map(c => (
                  <div key={c.id} className={`rounded-2xl p-3 flex items-center justify-between border ${c.rank === 1 ? 'bg-purple-900/30 border-fuchsia-500/40' : 'bg-slate-900/60 border-white/5'}`}>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold text-gray-300 w-6">{bEnded && c.rank === 1 && winner ? '👑' : `#${c.rank}`}</span>
                      <div className="w-9 h-9 rounded-full bg-slate-800 overflow-hidden flex items-center justify-center"><Av src={c.avatar} /></div>
                      <div><p className="font-bold text-xs">@{c.name}</p><p className="text-[10px] text-gray-400">{c.votes} vote{c.votes > 1 ? 's' : ''} · 👁️ {fmt(c.views)}</p></div>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => openVideo(c.vid)} className="text-xs px-2.5 py-1.5 rounded-xl bg-white/10 font-bold flex items-center"><Icon n="play" size={12} fill /></button>
                      <button disabled={!!myVoteId || bEnded || c.id === me.id} onClick={() => vote(c.id)} className={`text-xs px-3 py-1.5 rounded-xl font-bold ${myVoteId === c.id ? 'bg-emerald-500/30 text-emerald-300' : (myVoteId || bEnded || c.id === me.id) ? 'bg-white/5 text-gray-600' : 'bg-gradient-to-r from-fuchsia-500 to-violet-600'}`}>{myVoteId === c.id ? 'Voté ✓' : 'Voter'}</button>
                    </div>
                  </div>))}
              </div>
            </>}
          </div>
        )}

        {/* ===== STUDIO ===== */}
        {tab === 'studio' && (
          <div className="absolute inset-0 bg-app overflow-y-auto z-40 p-4 pt-6 pb-24 space-y-5">
            <h2 className="text-2xl font-black grad-text">Studio d'enregistrement</h2>
            {battleMode ? <div className="bg-red-600/20 border border-red-500/40 rounded-xl p-3 text-sm font-bold">🏆 Instru imposé par la Battle : {instru}</div> : <label className="cursor-pointer bg-gradient-to-r from-fuchsia-500 to-violet-600 font-bold py-3 px-4 rounded-xl block text-center">
              📁 Importer un instrumental (MP3 / WAV)
              <input type="file" accept="audio/*" className="hidden" onChange={e => { const f = e.target.files[0]; if (f) { setInstru(f.name.replace(/\.[^/.]+$/, '')); setInstruUrl(URL.createObjectURL(f)); } }} />
            </label>}
            {instru && !battleMode && <div className="bg-amber-500/20 border border-amber-500/30 rounded-xl p-3 text-sm font-bold">🔥 {instru} <span className="text-emerald-400 text-xs font-medium">Sélectionné ✓</span></div>}
            <textarea value={lyrics} onChange={e => setLyrics(e.target.value)} placeholder="Bloc-notes : écris tes rimes ici..." className="w-full h-32 bg-white/5 border border-white/10 rounded-2xl p-3 text-sm focus:outline-none focus:border-fuchsia-500 resize-none"></textarea>
            <button onClick={() => { click(); setRecMode(true); }} className="w-full bg-white text-black font-bold py-3 rounded-xl">🎥 Lancer l'enregistrement</button>
          </div>
        )}

        {/* ===== PROFIL ===== */}
        {tab === 'profile' && (
          <div className="absolute inset-0 bg-app overflow-y-auto p-4 pt-10 pb-24">
            <div className="flex flex-col items-center mt-2">
              <div className="w-24 h-24 rounded-full border-2 border-fuchsia-400 shadow-[0_0_28px_rgba(217,70,239,0.55)] overflow-hidden bg-purple-900 flex items-center justify-center mb-3"><Av src={me.avatar_url} size="text-4xl" /></div>
              <h2 className="text-xl font-extrabold">{me.display_name || me.username}</h2>
              <p className="text-xs text-gray-400 mb-2">@{me.username}</p>
              {me.bio && <p className="text-xs text-gray-200 text-center max-w-xs mb-3">{me.bio}</p>}
              <div className="flex items-center gap-6 mb-4 text-center">
                <div><span className="block font-extrabold">{Object.values(following).filter(Boolean).length}</span><span className="text-[11px] text-gray-400">Abonnements</span></div>
                <div><span className="block font-extrabold">{myStats ? myStats.followers : 0}</span><span className="text-[11px] text-gray-400">Abonnés</span></div>
                <div><span className="block font-extrabold">{fmt(myLikes)}</span><span className="text-[11px] text-gray-400">J'aime</span></div>
              </div>
              <div className="flex gap-2 w-full max-w-xs mb-5">
                <button onClick={() => { setEName(me.display_name || ''); setEBio(me.bio || ''); setEAvatar(null); setEditing(true); }} className="flex-1 bg-white/10 border border-white/10 py-2 rounded-xl text-xs font-bold">Modifier le profil</button>
                <button onClick={() => sb.auth.signOut()} className="bg-white/10 border border-white/10 px-3 py-2 rounded-xl text-xs font-bold">Déconnexion</button>
              </div>
            </div>
            <div className="border-t border-white/10 pt-4">
              <div className="flex justify-center gap-5 mb-4">
                {[['mine', `Freestyles (${myFree.length})`], ['clip', `Clips (${myClips.length})`], ['saved', `Favoris (${savedList.length})`]].map(([k, l]) => (
                  <button key={k} onClick={() => setProfTab(k)} className={`text-xs pb-1 ${profTab === k ? 'font-bold border-b-2 border-fuchsia-500' : 'text-gray-400'}`}>{l}</button>))}
              </div>
              <Grid list={profTab === 'mine' ? myFree : profTab === 'clip' ? myClips : savedList} canDelete={profTab !== 'saved'} />
            </div>
          </div>
        )}
      </div>

      {/* ===== NAVIGATION ===== */}
      <div className="absolute bottom-0 left-0 right-0 h-16 bg-[#0d0820]/85 backdrop-blur-2xl border-t border-fuchsia-500/20 shadow-[0_-8px_30px_rgba(168,85,247,0.18)] flex items-center justify-around px-2 z-40">
        {[['feed', 'home', 'Accueil'], ['search', 'flame', 'Battle']].map(([k, i, l]) => (
          <button key={k} onClick={() => { click(); setTab(k); setViewing(null); }} className={`flex flex-col items-center gap-1 ${tab === k ? 'text-fuchsia-400 font-bold drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]' : 'text-gray-400'}`}><Icon n={i} size={22} /><span className="text-[10px]">{l}</span></button>))}
        <button onClick={() => { click(); setTab('clips'); setViewing(null); }} className="flex flex-col items-center gap-1 -mt-3">
          <div className={`w-12 h-12 rounded-2xl bg-gradient-to-tr from-fuchsia-500 via-violet-600 to-indigo-500 flex items-center justify-center text-2xl clip-glow ${tab === 'clips' ? 'ring-2 ring-white' : ''}`}><Icon n="clap" size={26} className="text-white" /></div>
          <span className={`text-[10px] ${tab === 'clips' ? 'text-fuchsia-400 font-bold drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]' : 'text-gray-400'}`}>Clip</span>
        </button>
        {[['studio', 'mic', 'Studio'], ['profile', 'user', 'Profil']].map(([k, i, l]) => (
          <button key={k} onClick={() => { click(); setTab(k); setViewing(null); }} className={`flex flex-col items-center gap-1 ${tab === k ? 'text-fuchsia-400 font-bold drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]' : 'text-gray-400'}`}><Icon n={i} size={22} /><span className="text-[10px]">{l}</span></button>))}
      </div>

      {/* ===== NOUVELLE BATTLE (admin) ===== */}
      {showBattleForm && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <form onSubmit={createBattle} className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Nouvelle battle</h3>
            <input value={bTitle} onChange={e => setBTitle(e.target.value)} placeholder="Titre (ex : Beat de la Semaine #2)" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <input type="file" accept="audio/*" onChange={e => setBFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
            <div className="flex items-center gap-2 text-xs text-gray-300"><span>Durée (jours)</span><input type="number" min="1" max="30" value={bDays} onChange={e => setBDays(e.target.value)} className="w-16 bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-center" /></div>
            <p className="text-[10px] text-gray-500">La battle précédente est remplacée. Ses votes et ses résultats restent en base.</p>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowBattleForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button disabled={uploading} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold disabled:opacity-60">{uploading ? 'Envoi...' : 'Lancer 🏆'}</button>
            </div>
          </form>
        </div>
      )}

      {/* ===== UPLOAD ===== */}
      {showUpload && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end justify-center">
          <div className="w-full max-w-md bg-[#120c24] border border-white/10 rounded-t-3xl p-6">
            <div className="flex justify-between mb-4"><h3 className="text-lg font-extrabold">Publier un clip 🎬</h3><button onClick={() => { setShowUpload(false); setFile(null); }} className="text-gray-400 text-xl">✕</button></div>
            <form onSubmit={publishFile} className="space-y-4">
              <input type="file" accept="video/*" onChange={e => setFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
              <textarea value={caption} onChange={e => setCaption(e.target.value)} rows="3" placeholder="Description & hashtags" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm focus:outline-none focus:border-fuchsia-500 resize-none"></textarea>
              <button disabled={uploading} className="w-full py-3.5 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl font-extrabold text-sm disabled:opacity-60">{uploading ? 'Envoi en cours...' : 'Publier sur ClipClap 🚀'}</button>
            </form>
          </div>
        </div>
      )}

      {/* ===== COMMENTAIRES ===== */}
      {showComments && cur && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end justify-center">
          <div className="absolute inset-0" onClick={() => setShowComments(false)} />
          <div className="relative w-full max-w-md h-[70%] bg-[#120c24] border-t border-white/10 rounded-t-3xl flex flex-col"
               style={{ transform: `translateY(${sheetY}px)`, transition: sheetDrag ? 'none' : 'transform .25s ease' }}
               onTouchStart={sheetStart} onTouchMove={sheetMove} onTouchEnd={sheetEnd}>
            <div className="w-full flex justify-center pt-2.5 pb-1"><div className="w-12 h-1.5 bg-white/25 rounded-full"></div></div>
            <div className="flex items-center justify-between p-4 border-b border-white/10">
              <h3 className="text-sm font-extrabold">{comments.length} commentaire{comments.length > 1 ? 's' : ''}</h3>
              <button onClick={() => setShowComments(false)} className="text-gray-400 text-lg">✕</button>
            </div>
            <div ref={listRef} className="flex-1 overflow-y-auto overscroll-contain p-4 space-y-4">
              {(() => {
                const tops = comments.filter(c => !c.parent_id);
                const Row = (c, isReply) => (
                  <div key={c.id} className={`flex gap-3 ${isReply ? 'ml-11' : ''}`}>
                    <div className={`${isReply ? 'w-6 h-6 text-[10px]' : 'w-8 h-8 text-xs'} rounded-full bg-fuchsia-500 flex items-center justify-center font-bold flex-shrink-0`}>{(c.profiles?.username || '?')[0].toUpperCase()}</div>
                    <div className="flex-1 min-w-0">
                      <div className="flex gap-2"><span className="text-xs font-bold text-gray-300">@{c.profiles?.username}</span><span className="text-[10px] text-gray-500">{ago(c.created_at)}</span></div>
                      <p className="text-xs mt-0.5 break-words">{c.text}</p>
                      <button onClick={() => { setReplyTo(c); setCText(isReply ? `@${c.profiles?.username} ` : ''); }} className="text-xs text-neutral-400 mt-1">Répondre</button>
                    </div>
                  </div>
                );
                return tops.length ? tops.map(c => (
                  <div key={c.id} className="space-y-3">
                    {Row(c, false)}
                    {comments.filter(r => r.parent_id === c.id).sort((x, y) => new Date(x.created_at) - new Date(y.created_at)).map(r => Row(r, true))}
                  </div>)) : <p className="text-center text-xs text-gray-400 pt-10">Aucun commentaire. Sois le premier !</p>;
              })()}
            </div>
            {replyTo && <div className="flex items-center justify-between px-4 py-2 bg-neutral-800 text-xs text-gray-300"><span>Réponse à @{replyTo.profiles?.username}</span><button onClick={() => { setReplyTo(null); setCText(''); }} className="text-gray-400 px-2">✕</button></div>}
            <form onSubmit={addComment} className="flex gap-2 p-3 bg-neutral-900 border-t border-neutral-800">
              <input value={cText} onChange={e => setCText(e.target.value)} placeholder="Ajouter un commentaire..." className="flex-1 min-w-0 bg-neutral-800 px-4 py-2.5 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
              <button className="bg-fuchsia-500 px-4 py-2.5 rounded-full text-sm font-semibold">Envoyer</button>
            </form>
          </div>
        </div>
      )}

      {/* ===== PROFIL D'UN CRÉATEUR ===== */}
      {viewing && (() => {
        const st = stats[viewing.id]; const list = videos.filter(v => v.user_id === viewing.id); const isMe = viewing.id === me.id;
        const p = st?.profile || viewing;
        return (
          <div className="absolute inset-0 z-50 bg-app overflow-y-auto p-4 pt-10 pb-24"
               >
            <button onClick={() => setViewing(null)} className="mb-4 w-9 h-9 bg-white/10 rounded-full text-base font-bold">‹</button>
            <div className="flex flex-col items-center">
              <div className="w-20 h-20 rounded-full border-2 border-fuchsia-500 overflow-hidden bg-purple-900 flex items-center justify-center mb-3"><Av src={p.avatar_url} size="text-3xl" /></div>
              <h2 className="text-lg font-extrabold">{p.display_name || p.username}</h2>
              <p className="text-xs text-gray-400 mb-2">@{p.username}</p>
              {p.bio && <p className="text-xs text-gray-200 text-center max-w-xs mb-3">{p.bio}</p>}
              <div className="flex gap-6 mb-4 text-center">
                <div><span className="block font-bold text-sm">{list.length}</span><span className="text-[10px] text-gray-400">Vidéos</span></div>
                <div><span className="block font-bold text-sm">{st ? st.followers : 0}</span><span className="text-[10px] text-gray-400">Abonnés</span></div>
                <div><span className="block font-bold text-sm">{fmt(list.reduce((s, v) => s + v.likes_count, 0))}</span><span className="text-[10px] text-gray-400">J'aime</span></div>
              </div>
              {!isMe && <button onClick={e => follow(viewing.id, e)} className={`w-36 py-2 rounded-full text-xs font-bold mb-4 ${following[viewing.id] ? 'bg-white/20' : 'bg-gradient-to-r from-fuchsia-500 to-violet-600'}`}>{following[viewing.id] ? 'Abonné' : "S'abonner"}</button>}
            </div>
            <div className="border-t border-white/10 pt-4"><Grid list={list} canDelete={false} /></div>
          </div>
        );
      })()}

      {/* ===== MODIFIER PROFIL ===== */}
      {editing && (
        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 space-y-4">
            <h3 className="text-base font-extrabold text-center">Modifier mon profil</h3>
            <input value={eName} onChange={e => setEName(e.target.value)} placeholder="Nom d'affichage" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-fuchsia-500" />
            <textarea value={eBio} onChange={e => setEBio(e.target.value)} rows="2" placeholder="Bio" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-fuchsia-500 resize-none"></textarea>
            <div className="flex items-center gap-3">
              {eAvatar && <img src={eAvatar} className="w-10 h-10 rounded-full object-cover" alt="" />}
              <input type="file" accept="image/*" onChange={e => pickAvatar(e.target.files[0])} className="flex-1 min-w-0 text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-500 file:text-white" />
            </div>
            <div className="flex gap-2">
              <button onClick={() => setEditing(false)} className="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold">Annuler</button>
              <button onClick={saveProfile} className="flex-1 py-3 bg-gradient-to-r from-fuchsia-500 to-violet-600 rounded-xl text-xs font-extrabold">Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== APERÇU FREESTYLE ===== */}
      {previewUrl && (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-between p-6">
          <h2 className="text-xl font-bold pt-4">Aperçu de ton Freestyle 🎤</h2>
          <video src={previewUrl} controls autoPlay playsInline className="w-full max-w-sm max-h-[60vh] rounded-2xl bg-black object-contain" />
          <div className="w-full max-w-sm flex gap-4 pb-6">
            <button onClick={() => { setPreviewUrl(null); setBlob(null); setRecMode(true); }} className="flex-1 py-3 rounded-xl bg-gray-800 font-semibold">Recommencer 🔄</button>
            <button disabled={uploading} onClick={publishFreestyle} className="flex-1 py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 font-semibold disabled:opacity-60">{uploading ? 'Envoi...' : 'Publier 🚀'}</button>
          </div>
        </div>
      )}

      {/* ===== CAMÉRA & TÉLÉPROMPTEUR ===== */}
      {recMode && (
        <div className="fixed inset-0 bg-black z-50 flex flex-col justify-between overflow-hidden">
          <div className="absolute top-0 inset-x-0 z-50 flex items-center justify-between p-4">
            <span className="bg-pink-600/80 px-3 py-1.5 rounded-full text-xs font-bold uppercase">Mode Studio Actif</span>
            <button onClick={closeStudio} className="w-10 h-10 bg-white/20 rounded-full">✕</button>
          </div>
          <div className="absolute inset-0 bg-zinc-900">
            <video autoPlay playsInline muted className="w-full h-full object-cover scale-x-[-1]"
              ref={node => { camRef.current = node; if (node && !node.srcObject) navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'user' }, audio: true }).then(s => { node.srcObject = s; }).catch(() => {}); }} />
          </div>
          <div className="relative z-10 mt-20 mx-4 max-h-48 overflow-y-auto bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-4 text-center">
            <p className="text-xs uppercase tracking-widest text-pink-400 font-bold mb-2">Téléprompteur 📜</p>
            {lyrics ? <p className="text-lg leading-relaxed whitespace-pre-wrap">{lyrics}</p> : <p className="text-sm text-gray-400 italic">Aucune parole écrite dans le bloc-notes.</p>}
          </div>
          <div className="relative z-10 p-6 pb-10 flex justify-center bg-gradient-to-t from-black/90 to-transparent">
            <button onClick={toggleRec} className={`flex items-center justify-center w-20 h-20 rounded-full border-4 border-white bg-red-600 ${recording ? 'animate-pulse' : ''}`}>
              <div className={`bg-white transition-all ${recording ? 'w-6 h-6 rounded-sm' : 'w-8 h-8 rounded-md'}`}></div>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ClipClapApp />);
</script>
</body>
</html>
