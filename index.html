<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipClap - Vidéos Vibrantes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07040f;
      color: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
    }
    .shadow-text {
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-[#030107]">
  <div id="root" class="h-full w-full max-w-md bg-[#07040f] shadow-2xl relative overflow-hidden flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_POSTS = [
      {
        id: 1,
        user: '@neon_luna',
        authorId: '@neon_luna',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop',
        video: 'https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lights-41643-large.mp4',
        desc: 'Ambiance cyberpunk ce soir dans les rues de Tokyo ! 🌃✨ #neon #tokyo #cyberpunk',
        music: 'Original Sound - Neon Luna',
        likes: 1245,
        comments: 48,
        shares: 12,
        saved: 85,
        viewsCount: '45.2K',
        commentsList: [
          { id: 1, user: '@cyber_sam', text: 'Incroyable cette vidéo ! 🤩', time: 'Il y a 2h' },
          { id: 2, user: '@Julie_vibe', text: 'Quel filtre tu utilises ?', time: 'Il y a 1h' }
        ]
      },
      {
        id: 2,
        user: '@dj_max',
        authorId: '@dj_max',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop',
        video: 'https://assets.mixkit.co/videos/preview/mixkit-dj-playing-music-in-a-nightclub-41316-large.mp4',
        desc: 'Nouvelle instru en exclu, vous en pensez quoi ? 🎧🔥 #dj #music #party',
        music: 'Beats & Bass - DJ Max',
        likes: 3890,
        comments: 112,
        shares: 340,
        saved: 512,
        viewsCount: '120K',
        commentsList: [
          { id: 1, user: '@electro_fan', text: 'Le drop est violent !! 🔥🔥🔥', time: 'Il y a 30m' }
        ]
      },
      {
        id: 3,
        user: '@dance_queen',
        authorId: '@dance_queen',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop',
        video: 'https://assets.mixkit.co/videos/preview/mixkit-woman-dancing-with-neon-lights-in-the-background-41642-large.mp4',
        desc: 'Nouvelle chorée apprise en 10 minutes ! Dites-moi si vous aimez 💃💖 #dance #choreo #vibes',
        music: 'Dance Trend - Official',
        likes: 8920,
        comments: 310,
        shares: 890,
        saved: 1200,
        viewsCount: '250K',
        commentsList: []
      }
    ];

    const INITIAL_CONVS = [
      {
        id: 1,
        user: '@neon_luna',
        lastMsg: 'Incroyable cette vidéo ! 🤩',
        time: '14:32',
        unread: true,
        messages: [
          { sender: '@neon_luna', text: 'Salut ! Tu as vu ma dernière vidéo ?' },
          { sender: '@azizenbiri', text: 'Oui elle est magnifique ! GG 🚀' }
        ]
      },
      {
        id: 2,
        user: '@dj_max',
        lastMsg: 'Le drop est violent !! 🔥🔥🔥',
        time: 'Hier',
        unread: false,
        messages: [
          { sender: '@dj_max', text: 'Yo bro, dispo pour une collab ?' }
        ]
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const [likedPosts, setLikedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState({ 1: 1245, 2: 3890, 3: 8920 });
      const [savedPosts, setSavedPosts] = useState({});
      const [savedCounts, setSavedCounts] = useState({ 1: 85, 2: 512, 3: 1200 });
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState({ '@neon_luna': 1450, '@dj_max': 3200, '@dance_queen': 8900 });

      const [userName, setUserName] = useState('Azize Nbiri');
      const [userTag, setUserTag] = useState('@azizenbiri');
      const [userBio, setUserBio] = useState('✨ Créateur de contenu & passionné de tech 🎬 Bienvenue sur mon profil ClipClap !');
      const [userAvatar, setUserAvatar] = useState('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop');
      const [userFollowersCount, setUserFollowersCount] = useState('1.2K');
      const [userLikesCount, setUserLikesCount] = useState('24.5K');

      const [showUploadModal, setShowUploadModal] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const [newCaption, setNewCaption] = useState('');

      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState('');

      const [viewingCreator, setViewingCreator] = useState(null);
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [chatConversations, setChatConversations] = useState(INITIAL_CONVS);
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState('');

      const videoRef = useRef(null);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);

      useEffect(() => {
        if (showSplash) {
          const interval = setInterval(() => {
            setProgress((old) => {
              if (old >= 100) {
                clearInterval(interval);
                setShowSplash(false);
                return 100;
              }
              return old + 20;
            });
          }, 250);
          return () => clearInterval(interval);
        }
      }, [showSplash]);

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          if (type === 'click') {
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
          } else if (type === 'like') {
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          }
        } catch (e) {}
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      const displayedPosts = feedTab === 'following' 
        ? posts.filter(p => following[p.authorId || p.user])
        : posts;

      useEffect(() => {
        if (!showSplash && videoRef.current) {
          videoRef.current.currentTime = 0;
          videoRef.current.play().catch(() => {});
        }
      }, [currentIndex, feedTab, showSplash]);

      const togglePlayPause = () => {
        if (!videoRef.current) return;
        if (isPlaying) {
          videoRef.current.pause();
          setIsPlaying(false);
        } else {
          videoRef.current.play().catch(() => {});
          setIsPlaying(true);
        }
        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (displayedPosts.length === 0) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX > 40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(displayedPosts[currentIndex]);
          return;
        }

        if (Math.abs(diffY) > 40 && Math.abs(diffX) < 50) {
          if (diffY > 0) {
            setCurrentIndex(prev => (prev + 1) % displayedPosts.length);
          } else {
            setCurrentIndex(prev => (prev - 1 + displayedPosts.length) % displayedPosts.length);
          }
        }
      };

      const handleProfileTouchEnd = (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;
        if (diffX < -40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(null);
        }
      };

      if (showSplash) {
        return (
          <div className="h-full w-full flex flex-col items-center justify-center bg-[#07040f] text-white select-none">
            <div className="relative mb-6">
              <div className="absolute -inset-4 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-3xl blur-xl opacity-70 animate-pulse"></div>
              <div className="relative w-24 h-24 bg-[#120c24] border border-white/10 rounded-3xl flex items-center justify-center shadow-2xl">
                <span className="text-4xl">🎬</span>
              </div>
            </div>
            <h1 className="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-2">
              ClipClap
            </h1>
            <p className="text-sm text-gray-400 mb-8 font-medium">L'application de courtes vidéos vibrantes</p>
            <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>
          </div>
        );
      }

      const currentPost = displayedPosts[currentIndex];
      return (
        <div className="h-full w-full flex flex-col bg-black overflow-hidden relative font-sans select-none">
          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-black/80 backdrop-blur-md border border-white/10 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2">
              <span>⚡</span> {toastMessage}
            </div>
          )}

          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 video-swipe-area"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
              >
                {displayedPosts.length > 0 && currentPost ? (
                  <div className="relative h-full w-full bg-black flex items-center justify-center">
                    <video
                      ref={videoRef}
                      src={currentPost.video}
                      className="absolute inset-0 h-full w-full object-cover"
                      loop
                      playsInline
                      autoPlay
                      muted={isMuted}
                      onClick={togglePlayPause}
                    />

                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

                    {/* EN-TÊTE : Abonnements / Pour toi */}
                    <div className="absolute top-0 left-0 right-0 z-30 pt-3 pb-2 flex items-center justify-center gap-6 px-4 bg-gradient-to-b from-black/90 via-black/50 to-transparent">
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('following'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'following' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Abonnements
                      </button>
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('foryou'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'foryou' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Pour toi
                      </button>
                    </div>

                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                        <div className="w-16 h-16 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center text-white text-2xl animate-ping">
                          {isPlaying ? '▶️' : '⏸️'}
                        </div>
                      </div>
                    )}

                    <button 
                      onClick={() => { playSound('click'); setIsMuted(!isMuted); }}
                      className="absolute top-14 right-4 z-30 w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white text-base shadow-lg"
                    >
                      {isMuted ? '🔇' : '🔊'}
                    </button>

                    <div className="absolute top-1/2 right-2 transform -translate-y-1/2 z-20 pointer-events-none opacity-40 flex flex-col items-center gap-1">
                      <span className="text-[10px] text-white font-semibold">Profil</span>
                      <span className="text-white text-xs animate-pulse">‹</span>
                    </div>

                    {/* BOUTONS D'ACTION LATÉRAUX (DROITE) */}
                    <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">
                      <div className="relative mb-1">
                        <div 
                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="w-11 h-11 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 cursor-pointer shadow-lg"
                        >
                          <img 
                            src={currentPost.authorId === userTag || currentPost.user === userTag ? userAvatar : (currentPost.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop")} 
                            alt="avatar" 
                            className="w-full h-full object-cover" 
                          />
                        </div>
                        {currentPost.authorId !== userTag && currentPost.user !== userTag && !(following[currentPost.authorId || currentPost.user]) && (
                          <button 
                            onClick={(e) => {
                              e.stopPropagation();
                              const authorKey = currentPost.authorId || currentPost.user;
                              setFollowing(prev => ({ ...prev, [authorKey]: true }));
                              setCreatorFollowers(prev => ({ ...prev, [authorKey]: (prev[authorKey] || 1000) + 1 }));
                              showToast(`Abonné à ${authorKey} ! ✨`);
                              playSound('click');
                            }}
                            className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md hover:scale-110 transition-transform"
                          >
                            +
                          </button>
                        )}
                      </div>

                      {/* Like */}
                      <button 
                        onClick={(e) => {
                          e.stopPropagation();
                          playSound('like');
                          const id = currentPost.id;
                          const isLiked = likedPosts[id];
                          setLikedPosts(prev => ({ ...prev, [id]: !isLiked }));
                          setLikeCounts(prev => ({ ...prev, [id]: isLiked ? prev[id] - 1 : prev[id] + 1 }));
                        }}
                        className="flex flex-col items-center group"
                      >
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${likedPosts[currentPost.id] ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">❤️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {likeCounts[currentPost.id]}
                        </span>
                      </button>

                      {/* Commentaires */}
                      <button 
                        onClick={() => { playSound('click'); setShowCommentsModal(true); }}
                        className="flex flex-col items-center group"
                      >
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">💬</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {currentPost.comments || (currentPost.commentsList ? currentPost.commentsList.length : 0)}
                        </span>
                      </button>

                      {/* Favoris */}
                      <button 
                        onClick={(e) => {
                          e.stopPropagation();
                          playSound('click');
                          const id = currentPost.id;
                          const isSaved = savedPosts[id];
                          setSavedPosts(prev => ({ ...prev, [id]: !isSaved }));
                          setSavedCounts(prev => ({ ...prev, [id]: isSaved ? prev[id] - 1 : prev[id] + 1 }));
                          showToast(isSaved ? "Retiré des favoris" : "Ajouté aux favoris ! 📌");
                        }}
                        className="flex flex-col items-center group"
                      >
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${savedPosts[currentPost.id] ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">📌</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {savedCounts[currentPost.id]}
                        </span>
                      </button>

                      {/* Partager */}
                      <button 
                        onClick={(e) => {
                          e.stopPropagation();
                          playSound('click');
                          if (navigator.share) {
                            navigator.share({ title: 'ClipClap', url: window.location.href });
                          } else {
                            navigator.clipboard.writeText(window.location.href);
                            showToast("Lien copié dans le presse-papier ! 🔗");
                          }
                        }}
                        className="flex flex-col items-center group"
                      >
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">↗️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {currentPost.shares}
                        </span>
                      </button>
                    </div>

                    {/* INFOS DU POST (BAS GAUCHE) */}
                    <div className="absolute left-4 bottom-20 right-16 z-30 pointer-events-auto">
                      <div className="flex items-center gap-2 mb-2">
                        <span 
                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="font-extrabold text-base text-white cursor-pointer hover:underline"
                        >
                          {currentPost.user}
                        </span>
                        {following[currentPost.authorId || currentPost.user] && (
                          <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full text-white/90 font-medium">Abonné</span>
                        )}
                      </div>
                      <p className="text-sm text-gray-200 mb-2.5 font-normal leading-relaxed line-clamp-2">
                        {currentPost.desc}
                      </p>
                      <div className="flex items-center gap-2 text-xs text-gray-300 bg-black/30 backdrop-blur-md px-3 py-1.5 rounded-full w-fit border border-white/10">
                        <span>🎵</span>
                        <span className="truncate max-w-[200px]">{currentPost.music}</span>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400">
                    <span className="text-4xl mb-2">📭</span>
                    <p className="text-sm font-medium">Aucune vidéo dans cet onglet</p>
                    <button 
                      onClick={() => setFeedTab('foryou')}
                      className="mt-4 px-4 py-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-full text-xs font-bold"
                    >
                      Voir "Pour toi"
                    </button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'search' && (
              <div className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-12 pb-24">
                <h2 className="text-xl font-extrabold mb-4">Découvrir</h2>
                <div className="relative mb-6">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Rechercher un utilisateur, un hashtag..."
                    className="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 transition-colors"
                  />
                  <span className="absolute left-3.5 top-3.5 text-sm">🔍</span>
                </div>

                <div className="mb-6">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Tendances du moment</h3>
                  <div className="flex flex-wrap gap-2">
                    {['#neon', '#cyberpunk', '#dance', '#vibes', '#music', '#art'].map((tag, idx) => (
                      <button 
                        key={idx}
                        onClick={() => { playSound('click'); setSearchQuery(tag); }}
                        className="bg-white/5 hover:bg-white/10 border border-white/10 px-3.5 py-2 rounded-xl text-xs font-semibold text-gray-200 transition-colors"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Créateurs suggérés</h3>
                  <div className="space-y-3">
                    {posts.map((p, idx) => (
                      <div key={idx} className="flex items-center justify-between bg-white/5 border border-white/10 p-3 rounded-2xl">
                        <div className="flex items-center gap-3">
                          <img src={p.authorId === userTag || p.user === userTag ? userAvatar : p.avatar} alt="avatar" className="w-10 h-10 rounded-full object-cover border border-pink-500" />
                          <div>
                            <h4 className="text-sm font-bold">{p.user}</h4>
                            <p className="text-xs text-gray-400">{creatorFollowers[p.authorId || p.user] || 1000} abonnés</p>
                          </div>
                        </div>
                        <button 
                          onClick={() => {
                            playSound('click');
                            const authorKey = p.authorId || p.user;
                            const isFollowed = following[authorKey];
                            setFollowing(prev => ({ ...prev, [authorKey]: !isFollowed }));
                            setCreatorFollowers(prev => ({ ...prev, [authorKey]: isFollowed ? prev[authorKey] - 1 : prev[authorKey] + 1 }));
                            showToast(isFollowed ? `Désabonné de ${authorKey}` : `Abonné à ${authorKey} ! ✨`);
                          }}
                          className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${following[p.authorId || p.user] ? 'bg-white/20 text-white' : 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md'}`}
                        >
                          {following[p.authorId || p.user] ? 'Abonné' : 'Suivre'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'inbox' && (
              <div className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-12 pb-24">
                <h2 className="text-xl font-extrabold mb-4">Messages</h2>
                <div className="space-y-3">
                  {chatConversations.map((conv) => (
                    <div 
                      key={conv.id}
                      onClick={() => { playSound('click'); setActiveChat(conv); }}
                      className="flex items-center justify-between bg-white/5 border border-white/10 p-3.5 rounded-2xl cursor-pointer hover:bg-white/10 transition-colors"
                    >
                      <div className="flex items-center gap-3">
                        <div className="relative">
                          <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-base">
                            {conv.user.charAt(1).toUpperCase()}
                          </div>
                          {conv.unread && <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-pink-500 rounded-full border-2 border-[#07040f]"></span>}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="text-sm font-bold">{conv.user}</h4>
                            <span className="text-[10px] text-gray-400">{conv.time}</span>
                          </div>
                          <p className="text-xs text-gray-300 truncate max-w-[200px] mt-0.5">{conv.lastMsg}</p>
                        </div>
                      </div>
                      <span className="text-gray-400 text-sm">›</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div 
                className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-10 pb-24 video-swipe-area"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleProfileTouchEnd}
              >
                <div className="flex flex-col items-center mt-4">
                  <div className="relative mb-3">
                    <div className="w-24 h-24 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 shadow-xl">
                      <img src={userAvatar} alt="avatar" className="w-full h-full object-cover" />
                    </div>
                  </div>
                  <h2 className="text-xl font-extrabold text-white flex items-center gap-1.5">
                    {userName} <span className="text-pink-500 text-sm">✓</span>
                  </h2>
                  <p className="text-xs text-gray-400 font-medium mb-3">{userTag}</p>
                  <p className="text-xs text-gray-200 text-center max-w-xs mb-5 font-normal px-4">
                    {userBio}
                  </p>

                  <div className="flex items-center gap-6 mb-6 text-center">
                    <div>
                      <span className="block font-extrabold text-base">245</span>
                      <span className="text-[11px] text-gray-400">Abonnements</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/15"></div>
                    <div>
                      <span className="block font-extrabold text-base">{userFollowersCount}</span>
                      <span className="text-[11px] text-gray-400">Abonnés</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/15"></div>
                    <div>
                      <span className="block font-extrabold text-base">{userLikesCount}</span>
                      <span className="text-[11px] text-gray-400">J'aime</span>
                    </div>
                  </div>

                  <div className="flex gap-2 w-full max-w-xs mb-6">
                    <button 
                      onClick={() => { playSound('click'); setIsEditingProfile(true); }}
                      className="flex-1 bg-white/10 hover:bg-white/15 border border-white/10 py-2 rounded-xl text-xs font-bold text-white transition-colors"
                    >
                      Modifier le profil
                    </button>
                    <button 
                      onClick={() => { playSound('click'); showToast("Lien du profil partagé !"); }}
                      className="w-10 bg-white/10 hover:bg-white/15 border border-white/10 py-2 rounded-xl text-xs font-bold text-white flex items-center justify-center transition-colors"
                    >
                      🔗
                    </button>
                  </div>
                </div>

                <div className="border-t border-white/10 pt-4">
                  <div className="flex justify-center gap-8 mb-4">
                    <span className="text-xs font-bold text-white border-b-2 border-pink-500 pb-1">Mes vidéos</span>
                    <span className="text-xs font-semibold text-gray-400">Favoris</span>
                  </div>

                  <div className="grid grid-cols-3 gap-1">
                    {posts.filter(p => p.authorId === userTag || p.user === userTag).map((p, idx) => (
                      <div key={idx} className="relative aspect-[9/16] bg-gray-900 overflow-hidden rounded-lg">
                        <video src={p.video} className="w-full h-full object-cover" muted />
                        <div className="absolute bottom-1 left-1.5 flex items-center gap-1 text-[10px] text-white font-bold bg-black/40 px-1.5 py-0.5 rounded backdrop-blur-sm">
                          <span>▶</span> {p.viewsCount || '1'}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
          {/* BARRE DE NAVIGATION INFÉRIEURE */}
          <div className="absolute bottom-0 left-0 right-0 h-16 bg-[#07040f]/90 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-2 z-40">
            <button 
              onClick={() => { playSound('click'); setActiveTab('feed'); setViewingCreator(null); }}
              className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${activeTab === 'feed' && !viewingCreator ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">🏠</span>
              <span className="text-[10px] mt-0.5">Accueil</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setActiveTab('search'); setViewingCreator(null); }}
              className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${activeTab === 'search' && !viewingCreator ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">🔍</span>
              <span className="text-[10px] mt-0.5">Découvrir</span>
            </button>

            {/* BOUTON CRÉATION (+) CENTRAL */}
            <div className="flex-1 flex items-center justify-center">
              <button 
                onClick={() => { playSound('click'); setShowUploadModal(true); }}
                className="w-11 h-10 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-xl flex items-center justify-center text-white text-xl font-extrabold shadow-lg shadow-pink-500/30 hover:scale-105 transition-transform"
              >
                +
              </button>
            </div>

            <button 
              onClick={() => { playSound('click'); setActiveTab('inbox'); setViewingCreator(null); }}
              className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${activeTab === 'inbox' && !viewingCreator ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">💬</span>
              <span className="text-[10px] mt-0.5">Boîte de réception</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setActiveTab('profile'); setViewingCreator(null); }}
              className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${activeTab === 'profile' && !viewingCreator ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">👤</span>
              <span className="text-[10px] mt-0.5">Profil</span>
            </button>
          </div>

          {/* VUE PROFIL CRÉATEUR */}
          {viewingCreator && (
            <div 
              className="absolute inset-0 bg-[#07040f] z-50 overflow-y-auto p-4 pt-10 pb-24 video-swipe-area animate-in fade-in slide-in-from-right duration-200"
              onTouchStart={handleTouchStart}
              onTouchEnd={handleProfileTouchEnd}
            >
              <div className="flex items-center justify-between mb-4">
                <button 
                  onClick={() => { playSound('click'); setViewingCreator(null); }}
                  className="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center text-white text-sm"
                >
                  ✕
                </button>
                <span className="text-xs font-bold text-gray-300">{viewingCreator.user}</span>
                <div className="w-9"></div>
              </div>

              <div className="flex flex-col items-center mt-2">
                <div className="w-24 h-24 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 shadow-xl mb-3">
                  <img src={viewingCreator.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop"} alt="avatar" className="w-full h-full object-cover" />
                </div>
                <h2 className="text-xl font-extrabold text-white flex items-center gap-1.5">
                  {viewingCreator.user.replace('@', '')} <span className="text-pink-500 text-sm">✓</span>
                </h2>
                <p className="text-xs text-gray-400 font-medium mb-3">{viewingCreator.authorId || viewingCreator.user}</p>
                <p className="text-xs text-gray-200 text-center max-w-xs mb-5 font-normal px-4">
                  Créateur passionné sur ClipClap 🚀 Partage de moments uniques et vibes quotidiennes !
                </p>

                <div className="flex items-center gap-6 mb-6 text-center">
                  <div>
                    <span className="block font-extrabold text-base">180</span>
                    <span className="text-[11px] text-gray-400">Abonnements</span>
                  </div>
                  <div className="w-[1px] h-6 bg-white/15"></div>
                  <div>
                    <span className="block font-extrabold text-base">{creatorFollowers[viewingCreator.authorId || viewingCreator.user] || 1200}</span>
                    <span className="text-[11px] text-gray-400">Abonnés</span>
                  </div>
                  <div className="w-[1px] h-6 bg-white/15"></div>
                  <div>
                    <span className="block font-extrabold text-base">45.2K</span>
                    <span className="text-[11px] text-gray-400">J'aime</span>
                  </div>
                </div>

                <div className="flex gap-2 w-full max-w-xs mb-6">
                  <button 
                    onClick={() => {
                      playSound('click');
                      const authorKey = viewingCreator.authorId || viewingCreator.user;
                      const isFollowed = following[authorKey];
                      setFollowing(prev => ({ ...prev, [authorKey]: !isFollowed }));
                      setCreatorFollowers(prev => ({ ...prev, [authorKey]: isFollowed ? prev[authorKey] - 1 : prev[authorKey] + 1 }));
                      showToast(isFollowed ? `Désabonné` : `Abonné avec succès ! ✨`);
                    }}
                    className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all ${following[viewingCreator.authorId || viewingCreator.user] ? 'bg-white/15 text-white' : 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg'}`}
                  >
                    {following[viewingCreator.authorId || viewingCreator.user] ? 'Abonné' : 'S\'abonner'}
                  </button>
                  <button 
                    onClick={() => {
                      playSound('click');
                      const authorKey = viewingCreator.authorId || viewingCreator.user;
                      let conv = chatConversations.find(c => c.user === authorKey);
                      if (!conv) {
                        conv = { id: Date.now(), user: authorKey, lastMsg: 'Bonjour !', time: 'À l\'instant', unread: false, messages: [{ sender: authorKey, text: 'Salut !' }] };
                        setChatConversations([conv, ...chatConversations]);
                      }
                      setActiveChat(conv);
                      setViewingCreator(null);
                      setActiveTab('inbox');
                    }}
                    className="flex-1 bg-white/10 hover:bg-white/15 border border-white/10 py-2.5 rounded-xl text-xs font-bold text-white transition-colors"
                  >
                    Message
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL COMMENTAIRES */}
          {showCommentsModal && currentPost && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-md z-50 flex flex-col justify-end animate-in fade-in">
              <div className="bg-[#0f0a1f] border-t border-white/10 rounded-t-3xl h-[60vh] flex flex-col p-4">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-sm font-bold">
                    {currentPost.commentsList ? currentPost.commentsList.length : 0} commentaires
                  </h3>
                  <button 
                    onClick={() => setShowCommentsModal(false)}
                    className="w-7 h-7 bg-white/10 rounded-full flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-3 space-y-3">
                  {currentPost.commentsList && currentPost.commentsList.length > 0 ? (
                    currentPost.commentsList.map((c, idx) => (
                      <div key={idx} className="flex items-start gap-3">
                        <div className="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center text-xs font-bold shrink-0">
                          {c.user.charAt(1).toUpperCase()}
                        </div>
                        <div className="flex-1 bg-white/5 border border-white/10 p-2.5 rounded-2xl">
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-xs font-bold text-pink-400">{c.user}</span>
                            <span className="text-[10px] text-gray-500">{c.time}</span>
                          </div>
                          <p className="text-xs text-gray-200">{c.text}</p>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-gray-500 text-xs">
                      <span>💬</span>
                      <p className="mt-1">Aucun commentaire pour l'instant. Soyez le premier !</p>
                    </div>
                  )}
                </div>

                <div className="pt-2 border-t border-white/10 flex gap-2">
                  <input
                    type="text"
                    value={newCommentText}
                    onChange={(e) => setNewCommentText(e.target.value)}
                    placeholder="Ajouter un commentaire..."
                    className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-500"
                  />
                  <button 
                    onClick={() => {
                      if (!newCommentText.trim()) return;
                      playSound('click');
                      const updatedComments = [
                        ...(currentPost.commentsList || []),
                        { id: Date.now(), user: userTag, text: newCommentText, time: 'À l\'instant' }
                      ];
                      setPosts(posts.map(p => p.id === currentPost.id ? { ...p, commentsList: updatedComments, comments: (p.comments || 0) + 1 } : p));
                      setNewCommentText('');
                      showToast("Commentaire publié ! 💬");
                    }}
                    className="bg-gradient-to-r from-pink-500 to-purple-600 px-4 py-2 rounded-xl text-xs font-bold"
                  >
                    Envoyer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL UPLOAD / CRÉATION */}
          {showUploadModal && (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-[#120c24] border border-white/10 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-extrabold">Publier une vidéo</h3>
                  <button onClick={() => setShowUploadModal(false)} className="w-7 h-7 bg-white/10 rounded-full flex items-center justify-center text-xs">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-400 mb-1.5">Lien de la vidéo (MP4)</label>
                    <input 
                      type="text"
                      placeholder="https://... ou fichier local"
                      value={selectedFile || ''}
                      onChange={(e) => setSelectedFile(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                    <p className="text-[10px] text-gray-500 mt-1">Astuce : Vous pouvez coller un lien direct de vidéo .mp4</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-400 mb-1.5">Description & Hashtags</label>
                    <textarea 
                      rows="3"
                      value={newCaption}
                      onChange={(e) => setNewCaption(e.target.value)}
                      placeholder="Décrivez votre vidéo... #vibes #clipclap"
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"
                    ></textarea>
                  </div>

                  <button 
                    onClick={() => {
                      playSound('click');
                      const videoUrl = selectedFile.trim() || 'https://assets.mixkit.co/videos/preview/mixkit-ider-woman-running-in-neon-lights-41641-large.mp4';
                      const newPostObj = {
                        id: Date.now(),
                        user: userTag,
                        authorId: userTag,
                        avatar: userAvatar,
                        video: videoUrl,
                        desc: newCaption.trim() || 'Ma nouvelle vidéo sur ClipClap ! 🎬✨ #clipclap',
                        music: 'Original Sound - ' + userName,
                        likes: 1,
                        comments: 0,
                        shares: 0,
                        saved: 0,
                        viewsCount: '1',
                        commentsList: []
                      };
                      setPosts([newPostObj, ...posts]);
                      setShowUploadModal(false);
                      setSelectedFile(null);
                      setNewCaption('');
                      setCurrentIndex(0);
                      setActiveTab('feed');
                      showToast("Vidéo publiée avec succès ! 🎉");
                    }}
                    className="w-full bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 py-3 rounded-xl text-xs font-extrabold shadow-lg shadow-pink-500/20"
                  >
                    Publier sur ClipClap
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EDITION PROFIL */}
          {isEditingProfile && (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-[#120c24] border border-white/10 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-extrabold">Modifier le profil</h3>
                  <button onClick={() => setIsEditingProfile(false)} className="w-7 h-7 bg-white/10 rounded-full flex items-center justify-center text-xs">✕</button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-gray-400 mb-1">Nom</label>
                    <input 
                      type="text" 
                      value={userName} 
                      onChange={(e) => setUserName(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-400 mb-1">Bio</label>
                    <textarea 
                      rows="2" 
                      value={userBio} 
                      onChange={(e) => setUserBio(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-400 mb-1">Avatar (Lien image)</label>
                    <input 
                      type="text" 
                      value={userAvatar} 
                      onChange={(e) => setUserAvatar(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500" 
                    />
                  </div>
                  <button 
                    onClick={() => {
                      playSound('click');
                      setIsEditingProfile(false);
                      showToast("Profil mis à jour avec succès ! ✨");
                    }}
                    className="w-full mt-2 bg-gradient-to-r from-pink-500 to-purple-600 py-2.5 rounded-xl text-xs font-bold shadow-md"
                  >
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VUE DISCUSSION CHAT */}
          {activeChat && (
            <div className="absolute inset-0 bg-[#07040f] z-50 flex flex-col animate-in slide-in-from-right duration-200">
              <div className="p-4 pt-10 border-b border-white/10 flex items-center justify-between bg-[#0f0a1f]">
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setActiveChat(null)}
                    className="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-xs"
                  >
                    ‹
                  </button>
                  <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-sm">
                    {activeChat.user.charAt(1).toUpperCase()}
                  </div>
                  <div>
                    <h3 className="text-sm font-bold">{activeChat.user}</h3>
                    <span className="text-[10px] text-green-400 flex items-center gap-1">● En ligne</span>
                  </div>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {activeChat.messages.map((m, idx) => {
                  const isMe = m.sender === userTag || m.sender === userName;
                  return (
                    <div key={idx} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-br-none' : 'bg-white/10 text-gray-200 rounded-bl-none border border-white/10'}`}>
                        {m.text}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="p-3 border-t border-white/10 bg-[#0f0a1f] flex gap-2">
                <input 
                  type="text" 
                  placeholder="Écrire un message..."
                  value={newMessageText}
                  onChange={(e) => setNewMessageText(e.target.value)}
                  className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-500"
                />
                <button 
                  onClick={() => {
                    if (!newMessageText.trim()) return;
                    playSound('click');
                    const updatedMsgs = [...activeChat.messages, { sender: userTag, text: newMessageText }];
                    const updatedChat = { ...activeChat, messages: updatedMsgs, lastMsg: newMessageText };
                    setActiveChat(updatedChat);
                    setChatConversations(chatConversations.map(c => c.id === updatedChat.id ? updatedChat : c));
                    setNewMessageText('');
                  }}
                  className="bg-gradient-to-r from-pink-500 to-purple-600 px-4 py-2 rounded-xl text-xs font-bold"
                >
                  Envoyer
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
