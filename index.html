<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipClap - Le futur du divertissement</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel pour JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #000; margin: 0; padding: 0; overflow: hidden; }
    /* Cache les barres de défilement mais garde le scroll */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      
      const [likedPosts, setLikedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState({ 1: 1240, 2: 8520, 3: 410 });
      const [savedPosts, setSavedPosts] = useState({});
      const [savedCounts, setSavedCounts] = useState({ 1: 340, 2: 1200, 3: 85 });
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState({});
      
      const [viewingCreator, setViewingCreator] = useState(null);
      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState('');
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const [newCaption, setNewCaption] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      const [userName, setUserName] = useState("Alexandre");
      const [userTag, setUserTag] = useState("@alex_dev");
      const [userBio, setUserBio] = useState("Créateur de contenu & passionné de tech 🚀 | ClipClap Creator");
      const [userFollowingCount, setUserFollowingCount] = useState(142);
      const [userFollowersCount, setUserFollowersCount] = useState(1280);
      const [userLikesCount, setUserLikesCount] = useState("14.5K");

      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState('');
      const [chatConversations, setChatConversations] = useState([
        {
          id: 1,
          user: "@LinaNeon",
          lastMsg: "Super ta dernière vidéo ! 🔥",
          time: "Il y a 10 min",
          unread: true,
          messages: [
            { sender: "@LinaNeon", text: "Salut ! J'adore ton contenu." },
            { sender: "@alex_dev", text: "Merci beaucoup Lina !" },
            { sender: "@LinaNeon", text: "Super ta dernière vidéo ! 🔥" }
          ]
        }
      ]);

      const [posts, setPosts] = useState([
        {
          id: 1,
          user: "@LinaNeon",
          authorId: "@LinaNeon",
          desc: "Ambiance néon cyberpunk incroyable ce soir ! 🔥 #cyberpunk #neon #vibes",
          video: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lights-41656-large.neon",
          music: "Original Sound - LinaNeon",
          likes: 1240,
          comments: 42,
          views: "12.4K",
          followers: "45.2K",
          totalLikes: "180K",
          followingCount: 88,
          commentsList: [
            { id: 1, user: "@CyberSam", text: "Tellement stylé !", time: "Il y a 5 min" }
          ]
        },
        {
          id: 2,
          user: "@DJ_Vortex",
          authorId: "@DJ_Vortex",
          desc: "Le set de la folie hier au club ! Qui était là ? 🎧✨ #dj #party #music",
          video: "https://assets.mixkit.co/videos/preview/mixkit-dj-playing-music-at-a-party-43093-large.neon",
          music: "Electro Bass Boost - DJ Vortex",
          likes: 8520,
          comments: 310,
          views: "85K",
          followers: "120K",
          totalLikes: "1.2M",
          followingCount: 210,
          commentsList: []
        },
        {
          id: 3,
          user: "@CodeMaster",
          authorId: "@CodeMaster",
          desc: "Astuce secrète pour booster ton app en 2026 📱🚀 #tech #dev #tips",
          video: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-green-screen-42358-large.neon",
          music: "Lo-Fi Chill Beat - CodeMaster",
          likes: 410,
          comments: 12,
          views: "4.1K",
          followers: "12.5K",
          totalLikes: "45K",
          followingCount: 45,
          commentsList: []
        }
      ]);

      const videoRef = useRef(null);

      useEffect(() => {
        if (showSplash) {
          const interval = setInterval(() => {
            setProgress((prev) => {
              if (prev >= 100) {
                clearInterval(interval);
                setTimeout(() => setShowSplash(false), 400);
                return 100;
              }
              return prev + 15;
            });
          }, 100);
          return () => clearInterval(interval);
        }
      }, [showSplash]);

      const displayedPosts = feedTab === 'following' 
        ? posts.filter(p => following[p.authorId || p.user]) 
        : posts;

      useEffect(() => {
        if (videoRef.current) {
          if (isPlaying) {
            videoRef.current.play().catch(() => {});
          } else {
            videoRef.current.pause();
          }
        }
      }, [currentIndex, isPlaying, feedTab]);

      const togglePlayPause = () => {
        setIsPlaying(!isPlaying);
        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleTouchStart = (e) => {
        window.touchStartY = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (!window.touchStartY) return;
        const diff = window.touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(diff) > 50) {
          if (diff > 0 && currentIndex < displayedPosts.length - 1) {
            setCurrentIndex(currentIndex + 1);
            setIsPlaying(true);
          } else if (diff < 0 && currentIndex > 0) {
            setCurrentIndex(currentIndex - 1);
            setIsPlaying(true);
          }
        }
        window.touchStartY = null;
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        const isLiked = !!likedPosts[postId];
        setLikedPosts({ ...likedPosts, [postId]: !isLiked });
        setLikeCounts({ ...likeCounts, [postId]: isLiked ? likeCounts[postId] - 1 : likeCounts[postId] + 1 });
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        const isSaved = !!savedPosts[postId];
        setSavedPosts({ ...savedPosts, [postId]: !isSaved });
        showToast(isSaved ? "Retiré des favoris" : "Ajouté aux favoris ⭐");
      };

      const handleFollow = (author, e) => {
        if (e) e.stopPropagation();
        const isFollowing = !!following[author];
        setFollowing({ ...following, [author]: !isFollowing });
        showToast(isFollowing ? `Tu ne suis plus ${author}` : `Tu suis maintenant ${author} 🎉`);
      };

      const handleShare = (e) => {
        e.stopPropagation();
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien copié ! 🔗");
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        const currentPost = displayedPosts[currentIndex];
        const updatedPosts = posts.map(p => {
          if (p.id === currentPost.id) {
            return {
              ...p,
              commentsList: [...(p.commentsList || []), { id: Date.now(), user: userTag, text: newCommentText, time: "À l'instant" }]
            };
          }
          return p;
        });
        setPosts(updatedPosts);
        setNewCommentText('');
      };

      return (
        <div className="relative w-full h-screen bg-[#0b0719] text-white font-sans overflow-hidden flex flex-col justify-between select-none">
          
          {/* SPLASH SCREEN */}
          {showSplash && (
            <div className="fixed inset-0 bg-[#070412] z-50 flex flex-col items-center justify-between p-8 text-center overflow-hidden">
              <div className="absolute -top-20 -left-20 w-72 h-72 bg-purple-600/30 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
              <div className="absolute -bottom-20 -right-20 w-72 h-72 bg-pink-600/30 rounded-full blur-3xl pointer-events-none animate-pulse"></div>

              <div className="pt-8 z-10">
                <span className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-[11px] font-extrabold uppercase tracking-widest bg-white/10 text-pink-300 border border-white/15 backdrop-blur-md shadow-lg">
                  <span className="w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
                  Édition 2026 • Le futur du divertissement
                </span>
              </div>

              <div className="flex flex-col items-center z-10 my-auto">
                <div className="relative mb-8">
                  <div className="absolute -inset-6 bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 rounded-full blur-2xl opacity-60 animate-pulse"></div>
                  <div className="relative w-28 h-28 bg-gradient-to-tr from-purple-600 via-pink-500 to-amber-400 rounded-[2.5rem] flex items-center justify-center shadow-2xl border-2 border-white/30">
                    <svg className="w-14 h-14 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                </div>

                <h1 className="text-5xl font-black tracking-wider bg-gradient-to-r from-white via-pink-200 to-purple-300 bg-clip-text text-transparent mb-3">
                  ClipClap
                </h1>
                <p className="text-purple-200/90 text-sm font-medium max-w-xs leading-relaxed mb-8">
                  Swipe, partage et vibre au rythme des meilleures créations de la communauté.
                </p>

                <div className="grid grid-cols-3 gap-3 w-full max-w-xs mb-6">
                  <div className="bg-white/5 border border-white/10 rounded-2xl p-3 flex flex-col items-center">
                    <span className="text-pink-400 font-black text-base">HD</span>
                    <span className="text-[10px] text-white/60 font-semibold uppercase">Flux Fluide</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-2xl p-3 flex flex-col items-center">
                    <span className="text-purple-400 font-black text-base">100%</span>
                    <span className="text-[10px] text-white/60 font-semibold uppercase">Interactif</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-2xl p-3 flex flex-col items-center">
                    <span className="text-amber-400 font-black text-base">VIP</span>
                    <span className="text-[10px] text-white/60 font-semibold uppercase">Créateurs</span>
                  </div>
                </div>
              </div>

              <div className="w-full max-w-xs pb-6 z-10 flex flex-col items-center gap-3">
                <div className="w-full h-2 bg-white/10 rounded-full overflow-hidden border border-white/10 p-0.5">
                  <div className="h-full bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                </div>
                <span className="text-[11px] text-purple-300/70 font-semibold">
                  {progress < 100 ? "Préparation de ton expérience..." : "C'est parti ! 🚀"}
                </span>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-black/80 border border-white/20 text-white text-xs font-bold px-4 py-2 rounded-xl backdrop-blur-md z-50 shadow-2xl">
              {toastMessage}
            </div>
          )}

          {/* CONTENU PRINCIPAL */}
          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 bg-neutral-950 flex flex-col justify-between overflow-hidden"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
              >
                {displayedPosts.length > 0 ? (
                  <div className="absolute inset-0 cursor-pointer" onClick={togglePlayPause}>
                    <video 
                      ref={videoRef}
                      src={displayedPosts[currentIndex]?.video} 
                      className="w-full h-full object-cover"
                      loop 
                      playsInline 
                      muted={isMuted}
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/80 pointer-events-none"></div>

                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className="w-16 h-16 bg-black/50 backdrop-blur-md rounded-full flex items-center justify-center text-white text-2xl border border-white/20 animate-ping">
                          {isPlaying ? '▶' : '⏸'}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-white/70">
                    <p className="text-sm font-bold mb-2">Aucune vidéo dans "Abonnements"</p>
                    <button onClick={() => setFeedTab('foryou')} className="bg-gradient-to-r from-pink-500 to-purple-600 px-6 py-2.5 rounded-xl text-xs font-bold text-white">
                      Voir le flux "Pour toi"
                    </button>
                  </div>
                )}

                {/* EN-TÊTE ABONNEMENTS / POUR TOI REMONTÉ */}
                <div className="absolute top-0 left-0 right-0 z-30 flex justify-center items-center gap-6 pt-12 pb-3 pointer-events-auto">
                  <button 
                    onClick={() => { setFeedTab('following'); setCurrentIndex(0); }}
                    className={`text-sm font-extrabold tracking-wide transition-all drop-shadow-md ${feedTab === 'following' ? 'text-white border-b-2 border-white pb-1 scale-105' : 'text-white/60'}`}
                  >
                    Abonnements
                  </button>
                  <span className="text-white/30 font-light">|</span>
                  <button 
                    onClick={() => { setFeedTab('foryou'); setCurrentIndex(0); }}
                    className={`text-sm font-extrabold tracking-wide transition-all drop-shadow-md ${feedTab === 'foryou' ? 'text-white border-b-2 border-white pb-1 scale-105' : 'text-white/60'}`}
                  >
                    Pour toi
                  </button>
                </div>

                {/* BOUTONS DROITE */}
                {displayedPosts.length > 0 && (
                  <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-5">
                    <div 
                      onClick={() => setViewingCreator(displayedPosts[currentIndex])}
                      className="relative w-11 h-11 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 p-0.5 cursor-pointer shadow-xl border border-white/20 flex items-center justify-center font-bold text-xs"
                    >
                      {displayedPosts[currentIndex].user.substring(1, 3).toUpperCase()}
                    </div>

                    <div className="flex flex-col items-center gap-1">
                      <button onClick={(e) => handleLike(displayedPosts[currentIndex].id, e)} className="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white shadow-xl">
                        ❤️
                      </button>
                      <span className="text-[11px] font-extrabold">{likeCounts[displayedPosts[currentIndex].id] || displayedPosts[currentIndex].likes}</span>
                    </div>

                    <div className="flex flex-col items-center gap-1">
                      <button onClick={() => setShowCommentsModal(true)} className="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white shadow-xl">
                        💬
                      </button>
                      <span className="text-[11px] font-extrabold">{displayedPosts[currentIndex].commentsList?.length || 0}</span>
                    </div>

                    <div className="flex flex-col items-center gap-1">
                      <button onClick={(e) => handleSave(displayedPosts[currentIndex].id, e)} className="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white shadow-xl">
                        ⭐
                      </button>
                      <span className="text-[11px] font-extrabold">340</span>
                    </div>

                    <div className="flex flex-col items-center gap-1">
                      <button onClick={handleShare} className="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white shadow-xl">
                        ↗️
                      </button>
                      <span className="text-[11px] font-extrabold">Partager</span>
                    </div>
                  </div>
                )}

                {/* INFOS VIDÉO BAS GAUCHE */}
                {displayedPosts.length > 0 && (
                  <div className="absolute left-4 bottom-20 z-30 max-w-[70%] flex flex-col gap-2 pointer-events-none">
                    <span className="font-extrabold text-sm text-white drop-shadow-md pointer-events-auto cursor-pointer">
                      {displayedPosts[currentIndex].user}
                    </span>
                    <p className="text-xs text-white/90 drop-shadow line-clamp-2 leading-snug">
                      {displayedPosts[currentIndex].desc}
                    </p>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* BARRE DE NAVIGATION INFÉRIEURE */}
          <div className="relative z-40 h-16 bg-[#0b0719]/90 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-2">
            <button onClick={() => setActiveTab('feed')} className={`flex flex-col items-center gap-1 ${activeTab === 'feed' ? 'text-pink-500' : 'text-white/50'}`}>
              <span className="text-[10px] font-bold">🏠 Accueil</span>
            </button>
            <button onClick={() => setActiveTab('discover')} className={`flex flex-col items-center gap-1 ${activeTab === 'discover' ? 'text-pink-500' : 'text-white/50'}`}>
              <span className="text-[10px] font-bold">🔍 Découvrir</span>
            </button>
            <button onClick={() => setShowUploadModal(true)} className="relative -top-2 w-12 h-12 bg-gradient-to-tr from-pink-500 to-purple-600 rounded-full flex items-center justify-center shadow-xl text-white font-bold text-xl">
              +
            </button>
            <button onClick={() => setActiveTab('inbox')} className={`flex flex-col items-center gap-1 ${activeTab === 'inbox' ? 'text-pink-500' : 'text-white/50'}`}>
              <span className="text-[10px] font-bold">💬 Messages</span>
            </button>
            <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-1 ${activeTab === 'profile' ? 'text-pink-500' : 'text-white/50'}`}>
              <span className="text-[10px] font-bold">👤 Profil</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
