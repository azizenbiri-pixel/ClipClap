<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0a1a] text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const POSTS = [
      {
        id: 1,
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes",
        music: "Son original - Neon Vibes",
        likes: 12400,
        comments: 842,
        shares: 156,
        bgGradient: "from-purple-900 via-pink-900 to-black"
      },
      {
        id: 2,
        user: "@cyber_dancer",
        desc: "Session freestyle néon 💃✨",
        music: "Cyberpunk Beats 2077",
        likes: 45200,
        comments: 1200,
        shares: 430,
        bgGradient: "from-blue-900 via-indigo-950 to-black"
      },
      {
        id: 3,
        user: "@future_wave",
        desc: "Voyage rétro synthwave 🚀🎧",
        music: "Nightcall - Synthwave Remaster",
        likes: 8900,
        comments: 310,
        shares: 98,
        bgGradient: "from-fuchsia-900 via-purple-950 to-black"
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [activeTab, setActiveTab] = useState('feed');
      const [currentIndex, setCurrentIndex] = useState(0);
      
      // États interactifs
      const [likedPosts, setLikedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(
        POSTS.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {})
      );
      const [toastMessage, setToastMessage] = useState("");

      // Édition profil
      const [userName, setUserName] = useState("Aziz Enbiri");
      const [userTag, setUserTag] = useState("@azizenbiri");
      const [userBio, setUserBio] = useState("Créateur de contenu néon ⚡");
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      // Gestion du Swipe tactile
      const touchStartY = useRef(0);
      const touchEndY = useRef(0);

      useEffect(() => {
        const timer = setTimeout(() => setShowSplash(false), 1200);
        return () => clearTimeout(timer);
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2000);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        const isLiked = likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({
          ...prev,
          [postId]: isLiked ? prev[postId] - 1 : prev[postId] + 1
        }));
      };

      const handleShare = (e) => {
        e.stopPropagation();
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien copié dans le presse-papier ! 🔗");
        }
      };

      // Swipe haut / bas
      const handleTouchStart = (e) => { touchStartY.current = e.touches[0].clientY; };
      const handleTouchMove = (e) => { touchEndY.current = e.touches[0].clientY; };
      const handleTouchEnd = () => {
        const distance = touchStartY.current - touchEndY.current;
        if (distance > 50) {
          // Swipe vers le haut -> Vidéo suivante
          setCurrentIndex(prev => (prev + 1) % POSTS.length);
        } else if (distance < -50) {
          // Swipe vers le bas -> Vidéo précédente
          setCurrentIndex(prev => (prev - 1 + POSTS.length) % POSTS.length);
        }
      };

      if (showSplash) {
        return (
          <div class="h-screen w-full bg-[#0a0a1a] flex flex-col items-center justify-center">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 p-1 animate-pulse flex items-center justify-center shadow-[0_0_30px_rgba(255,0,128,0.5)]">
              <span class="text-4xl">🎬</span>
            </div>
            <h1 class="mt-4 text-3xl font-extrabold bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">
              ClipClap
            </h1>
          </div>
        );
      }

      const currentPost = POSTS[currentIndex];

      return (
        <div class="h-screen w-full max-w-md mx-auto bg-[#0a0a1a] flex flex-col relative overflow-hidden">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div class="absolute top-6 left-1/2 -translate-x-1/2 z-50 bg-pink-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg animate-bounce">
              {toastMessage}
            </div>
          )}

          <div class="flex-1 relative">
            {activeTab === 'feed' ? (
              <div 
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
                class={`h-full w-full bg-gradient-to-b ${currentPost.bgGradient} flex flex-col justify-end p-6 relative transition-all duration-500`}
              >
                {/* Visualiseur Néon */}
                <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
                  <div class="w-64 h-64 rounded-full bg-pink-500 blur-3xl animate-pulse"></div>
                </div>

                <div class="absolute top-4 left-0 right-0 text-center text-[10px] text-white/50 tracking-widest uppercase">
                  Glisse 👆 vers le haut pour la suite
                </div>

                {/* Barre d'actions */}
                <div class="absolute right-4 bottom-20 flex flex-col items-center gap-5 z-20">
                  {/* Bouton Like */}
                  <button onClick={(e) => handleLike(currentPost.id, e)} class="flex flex-col items-center group">
                    <div class={`w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border text-xl transition-all active:scale-125 ${likedPosts[currentPost.id] ? 'border-pink-500 text-pink-500 shadow-[0_0_15px_rgba(255,0,128,0.6)]' : 'border-white/20 text-white'}`}>
                      ♥
                    </div>
                    <span class="text-xs mt-1 font-bold">{likeCounts[currentPost.id]}</span>
                  </button>

                  {/* Bouton Commentaires */}
                  <button onClick={() => showToast("Commentaires bientôt disponibles ! 💬")} class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/20 text-cyan-400 text-xl">
                      💬
                    </div>
                    <span class="text-xs mt-1 font-bold">{currentPost.comments}</span>
                  </button>

                  {/* Bouton Partage */}
                  <button onClick={handleShare} class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/20 text-yellow-400 text-xl active:scale-110">
                      🔗
                    </div>
                    <span class="text-xs mt-1 font-bold">{currentPost.shares}</span>
                  </button>
                </div>

                {/* Infos Post */}
                <div class="relative z-10 space-y-2 pr-16 mb-6">
                  <h3 class="font-bold text-lg text-cyan-400">{currentPost.user}</h3>
                  <p class="text-sm text-gray-200">{currentPost.desc}</p>
                  <p class="text-xs text-pink-400 flex items-center gap-1">🎵 {currentPost.music}</p>
                </div>
              </div>
            ) : (
              /* Vue Profil */
              <div class="h-full w-full p-6 overflow-y-auto bg-[#0a0a1a] space-y-6">
                <div class="text-center space-y-3 mt-4">
                  <div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-tr from-pink-500 to-cyan-400">
                    <div class="w-full h-full bg-[#0a0a1a] rounded-full flex items-center justify-center text-3xl">
                      👾
                    </div>
                  </div>
                  
                  {isEditingProfile ? (
                    <div class="space-y-2 max-w-xs mx-auto">
                      <input 
                        type="text" 
                        value={userName} 
                        onChange={(e) => setUserName(e.target.value)}
                        class="bg-black/50 border border-pink-500/50 rounded-lg px-3 py-1 text-center w-full text-white font-bold"
                      />
                      <input 
                        type="text" 
                        value={userTag} 
                        onChange={(e) => setUserTag(e.target.value)}
                        class="bg-black/50 border border-cyan-500/50 rounded-lg px-3 py-1 text-center w-full text-cyan-400 text-xs"
                      />
                      <input 
                        type="text" 
                        value={userBio} 
                        onChange={(e) => setUserBio(e.target.value)}
                        class="bg-black/50 border border-purple-500/50 rounded-lg px-3 py-1 text-center w-full text-gray-300 text-xs"
                      />
                    </div>
                  ) : (
                    <div>
                      <h2 class="text-2xl font-bold text-white">{userName}</h2>
                      <p class="text-sm text-cyan-400">{userTag}</p>
                      <p class="text-xs text-gray-400 mt-1">{userBio}</p>
                    </div>
                  )}
                </div>

                <div class="flex justify-around py-4 border-y border-white/10 text-center">
                  <div><div class="font-bold text-pink-500">24</div><div class="text-xs text-gray-400">Vidéos</div></div>
                  <div><div class="font-bold text-cyan-400">12.8k</div><div class="text-xs text-gray-400">Abonnés</div></div>
                  <div><div class="font-bold text-purple-400">95.4k</div><div class="text-xs text-gray-400">J'aime</div></div>
                </div>

                <button 
                  onClick={() => setIsEditingProfile(!isEditingProfile)}
                  class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-semibold shadow-[0_0_15px_rgba(255,0,128,0.4)] active:scale-95 transition"
                >
                  {isEditingProfile ? "Enregistrer le profil" : "Éditer le profil"}
                </button>
              </div>
            )}
          </div>

          {/* Navigation bas */}
          <div class="h-16 bg-[#0a0a1a] border-t border-white/10 flex justify-around items-center z-50">
            <button onClick={() => setActiveTab('feed')} class={`flex flex-col items-center ${activeTab === 'feed' ? 'text-pink-500 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">🏠</span>
              <span class="text-[10px]">Accueil</span>
            </button>
            <button onClick={() => setActiveTab('profile')} class={`flex flex-col items-center ${activeTab === 'profile' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">👤</span>
              <span class="text-[10px]">Profil</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClipClapApp />);
  </script>
</body>
</html>
