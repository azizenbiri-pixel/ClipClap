<body class="text-white select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'like') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch(e) {}
    };

    const INITIAL_POSTS = [
      {
        id: 1,
        authorId: "@neon_vibes",
        user: "@neon_vibes",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop",
        desc: "Lumières de la ville 🌌 #neon #city #vibes #fyp",
        music: "Son original - Neon Vibes 🎵",
        likes: 12400,
        comments: 842,
        bookmarks: 320,
        shares: 156,
        viewsCount: 145200,
        views: "145.2K",
        followers: 45200,
        followingCount: 120,
        totalLikes: 210000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4",
        commentsList: [
          { id: 1, user: "@lucas_92", text: "Incroyable cette vidéo ! 🔥", time: "Il y a 2h" },
          { id: 2, user: "@sarah_gfx", text: "Le rendu des néons est top 🌌", time: "Il y a 5h" }
        ],
        userPosts: [
          { id: 101, views: "145.2K", video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4", desc: "Mon ancienne vidéo néon 🌌" }
        ]
      }
    ];
function TempsEcoule({ dateCreation }) {
  if (typeof dateCreation === 'string') {
    return <span className="text-xs text-gray-500">{dateCreation}</span>;
  }

  const [texte, setTexte] = React.useState("");

  React.useEffect(() => {
    const calculerTemps = () => {
      const secondes = Math.floor((Date.now() - dateCreation) / 1000);
      const minutes = Math.floor(secondes / 60);
      const heures = Math.floor(minutes / 60);
      const jours = Math.floor(heures / 24);

      if (minutes < 1) {
        setTexte("À l'instant");
      } else if (minutes < 60) {
        setTexte(`Il y a ${minutes} min`);
      } else if (heures < 24) {
        setTexte(`Il y a ${heures} h`);
      } else {
        setTexte(`Il y a ${jours} j`);
      }
    };

    calculerTemps();
    const interval = setInterval(calculerTemps, 60000);

    return () => clearInterval(interval);
  }, [dateCreation]);

  return <span className="text-xs text-gray-500">{texte}</span>;
}
function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [searchQuery, setSearchQuery] = useState("");
      const [replyingTo, setReplyingTo] = useState(null);

      // Notre nouvelle ligne pour mémoriser les vidéos de votre profil
      const [userPosts, setUserPosts] = useState([]);

      const [posts, setPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_posts');
          return saved ? JSON.parse(saved) : INITIAL_POSTS;
        } catch(e) {
          return INITIAL_POSTS;
        }
      });

  
    
    
  
    



  


      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedPosts, setLikedPosts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(() => 
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {})
      );
      const [savedCounts, setSavedCounts] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks }), {})
      );
      
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.authorId || post.user]: post.followers }), {})
      );

      const [toastMessage, setToastMessage] = useState("");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [newCaption, setNewCaption] = useState("");
      const [selectedFile, setSelectedFile] = useState(null);
      const [viewingCreator, setViewingCreator] = useState(null);
      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState("");

      const [userName, setUserName] = useState("Aziz Enbiri");
      const [userTag, setUserTag] = useState("@azizenbiri");
      const [userBio, setUserBio] = useState("Créateur de contenu néon ⚡");
      const [userAvatar, setUserAvatar] = useState("https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop");

        
          
        
          
        
      
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      const [userFollowersCount, setUserFollowersCount] = useState(1280);
      const [userFollowingCount, setUserFollowingCount] = useState(245);
      const [userLikesCount, setUserLikesCount] = useState(9420);

      const [chatConversations, setChatConversations] = useState([
        { id: 1, user: "@neon_vibes", lastMsg: "Salut super tes vidéos !", time: "Il y a 10m", unread: true, messages: [{ sender: "@neon_vibes", text: "Salut super tes vidéos !" }] }
      ]);
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState("");

      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const videoRef = useRef(null);
      useEffect(() => {
        try {
          localStorage.setItem('clipclap_posts', JSON.stringify(posts));
        } catch(e) {}
      }, [posts]);

      useEffect(() => {
  const savedAvatar = localStorage.getItem('clipclap_user_avatar');
  if (savedAvatar) {
    setUserAvatar(savedAvatar);
  }
}, []);

        
        
        
      

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 300);
              return 100;
            }
            return prev + 10;
          });
        }, 40);
        return () => clearInterval(interval);
      }, []);

      const displayedPosts = posts.filter(post => {
        if (feedTab === 'following') {
          const authorKey = post.authorId || post.user;
          return following[authorKey] === true;
        }
        return true;
      });

      useEffect(() => {
        if (currentIndex >= displayedPosts.length) {
          setCurrentIndex(0);
        }
      }, [feedTab, displayedPosts.length]);

      useEffect(() => {
        if (!showSplash && displayedPosts[currentIndex]) {
          const currentPostId = displayedPosts[currentIndex].id;
          setPosts(prevPosts => {
            return prevPosts.map((p) => {
              if (p.id === currentPostId) {
                return { ...p, viewsCount: (p.viewsCount || 1000) + 1 };
              }
              return p;
            });
          });
        }
      }, [currentIndex, showSplash, feedTab]);

      useEffect(() => {
        if (!showSplash && videoRef.current && displayedPosts[currentIndex]) {
          if (viewingCreator || activeTab !== 'feed' || showUploadModal || showCommentsModal || activeChat) {
            videoRef.current.pause();
            setIsPlaying(false);
          } else {
            videoRef.current.muted = isMuted;
            videoRef.current.currentTime = 0;
            setIsPlaying(true);
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {});
            }
          }
        }
      }, [currentIndex, isMuted, showSplash, viewingCreator, activeTab, showUploadModal, showCommentsModal, activeChat, feedTab]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2200);
      };

      const togglePlayPause = () => {
        if (!videoRef.current) return;
        playSound('click');
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        playSound('like');
        const isLiked = likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({ ...prev, [postId]: isLiked ? prev[postId] - 1 : prev[postId] + 1 }));
        setUserLikesCount(prev => isLiked ? prev - 1 : prev + 1);
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        playSound('click');
        const isSaved = savedPosts[postId];
        setSavedPosts(prev => ({ ...prev, [postId]: !isSaved }));
        setSavedCounts(prev => ({ ...prev, [postId]: isSaved ? prev[postId] - 1 : prev[postId] + 1 }));
        showToast(isSaved ? "Vidéo retirée des favoris" : "Vidéo enregistrée ! 📌");
      };

      const handleFollow = (authorKey, e) => {
        e.stopPropagation();
        playSound('click');
        setFollowing(prev => {
          const willFollow = !prev[authorKey];
          showToast(willFollow ? `Abonné à ${authorKey} ! ✨` : `Désabonné de ${authorKey}`);
          setUserFollowingCount(c => willFollow ? c + 1 : Math.max(0, c - 1));
          setCreatorFollowers(counts => {
            const current = counts[authorKey] || 1000;
            return { ...counts, [authorKey]: willFollow ? current + 1 : Math.max(0, current - 1) };
          });
          return { ...prev, [authorKey]: willFollow };
        });
      };

      const handleShare = (e) => {
        e.stopPropagation();
        playSound('click');
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien de la vidéo copié ! 🔗");
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        playSound('click');
        const currentPost = displayedPosts[currentIndex];
        const newComment = { id: Date.now(), user: userTag, text: newCommentText.trim(), time: "À l'instant" };
        const updatedPosts = posts.map(post => {
          if (post.id === currentPost.id) {
            return { ...post, comments: (post.comments || 0) + 1, commentsList: [newComment, ...(post.commentsList || [])] };
          }
          return post;
        });
        setPosts(updatedPosts);
        setNewCommentText("");
        showToast("Commentaire publié ! 💬");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;
        playSound('click');
        const updated = chatConversations.map(conv => {
          if (conv.id === activeChat.id) {
            return { ...conv, lastMsg: newMessageText, time: "À l'instant", messages: [...conv.messages, { sender: userTag, text: newMessageText }] };
          }
          return conv;
        });
        setChatConversations(updated);
        setActiveChat(updated.find(c => c.id === activeChat.id));
        setNewMessageText("");
      };

      const handlePublish = (e) => {
        e.preventDefault();
        playSound('click');
        const createAndSavePost = (videoSrc) => {
        const myNewPostItem = {
  id: Date.now(),
  authorId: userTag,
  user: userTag,
  avatar: userAvatar,
  desc: newCaption || "Nouvelle vidéo ClipClap ! 🎬 #clipclap",
  music: `Son original - ${userName} 🎵`,
  likes: 0, comments: 0, bookmarks: 0, shares: 0,
  viewsCount: 0, views: "0", followers: 1280, followingCount: 245, totalLikes: 9420,
  video: videoSrc, 
  commentsList: [],
  // LA CORRECTION : On prépare la structure de la vidéo pour qu'elle s'affiche sur votre profil
  userPosts: [
    { id: Date.now(), views: "0", viewsCount: 0, video: videoSrc, desc: newCaption }
  ]
};

          const updatedPosts = [myNewPostItem, ...posts];
          setPosts(updatedPosts);
          
          // IMPORTANT : On ajoute aussi la vidéo dans la liste de votre profil (si vous avez cette fonction)
          if (typeof setUserPosts === 'function') {
            setUserPosts(prev => [myNewPostItem, ...prev]);
          }

          setLikeCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setSavedCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setCreatorFollowers(counts => ({ ...counts, [userTag]: 1280 }));
          setShowUploadModal(false);
          setNewCaption("");
          setSelectedFile(null);
          setCurrentIndex(0);
          setFeedTab('foryou');
          showToast("Vidéo publiée et enregistrée ! 🚀");
        };

        if (selectedFile) {
          const reader = new FileReader();
          reader.readAsDataURL(selectedFile);
          reader.onloadend = () => { createAndSavePost(reader.result); };
        } else {
          createAndSavePost("https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4");
        }
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (displayedPosts.length === 0) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX > 40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(displayedPosts[currentIndex]);
          return;
        }

        if (Math.abs(diffY) > 40 && Math.abs(diffX) < 50) {
          if (diffY > 0) {
            setCurrentIndex(prev => (prev + 1) % displayedPosts.length);
          } else {
            setCurrentIndex(prev => (prev - 1 + displayedPosts.length) % displayedPosts.length);
          }
        }
      };

      const handleProfileTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleProfileTouchEnd = (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX < -40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(null);
        }
      };
      if (showSplash) {
        return (
          <div className="h-full w-full flex flex-col items-center justify-center bg-[#07040f] text-white select-none">
            <div className="relative mb-6">
              <div className="absolute -inset-4 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-3xl blur-xl opacity-70 animate-pulse"></div>
              <div className="relative w-24 h-24 bg-[#120c24] border border-white/10 rounded-3xl flex items-center justify-center shadow-2xl">
                <span className="text-4xl">🎬</span>
              </div>
            </div>
            <h1 className="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-2">
              ClipClap
            </h1>
            <p className="text-sm text-gray-400 mb-8 font-medium">L'application de courtes vidéos vibrantes</p>
            <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>
          </div>
        );
      }

      const currentPost = displayedPosts[currentIndex];

      return (
        <div className="h-full w-full flex flex-col bg-black overflow-hidden relative font-sans select-none">

            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-black/80 backdrop-blur-md border border-white/10 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2">
              <span>⚡</span> {toastMessage}
            </div>
          )}

          {/* CONTENU PRINCIPAL */}
          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 video-swipe-area"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
              >
                {displayedPosts.length > 0 && currentPost ? (
                  <div className="relative h-full w-full bg-black flex items-center justify-center">
                    <video
                      ref={videoRef}
                      src={currentPost.video}
                      className="absolute inset-0 h-full w-full object-cover"
                      loop
                      playsInline
                      autoPlay
                      muted={isMuted}
                      onClick={togglePlayPause}
                    />

                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

                    {/* EN-TÊTE */}

                        onClick={() => { playSound('click'); setFeedTab('following'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'following' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Abonnements
                      </button>
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('foryou'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'foryou' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Pour toi
                      </button>
                    </div>

                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">

                        </div>
                      </div>
                    )}

                    <button 
                      onClick={() => { playSound('click'); setIsMuted(!isMuted); }}
                      className="absolute top-14 right-4 z-30 w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white text-base shadow-lg"
                    >
                      {isMuted ? '🔇' : '🔊'}
                    </button>

                    <div className="absolute top-1/2 right-2 transform -translate-y-1/2 z-20 pointer-events-none opacity-40 flex flex-col items-center gap-1">
                      <span className="text-[10px] text-white font-semibold">Profil</span>
                      <span className="text-white text-xs animate-pulse">‹</span>
                    </div>

                    {/* ACTIONS DROITE */}
                    <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">

                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="w-11 h-11 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 cursor-pointer shadow-lg"

                            src={currentPost.authorId === userTag ? userAvatar : (currentPost.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop")} 
                            alt="avatar" 
                            className="w-full h-full object-cover" 
                          />
                        </div>
                        {currentPost.authorId !== userTag && !(following[currentPost.authorId || currentPost.user]) && (
                          <button 
                            onClick={(e) => handleFollow(currentPost.authorId || currentPost.user, e)}
                            className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md hover:scale-110 transition-transform"
                          >
                            +
                          </button>
                        )}
                      </div>

                      <button onClick={(e) => handleLike(currentPost.id, e)} className="flex flex-col items-center group">
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${likedPosts[currentPost.id] ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">❤️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{likeCounts[currentPost.id]}</span>
                      </button>

                      <button onClick={() => { playSound('click'); setShowCommentsModal(true); }} className="flex flex-col items-center group">
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">💬</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{currentPost.comments || 0}</span>
                      </button>

                      <button onClick={(e) => handleSave(currentPost.id, e)} className="flex flex-col items-center group">
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${savedPosts[currentPost.id] ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">📌</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{savedCounts[currentPost.id]}</span>

                    <label className="block text-xs font-semibold text-gray-300 mb-1">Bio</label>
                    <textarea 
                      value={userBio} 
                      onChange={(e) => setUserBio(e.target.value)}
                      rows="2"
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"
                    ></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1">Photo de profil (Galerie)</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={(e) => {
                    const file = e.target.files[0];
if (file) {
  const reader = new FileReader();
  reader.onloadend = () => {
    const img = new Image();
    img.src = reader.result;
    img.onload = () => {
      // On crée un canvas pour redimensionner l'image en petit format (avatar)
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 150; // Largeur parfaite pour un avatar de profil
      const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scaleSize;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // On récupère l'image compressée (très légère !)
      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

      // 1. On affiche l'image légère sur le profil
      setUserAvatar(compressedBase64);
      
      // 2. On la sauvegarde dans la mémoire sans aucun blocage
      localStorage.setItem('clipclap_user_avatar', compressedBase64);
    };
  };
  reader.readAsDataURL(file);
}
}}
                      className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer"
                    />
                  </div>
                  <button 
                    onClick={() => { 
                      playSound('click'); 
   // Met à jour l'avatar et propage le changement sur tous les posts créés par l'utilisateur
                      setPosts(prevPosts => prevPosts.map(p => {
                        if (p.authorId === userTag || p.user === userTag) {
                          return { ...p, avatar: userAvatar };
                        }
                        return p;
                      }));

                      // LA SÉCURITÉ ANTI-PERTE : On sauvegarde de manière permanente dans le navigateur
                      localStorage.setItem('clipclap_user_avatar', userAvatar);

                      setIsEditingProfile(false); 
                      showToast("Profil et avatar mis à jour ! ✨"); 
                    }}
                    className="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-white font-extrabold text-xs shadow-md"
                  >
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}                    
              

          {/* MODAL DISCUSSION MESSAGERIE */}
          {activeChat && (
            <div className="absolute inset-0 z-50 bg-[#07040f] flex flex-col">
              <div className="p-4 border-b border-white/10 flex items-center gap-3 bg-[#0d081b]">
                <button onClick={() => setActiveChat(null)} className="text-white text-base font-bold">‹</button>
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-xs">
                  {activeChat.user.charAt(1).toUpperCase()}
                </div>
                <h3 className="text-sm font-extrabold">{activeChat.user}</h3>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {activeChat.messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === userTag ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-xs ${m.sender === userTag ? 'bg-pink-500 text-white rounded-br-none' : 'bg-white/10 text-white rounded-bl-none'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <form onSubmit={handleSendMessage} className="p-3 border-t border-white/10 flex items-center gap-2 bg-[#0d081b]">
                <input 
                  type="text"
                  value={newMessageText}
                  onChange={(e) => setNewMessageText(e.target.value)}
                  placeholder="Écrire un message..."
                  className="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-500"
                />
                <button type="submit" className="px-4 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full text-xs font-bold text-white shadow-md">
                  Envoyer
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
