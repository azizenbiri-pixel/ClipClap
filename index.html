<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0;
      overflow: hidden; background-color: #0b0719; color: white;
      font-family: 'Plus Jakarta Sans', sans-serif; user-select: none;
    }
    #app { height: 100%; width: 100%; display: flex; flex-direction: column; position: relative; max-width: 420px; margin: 0 auto; }
    
    /* Splash Screen */
    #splash {
      position: absolute; inset: 0; z-index: 100;
      background: linear-gradient(to bottom, #181033, #0d071d, #07040f);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 4rem 1.5rem; text-align: center;
    }
    .progress-bar { width: 240px; height: 5px; background: rgba(88, 28, 135, 0.9); border-radius: 9999px; overflow: hidden; border: 1px solid rgba(147, 51, 234, 0.3); }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(to right, #ff3b96, #9d3bff); transition: width 0.05s linear; }

    /* Vues */
    .view { position: absolute; inset: 0; display: none; flex-direction: column; }
    .view.active { display: flex; }

    /* Feed Vidéo */
    #feed-container { flex: 1; position: relative; overflow: hidden; background: #111; padding-bottom: 64px; }
    #video-player { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .video-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.9)); pointer-events: none; }
    
    /* Boutons latéraux */
    .side-buttons { position: absolute; right: 1rem; bottom: 5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; z-index: 30; }
    .action-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.3); font-size: 1.1rem; cursor: pointer; color: white; }
    
    /* Barre de navigation */
    .navbar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: #0b0719; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 40; }
    .nav-item { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af; background: none; border: none; cursor: pointer; font-family: inherit; }
    .nav-item.active { color: #ff3b96; font-weight: bold; }
    .upload-btn-container { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; }
    .upload-btn { width: 48px; height: 36px; border-radius: 12px; background: linear-gradient(to right, #ff3b96, #06b6d4); color: white; font-weight: 800; font-size: 1.25rem; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); cursor: pointer; }

    /* Modale Upload & Toast */
    .modal { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); padding: 1.5rem; display: none; flex-direction: column; justify-content: space-between; }
    .modal.active { display: flex; }
    .toast { position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100; background: #ff3b96; color: white; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; box-shadow: 0 10px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="app">
    <div id="toast" class="toast"></div>

    <!-- Splash Screen -->
    <div id="splash">
      <div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
        <h1 style="font-size: 2.5rem; font-weight: 800; margin: 0; text-shadow: 0 0 12px rgba(255,255,255,0.7);">ClipClap</h1>
        <p style="font-size: 0.6rem; font-weight: bold; letter-spacing: 0.22em; color: #ff3b96; text-transform: uppercase; margin: 0;">Short Video Social Network</p>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- VUE ACCUEIL (FEED) -->
    <div id="view-feed" class="view active">
      <div id="feed-container">
        <!-- Utilisation d'une vidéo fiable pour éviter les écrans noirs -->
        <video id="video-player" src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop playsInline muted></video>
        <div class="video-overlay"></div>

        <div style="position: absolute; top: 1rem; left: 0; right: 0; text-align: center; font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 0.05em; text-transform: uppercase; pointer-events: none; z-index: 10;">
          Tap = Pause | Glisse vertical = Changer de vidéo
        </div>

        <!-- Boutons de droite -->
        <div class="side-buttons">
          <div style="position: relative; margin-bottom: 0.5rem;">
            <button id="btn-creator" class="action-btn" style="border-color: #ff3b96; background: #3b0764;">👤</button>
            <button id="btn-follow" style="position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: #ff3b96; color: white; border: none; font-size: 0.7rem; font-weight: bold; cursor: pointer;">+</button>
          </div>
          <button id="btn-like" class="action-btn">♥ <span id="like-count" style="font-size: 0.7rem; margin-left: 4px;">12.4K</span></button>
          <button id="btn-comment" class="action-btn">💬 <span id="comment-count" style="font-size: 0.7rem; margin-left: 4px;">842</span></button>
          <button id="btn-save" class="action-btn">📌 <span id="save-count" style="font-size: 0.7rem; margin-left: 4px;">320</span></button>
          <button id="btn-share" class="action-btn">🔗</button>
        </div>

        <!-- Infos de la vidéo -->
        <div style="position: absolute; bottom: 1rem; left: 1.5rem; right: 5rem; z-index: 30; pointer-events: none;">
          <h3 id="video-user" style="font-weight: bold; font-size: 1.1rem; color: #22d3ee; margin: 0 0 0.25rem 0; pointer-events: auto; cursor: pointer;">@neon_vibes</h3>
          <p id="video-desc" style="font-size: 0.85rem; color: #f3f4f6; margin: 0 0 0.25rem 0;">Lumières de la ville 🌌 #neon #city</p>
          <p id="video-music" style="font-size: 0.75rem; color: #ff3b96; margin: 0;">🎵 Son original - Neon Vibes</p>
        </div>
      </div>
    </div>

    <!-- VUE PROFIL -->
    <div id="view-profile" class="view" style="padding: 1.5rem; overflow-y: auto; background: #0b0719;">
      <div style="text-align: center; margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
        <div style="width: 96px; height: 96px; border-radius: 50%; padding: 4px; background: linear-gradient(to top right, #ff3b96, #22d3ee);">
          <div style="width: 100%; height: 100%; background: #0b0719; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem;">👾</div>
        </div>
        <div>
          <h2 id="profile-name" style="font-size: 1.5rem; font-weight: bold; margin: 0;">Aziz Enbiri</h2>
          <p id="profile-tag" style="font-size: 0.85rem; color: #22d3ee; margin: 0.25rem 0;">@azizenbiri</p>
          <p id="profile-bio" style="font-size: 0.75rem; color: #9ca3af; margin: 0;">Créateur de contenu néon ⚡</p>
        </div>
      </div>

      <div style="display: flex; justify-content: space-around; padding: 1rem 0; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); margin: 1.5rem 0; text-align: center;">
        <div><div style="font-weight: bold; color: #ff3b96;">2</div><div style="font-size: 0.75rem; color: #9ca3af;">Vidéos</div></div>
        <div><div style="font-weight: bold; color: #22d3ee;">12.8k</div><div style="font-size: 0.75rem; color: #9ca3af;">Abonnés</div></div>
        <div><div style="font-weight: bold; color: #a855f7;">95.4k</div><div style="font-size: 0.75rem; color: #9ca3af;">J'aime</div></div>
      </div>

      <button id="btn-edit-profile" style="width: 100%; padding: 0.75rem; border-radius: 0.75rem; background: linear-gradient(to right, #ff3b96, #9333ea); font-weight: 600; border: none; color: white; cursor: pointer;">Éditer le profil</button>
    </div>

    <!-- MODALE TÉLÉCHARGEMENT / UPLOAD (+) -->
    <div id="modal-upload" class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.25rem; font-weight: bold; margin: 0;">Créer un Clip 🎬</h2>
        <button id="close-upload" style="background: none; border: none; color: #9ca3af; font-size: 1.5rem; cursor: pointer;">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1rem; margin: auto 0; width: 100%;">
        <div style="border: 2px dashed rgba(255,59,150,0.5); border-radius: 1rem; padding: 2rem; text-align: center;">
          <input type="file" id="file-input" accept="video/*" style="display: none;" />
          <label for="file-input" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
            <span style="font-size: 2.5rem;">📹</span>
            <span id="file-label" style="font-size: 0.85rem; color: #22d3ee; font-weight: 600;">Sélectionner une vidéo</span>
          </label>
        </div>
        <textarea id="caption-input" placeholder="Écris une légende..." rows="3" style="width: 100%; background: rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 0.75rem; color: white; border: 1px solid rgba(255,255,255,0.1); outline: none; font-family: inherit;"></textarea>
        <button id="publish-btn" style="width: 100%; padding: 0.85rem; border-radius: 0.75rem; background: linear-gradient(to right, #ff3b96, #9333ea); font-weight: bold; border: none; color: white; cursor: pointer;">Publier la vidéo 🚀</button>
      </div>
      <div></div>
    </div>

    <!-- BARRE DE NAVIGATION (Accueil / Upload / Profil) -->
    <div class="navbar">
      <button id="nav-feed" class="nav-item active">
        <span style="font-size: 1.25rem;">🏠</span>
        <span style="font-size: 0.65rem; margin-top: 2px;">Accueil</span>
      </button>
      <div class="upload-btn-container">
        <button id="nav-upload" class="upload-btn">+</button>
      </div>
      <button id="nav-profile" class="nav-item">
        <span style="font-size: 1.25rem;">👤</span>
        <span style="font-size: 0.65rem; margin-top: 2px;">Profil</span>
      </button>
    </div>
  </div>

  <script>
    const posts = [
      {
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city",
        music: "Son original - Neon Vibes 🎵",
        likes: "12.4K", comments: "842", saves: "320",
        video: "https://www.w3schools.com/html/mov_bbb.mp4"
      },
      {
        user: "@cyber_dancer",
        desc: "Session freestyle sous les néons 💃✨ #dance",
        music: "Cyberpunk Beats 2077 🎶",
        likes: "45.2K", comments: "1.2K", saves: "1.4K",
        video: "https://www.w3schools.com/html/movie.mp4"
      }
    ];
    let currentIdx = 0;

    const videoEl = document.getElementById('video-player');
    const splashEl = document.getElementById('splash');
    const progressFill = document.getElementById('progress-fill');
    const toastEl = document.getElementById('toast');
    const modalUpload = document.getElementById('modal-upload');
    const feedContainer = document.getElementById('feed-container');

    // Animation du splash screen
    let prog = 0;
    const splashTimer = setInterval(() => {
      prog += 20;
      progressFill.style.width = prog + '%';
      if (prog >= 100) {
        clearInterval(splashTimer);
        splashEl.style.display = 'none';
        videoEl.play().catch(() => {});
      }
    }, 40);

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // Gestion des onglets de la barre de navigation du bas
    function switchTab(tab) {
      document.getElementById('view-feed').classList.remove('active');
      document.getElementById('view-profile').classList.remove('active');
      document.getElementById('nav-feed').classList.remove('active');
      document.getElementById('nav-profile').classList.remove('active');

      if (tab === 'feed') {
        document.getElementById('view-feed').classList.add('active');
        document.getElementById('nav-feed').classList.add('active');
        videoEl.play().catch(() => {});
      } else {
        document.getElementById('view-profile').classList.add('active');
        document.getElementById('nav-profile').classList.add('active');
        videoEl.pause(); // Coupe la vidéo quand on va sur le profil
      }
    }

    document.getElementById('nav-feed').addEventListener('click', (e) => { e.stopPropagation(); switchTab('feed'); });
    document.getElementById('nav-profile').addEventListener('click', (e) => { e.stopPropagation(); switchTab('profile'); });

    // Ouverture de la modale de téléchargement (+) -> Stoppe net le son et la vidéo
    document.getElementById('nav-upload').addEventListener('click', (e) => {
      e.stopPropagation();
      videoEl.pause();
      modalUpload.classList.add('active');
    });

    // Fermeture de la modale (+)
    document.getElementById('close-upload').addEventListener('click', (e) => {
      e.stopPropagation();
      modalUpload.classList.remove('active');
      if (document.getElementById('view-feed').classList.contains('active')) {
        videoEl.play().catch(() => {});
      }
    });

    // Gestion tactile du flux (Tap = Pause/Lecture, Swipe vertical = Changer de vidéo)
    let startY = 0;
    let startX = 0;

    feedContainer.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });

    feedContainer.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const diffX = startX - endX;
      const diffY = startY - endY;

      // Tap simple pour pause/lecture
      if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
        if (videoEl.paused) videoEl.play();
        else videoEl.pause();
        return;
      }

      // Swipe vertical pour changer de vidéo
      if (Math.abs(diffY) > 50 && Math.abs(diffX) < 60) {
        if (diffY > 0) {
          currentIdx = (currentIdx + 1) % posts.length;
        } else {
          currentIdx = (currentIdx - 1 + posts.length) % posts.length;
        }
        const p = posts[currentIdx];
        videoEl.src = p.video;
        document.getElementById('video-user').textContent = p.user;
        document.getElementById('video-desc').textContent = p.desc;
        document.getElementById('video-music').textContent = p.music;
        document.getElementById('like-count').textContent = p.likes;
        document.getElementById('comment-count').textContent = p.comments;
        document.getElementById('save-count').textContent = p.saves;
        videoEl.play().catch(() => {});
      }
    });

    // Protection des clics sur les boutons de droite pour éviter les faux déclenchements
    document.querySelectorAll('.side-buttons button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showToast("Action effectuée ! ✨");
      });
    });

    // Publication de la vidéo
    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files[0]) {
        document.getElementById('file-label').textContent = e.target.files[0].name;
      }
    });

    document.getElementById('publish-btn').addEventListener('click', () => {
      modalUpload.classList.remove('active');
      showToast("Vidéo publiée avec succès ! 🚀");
      videoEl.play().catch(() => {});
    });
  </script>
</body>
</html>
