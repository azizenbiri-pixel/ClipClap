<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipClap - Vidéos Courtes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000;
      color: #fff;
      overscroll-behavior-y: none;
    }
    .shadow-text {
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    /* Masquer la barre de défilement tout en gardant le scroll fonctionnel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full overflow-hidden flex items-center justify-center bg-black">
  <div id="root" class="w-full h-full sm:max-w-md sm:h-[844px] sm:rounded-[40px] sm:border-8 sm:border-gray-800 sm:shadow-2xl overflow-hidden relative"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    function ClipClapApp() {
      // ÉTATS DE NAVIGATION ET APPLICATION
      const [activeTab, setActiveTab] = useState('feed'); // 'feed', 'search', 'inbox', 'profile'
      const [feedTab, setFeedTab] = useState('foryou'); // 'foryou', 'following'
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);

      // ÉTATS UTILISATEUR PROFIL
      const [userName, setUserName] = useState('Alex Rivera');
      const [userTag, setUserTag] = useState('@alexrivera');
      const [userBio, setUserBio] = useState('✨ Créateur de contenus & Vibes futuristes 🚀\n📍 Paris');
      const [userAvatar, setUserAvatar] = useState('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&h=150&fit=crop');
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [userFollowersCount, setUserFollowersCount] = useState(1420);
      const [userLikesCount, setUserLikesCount] = useState('12.5K');

      // ÉTATS VIDÉOS ET FIL D'ACTUALITÉ
      const [posts, setPosts] = useState([
        {
          id: 1,
          user: '@neon_luna',
          authorId: '@neon_luna',
          avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop',
          video: 'https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-lights-41689-large.video.mp4',
          desc: 'Nuits cyberpunk à Tokyo ✨ Ambiance unique #neon #tokyo #cyberpunk',
          music: 'Original Sound - Luna Neon',
          likes: 3420,
          comments: 128,
          shares: 45,
          saves: 210,
          viewsCount: '12.4K',
          commentsList: [
            { id: 1, user: '@cyber_sam', text: 'Incroyable cette vidéo ! 🔥', time: 'Il y a 2h' },
            { id: 2, user: '@sarah_art', text: 'J\'adore les couleurs 😍', time: 'Il y a 1h' }
          ]
        },
        {
          id: 2,
          user: '@dj_max',
          authorId: '@dj_max',
          avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop',
          video: 'https://assets.mixkit.co/videos/preview/mixkit-dj-playing-music-at-a-party-41415-large.video.mp4',
          desc: 'Nouveau set en live ce soir ! Soyez prêts 🎧🔥 #dj #party #music',
          music: 'Bass Boosted Anthem - DJ Max',
          likes: 8900,
          comments: 432,
          shares: 120,
          saves: 950,
          viewsCount: '45.1K',
          commentsList: [
            { id: 1, user: '@alexrivera', text: 'Le drop est lourd 🔊', time: 'Il y a 30min' }
          ]
        },
        {
          id: 3,
          user: '@fitness_zoe',
          authorId: '@fitness_zoe',
          avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&h=100&fit=crop',
          video: 'https://assets.mixkit.co/videos/preview/mixkit-woman-doing-exercises-in-a-gym-42993-large.video.mp4',
          desc: 'Routine abdos express 10 min par jour 💪 Let’s go ! #fitness #workout',
          music: 'Workout Energy - Gym Beats',
          likes: 5600,
          comments: 95,
          shares: 310,
          saves: 1400,
          viewsCount: '28.9K',
          commentsList: []
        }
      ]);

      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const videoRef = useRef(null);

      // INTERACTIONS POSTS
      const [likedPosts, setLikedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [savedCounts, setSavedCounts] = useState({});
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState({});

      // MODALS & VUES SECONDAIRES
      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState('');
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const [newCaption, setNewCaption] = useState('');
      const [viewingCreator, setViewingCreator] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // RECHERCHE & MESSAGERIE
      const [searchQuery, setSearchQuery] = useState('');
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState('');
      const [chatConversations, setChatConversations] = useState([
        {
          id: 1,
          user: '@neon_luna',
          lastMsg: 'Super ta dernière vidéo !',
          time: '14:25',
          unread: true,
          messages: [
            { sender: '@neon_luna', text: 'Salut Alex !' },
            { sender: '@neon_luna', text: 'Super ta dernière vidéo !' }
          ]
        },
        {
          id: 2,
          user: '@dj_max',
          lastMsg: 'On se fait une collab ?',
          time: 'Hier',
          unread: false,
          messages: [
            { sender: '@dj_max', text: 'On se fait une collab ?' }
          ]
        }
      ]);

      // GESTION DES SWIPES TACTILES
      const [touchStartY, setTouchStartY] = useState(0);
      const [touchStartX, setTouchStartX] = useState(0);

      // SONS WEB AUDIO API
      const playSound = (type) => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          if (type === 'click') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
          } else if (type === 'like') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          }
        } catch (e) {
          // Audio non pris en charge ou bloqué par le navigateur
        }
      };

      // INITIALISATION DES COMPTEURS ET SPLASH SCREEN
      useEffect(() => {
        const initialLikes = {};
        const initialLikeCounts = {};
        const initialSaves = {};
        const initialSaveCounts = {};
        posts.forEach(p => {
          initialLikes[p.id] = false;
          initialLikeCounts[p.id] = p.likes;
          initialSaves[p.id] = false;
          initialSaveCounts[p.id] = p.saves;
        });
        setLikedPosts(initialLikes);
        setLikeCounts(initialLikeCounts);
        setSavedPosts(initialSaves);
        setSavedCounts(initialSaveCounts);

        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setShowSplash(false);
              return 100;
            }
            return prev + 15;
          });
        }, 150);
        return () => clearInterval(interval);
      }, []);

      // FONCTIONS LOGIQUES INTERACTIONS
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        playSound('like');
        const isLiked = !likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: isLiked }));
        setLikeCounts(prev => ({
          ...prev,
          [postId]: isLiked ? prev[postId] + 1 : prev[postId] - 1
        }));
        if (isLiked) showToast("Ajouté à vos favoris ❤️");
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        playSound('click');
        const isSaved = !savedPosts[postId];
        setSavedPosts(prev => ({ ...prev, [postId]: isSaved }));
        setSavedCounts(prev => ({
          ...prev,
          [postId]: isSaved ? prev[postId] + 1 : prev[postId] - 1
        }));
        if (isSaved) showToast("Vidéo épinglée 📌");
      };

      const handleFollow = (authorId, e) => {
        e.stopPropagation();
        playSound('click');
        const isFollowing = !!following[authorId];
        setFollowing(prev => ({ ...prev, [authorId]: !isFollowing }));
        setCreatorFollowers(prev => {
          const current = prev[authorId] || 1200;
          return { ...prev, [authorId]: isFollowing ? current - 1 : current + 1 };
        });
        showToast(!isFollowing ? "Abonné avec succès ✨" : "Désabonné");
      };

      const togglePlayPause = () => {
        if (videoRef.current) {
          if (isPlaying) {
            videoRef.current.pause();
            setIsPlaying(false);
          } else {
            videoRef.current.play();
            setIsPlaying(true);
          }
          setShowPlayIcon(true);
          setTimeout(() => setShowPlayIcon(false), 800);
        }
      };

      const handleShare = () => {
        playSound('click');
        if (navigator.share) {
          navigator.share({ title: 'ClipClap Vidéo', url: window.location.href }).catch(() => {});
        } else {
          showToast("Lien copié dans le presse-papier ! 🔗");
        }
      };

      // GESTION DU DÉFILEMENT VERTICAL DES VIDÉOS (SWIPE HAUT / BAS)
      const displayedPosts = feedTab === 'following' 
        ? posts.filter(p => following[p.authorId || p.user]) 
        : posts;

      const handleTouchStart = (e) => {
        setTouchStartY(e.touches[0].clientY);
        setTouchStartX(e.touches[0].clientX);
      };

      const handleTouchEnd = (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        const diff = touchStartY - touchEndY;

        if (Math.abs(diff) > 50) {
          if (diff > 0 && currentIndex < displayedPosts.length - 1) {
            playSound('click');
            setCurrentIndex(prev => prev + 1);
            setIsPlaying(true);
          } else if (diff < 0 && currentIndex > 0) {
            playSound('click');
            setCurrentIndex(prev => prev - 1);
            setIsPlaying(true);
          }
        }
      };

      const handleProfileTouchStart = (e) => {
        setTouchStartX(e.touches[0].clientX);
      };

      const handleProfileTouchEnd = (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        if (touchEndX - touchStartX > 80 && activeTab === 'profile') {
          playSound('click');
          setActiveTab('feed');
        }
      };

      const handlePublish = (e) => {
        e.preventDefault();
        if (!selectedFile && !newCaption) {
          showToast("Veuillez ajouter une vidéo ou une description !");
          return;
        }
        const newPostObj = {
          id: posts.length + 1,
          user: userTag,
          authorId: userTag,
          avatar: userAvatar,
          video: selectedFile ? URL.createObjectURL(selectedFile) : posts[0].video,
          desc: newCaption || "Ma nouvelle vidéo sur ClipClap 🚀 #clipclap",
          music: "Original Sound - " + userName,
          likes: 1,
          comments: 0,
          shares: 0,
          saves: 0,
          viewsCount: '1',
          commentsList: []
        };
        setPosts([newPostObj, ...posts]);
        setLikedPosts(prev => ({ ...prev, [newPostObj.id]: false }));
        setLikeCounts(prev => ({ ...prev, [newPostObj.id]: 1 }));
        setSavedPosts(prev => ({ ...prev, [newPostObj.id]: false }));
        setSavedCounts(prev => ({ ...prev, [newPostObj.id]: 0 }));
        setShowUploadModal(false);
        setSelectedFile(null);
        setNewCaption('');
        setActiveTab('feed');
        setCurrentIndex(0);
        showToast("Vidéo publiée avec succès ! 🎉");
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        playSound('click');
        const currentPostObj = displayedPosts[currentIndex];
        const updatedComments = [
          ...(currentPostObj.commentsList || []),
          { id: Date.now(), user: userTag, text: newCommentText, time: 'À l\'instant' }
        ];
        setPosts(posts.map(p => p.id === currentPostObj.id ? { ...p, commentsList: updatedComments, comments: p.comments + 1 } : p));
        setNewCommentText('');
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;
        playSound('click');
        const updatedMsgs = [...activeChat.messages, { sender: userTag, text: newMessageText }];
        const updatedChats = chatConversations.map(c => c.id === activeChat.id ? { ...c, messages: updatedMsgs, lastMsg: newMessageText, time: 'À l\'instant' } : c);
        setChatConversations(updatedChats);
        setActiveChat({ ...activeChat, messages: updatedMsgs });
        setNewMessageText('');
      };
      if (showSplash) {
        return (
          <div className="h-full w-full flex flex-col items-center justify-center bg-[#07040f] text-white select-none">
            <div className="relative mb-6">
              <div className="absolute -inset-4 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-3xl blur-xl opacity-70 animate-pulse"></div>
              <div className="relative w-24 h-24 bg-[#120c24] border border-white/10 rounded-3xl flex items-center justify-center shadow-2xl">
                <span className="text-4xl">🎬</span>
              </div>
            </div>
            <h1 className="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-2">
              ClipClap
            </h1>
            <p className="text-sm text-gray-400 mb-8 font-medium">L'application de courtes vidéos vibrantes</p>
            <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>
          </div>
        );
      }

      const currentPost = displayedPosts[currentIndex];

      return (
        <div className="h-full w-full flex flex-col bg-black overflow-hidden relative font-sans select-none">
          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-black/80 backdrop-blur-md border border-white/10 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2">
              <span>⚡</span> {toastMessage}
            </div>
          )}

          {/* CONTENU PRINCIPAL */}
          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 video-swipe-area"
                onTouchStart={handleTouchStart}
                onTouchEnd={(e) => {
                  handleTouchEnd(e);
                  // Détection du swipe droit pour ouvrir le profil du créateur
                  const touchX = e.changedTouches[0].clientX;
                  if (touchX - touchStartX > 80 && currentPost) {
                    playSound('click');
                    setViewingCreator(currentPost);
                  }
                }}
              >
                {displayedPosts.length > 0 && currentPost ? (
                  <div className="relative h-full w-full bg-black flex items-center justify-center">
                    <video
                      ref={videoRef}
                      src={currentPost.video}
                      className="absolute inset-0 h-full w-full object-cover"
                      loop
                      playsInline
                      autoPlay
                      muted={isMuted}
                      onClick={togglePlayPause}
                    />

                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

                    {/* EN-TÊTE HAUT */}
                    <div className="absolute top-0 left-0 right-0 z-30 pt-3 pb-2 flex items-center justify-center gap-6 px-4 bg-gradient-to-b from-black/90 via-black/50 to-transparent">
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('following'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'following' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Abonnements
                      </button>
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('foryou'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'foryou' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Pour toi
                      </button>
                    </div>

                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                        <div className="w-16 h-16 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center text-white text-2xl animate-ping">
                          {isPlaying ? '▶️' : '⏸️'}
                        </div>
                      </div>
                    )}

                    <button 
                      onClick={() => { playSound('click'); setIsMuted(!isMuted); }}
                      className="absolute top-14 right-4 z-30 w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white text-base shadow-lg"
                    >
                      {isMuted ? '🔇' : '🔊'}
                    </button>

                    <div className="absolute top-1/2 right-2 transform -translate-y-1/2 z-20 pointer-events-none opacity-40 flex flex-col items-center gap-1">
                      <span className="text-[10px] text-white font-semibold">Profil</span>
                      <span className="text-white text-xs animate-pulse">‹</span>
                    </div>

                    {/* ACTIONS DROITE */}
                    <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">
                      <div className="relative mb-1">
                        <div 
                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="w-11 h-11 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 cursor-pointer shadow-lg"
                        >
                          <img 
                            src={currentPost.authorId === userTag ? userAvatar : (currentPost.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop")} 
                            alt="avatar" 
                            className="w-full h-full object-cover" 
                          />
                        </div>
                        {currentPost.authorId !== userTag && !(following[currentPost.authorId || currentPost.user]) && (
                          <button 
                            onClick={(e) => handleFollow(currentPost.authorId || currentPost.user, e)}
                            className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md hover:scale-110 transition-transform"
                          >
                            +
                          </button>
                        )}
                      </div>

                      <button onClick={(e) => handleLike(currentPost.id, e)} className="flex flex-col items-center group">
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${likedPosts[currentPost.id] ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">❤️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{likeCounts[currentPost.id]}</span>
                      </button>

                      <button onClick={() => { playSound('click'); setShowCommentsModal(true); }} className="flex flex-col items-center group">
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">💬</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{currentPost.comments || 0}</span>
                      </button>

                      <button onClick={(e) => handleSave(currentPost.id, e)} className="flex flex-col items-center group">
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${savedPosts[currentPost.id] ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">📌</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{savedCounts[currentPost.id]}</span>
                      </button>

                      <button onClick={handleShare} className="flex flex-col items-center group">
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">↗️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">{currentPost.shares || 0}</span>
                      </button>
                    </div>

                    {/* INFOS POST (BAS GAUCHE) */}
                    <div className="absolute left-4 bottom-20 right-16 z-30 pointer-events-auto">
                      <div className="flex items-center gap-2 mb-2">
                        <span onClick={() => { playSound('click'); setViewingCreator(currentPost); }} className="font-extrabold text-base text-white cursor-pointer hover:underline">
                          {currentPost.user}
                        </span>
                        {following[currentPost.authorId || currentPost.user] && (
                          <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full text-white/90 font-medium">Abonné</span>
                        )}
                      </div>
                      <p className="text-sm text-gray-200 mb-2.5 font-normal leading-relaxed line-clamp-2">{currentPost.desc}</p>
                      <div className="flex items-center gap-2 text-xs text-gray-300 bg-black/30 backdrop-blur-md px-3 py-1.5 rounded-full w-fit border border-white/10">
                        <span>🎵</span>
                        <span className="truncate max-w-[200px]">{currentPost.music}</span>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400">
                    <span className="text-4xl mb-2">📭</span>
                    <p className="text-sm font-medium">Aucune vidéo dans cet onglet</p>
                    <button onClick={() => setFeedTab('foryou')} className="mt-4 px-4 py-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-full text-xs font-bold">
                      Voir "Pour toi"
                    </button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'search' && (
              <div className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-12 pb-24">
                <h2 className="text-xl font-extrabold mb-4">Découvrir</h2>
                <div className="relative mb-6">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Rechercher un utilisateur, un hashtag..."
                    className="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 transition-colors"
                  />
                  <span className="absolute left-3.5 top-3.5 text-sm">🔍</span>
                </div>

                <div className="mb-6">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Tendances du moment</h3>
                  <div className="flex flex-wrap gap-2">
                    {['#neon', '#cyberpunk', '#dance', '#vibes', '#music', '#art'].map((tag, idx) => (
                      <button key={idx} onClick={() => { playSound('click'); setSearchQuery(tag); }} className="bg-white/5 hover:bg-white/10 border border-white/10 px-3.5 py-2 rounded-xl text-xs font-semibold text-gray-200 transition-colors">
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Créateurs suggérés</h3>
                  <div className="space-y-3">
                    {posts.map((p, idx) => (
                      <div key={idx} className="flex items-center justify-between bg-white/5 border border-white/10 p-3 rounded-2xl">
                        <div className="flex items-center gap-3">
                          <img src={p.authorId === userTag ? userAvatar : p.avatar} alt="avatar" className="w-10 h-10 rounded-full object-cover border border-pink-500" />
                          <div>
                            <h4 className="text-sm font-bold">{p.user}</h4>
                            <p className="text-xs text-gray-400">{creatorFollowers[p.authorId || p.user] || 1000} abonnés</p>
                          </div>
                        </div>
                        <button onClick={(e) => handleFollow(p.authorId || p.user, e)} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${following[p.authorId || p.user] ? 'bg-white/20 text-white' : 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md'}`}>
                          {following[p.authorId || p.user] ? 'Abonné' : 'Suivre'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'inbox' && (
              <div className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-12 pb-24">
                <h2 className="text-xl font-extrabold mb-4">Messages</h2>
                <div className="space-y-3">
                  {chatConversations.map((conv) => (
                    <div key={conv.id} onClick={() => { playSound('click'); setActiveChat(conv); }} className="flex items-center justify-between bg-white/5 border border-white/10 p-3.5 rounded-2xl cursor-pointer hover:bg-white/10 transition-colors">
                      <div className="flex items-center gap-3">
                        <div className="relative">
                          <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-base">
                            {conv.user.charAt(1).toUpperCase()}
                          </div>
                          {conv.unread && <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-pink-500 rounded-full border-2 border-[#07040f]"></span>}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="text-sm font-bold">{conv.user}</h4>
                            <span className="text-[10px] text-gray-400">{conv.time}</span>
                          </div>
                          <p className="text-xs text-gray-300 truncate max-w-[200px] mt-0.5">{conv.lastMsg}</p>
                        </div>
                      </div>
                      <span className="text-gray-400 text-sm">›</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div 
                className="absolute inset-0 bg-[#07040f] overflow-y-auto p-4 pt-10 pb-24 video-swipe-area"
                onTouchStart={handleProfileTouchStart}
                onTouchEnd={handleProfileTouchEnd}
              >
                <div className="flex flex-col items-center mt-4">
                  <div className="relative mb-3">
                    <div className="w-24 h-24 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 shadow-xl">
                      <img src={userAvatar} alt="avatar" className="w-full h-full object-cover" />
                    </div>
                  </div>
                  <h2 className="text-xl font-extrabold text-white flex items-center gap-1.5">
                    {userName} <span className="text-pink-500 text-sm">✓</span>
                  </h2>
                  <p className="text-xs text-gray-400 font-medium mb-3">{userTag}</p>
                  <p className="text-xs text-gray-200 text-center max-w-xs mb-5 font-normal px-4">{userBio}</p>

                  <div className="flex items-center gap-6 mb-6 text-center">
                    <div>
                      <span className="block font-extrabold text-base">{Object.keys(following).filter(k => following[k]).length + 245}</span>
                      <span className="text-[11px] text-gray-400">Abonnements</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/15"></div>
                    <div>
                      <span className="block font-extrabold text-base">{userFollowersCount}</span>
                      <span className="text-[11px] text-gray-400">Abonnés</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/15"></div>
                    <div>
                      <span className="block font-extrabold text-base">{userLikesCount}</span>
                      <span className="text-[11px] text-gray-400">J'aime</span>
                    </div>
                  </div>

                  <div className="flex gap-2 w-full max-w-xs mb-6">
                    <button onClick={() => { playSound('click'); setIsEditingProfile(true); }} className="flex-1 bg-white/10 hover:bg-white/15 border border-white/10 py-2 rounded-xl text-xs font-bold text-white transition-colors">
                      Modifier le profil
                    </button>
                    <button onClick={() => { playSound('click'); showToast("Lien du profil partagé !"); }} className="w-10 bg-white/10 hover:bg-white/15 border border-white/10 py-2 rounded-xl text-xs font-bold text-white flex items-center justify-center transition-colors">
                      ↗
                    </button>
                  </div>
                </div>

                <div className="border-t border-white/10 pt-4">
                  <div className="flex justify-center gap-8 mb-4">
                    <span className="text-xs font-bold text-white border-b-2 border-pink-500 pb-1">Mes vidéos</span>
                    <span className="text-xs font-semibold text-gray-400">Favoris</span>
                  </div>

                  <div className="grid grid-cols-3 gap-1">
                    {posts.filter(p => p.authorId === userTag || p.user === userTag).map((p, idx) => (
                      <div key={idx} className="relative aspect-[9/16] bg-gray-900 overflow-hidden rounded-lg">
                        <video src={p.video} className="w-full h-full object-cover" muted />
                        <div className="absolute bottom-1 left-1.5 flex items-center gap-1 text-[10px] text-white font-bold bg-black/40 px-1.5 py-0.5 rounded backdrop-blur-sm">
                          <span>▶</span> {p.viewsCount || p.views || 1}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
          {/* BARRE DE NAVIGATION INFÉRIEURE */}
          <div className="absolute bottom-0 left-0 right-0 h-16 bg-[#090514]/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-2 z-40">
            <button onClick={() => { playSound('click'); setActiveTab('feed'); setViewingCreator(null); }} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'feed' ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}>
              <span className="text-xl">🏠</span>
              <span className="text-[10px]">Accueil</span>
            </button>

            <button onClick={() => { playSound('click'); setActiveTab('search'); setViewingCreator(null); }} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'search' ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}>
              <span className="text-xl">🔍</span>
              <span className="text-[10px]">Découvrir</span>
            </button>

            <button onClick={() => { playSound('click'); setShowUploadModal(true); }} className="relative -top-2 w-12 h-12 bg-gradient-to-tr from-pink-500 via-purple-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-pink-500/40 hover:scale-105 active:scale-95 transition-transform">
              +
            </button>

            <button onClick={() => { playSound('click'); setActiveTab('inbox'); setViewingCreator(null); }} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'inbox' ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}>
              <span className="text-xl">💬</span>
              <span className="text-[10px]">Boîte de rép.</span>
            </button>

            <button onClick={() => { playSound('click'); setActiveTab('profile'); setViewingCreator(null); }} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'profile' ? 'text-pink-500 font-bold' : 'text-gray-400 hover:text-white'}`}>
              <span className="text-xl">👤</span>
              <span className="text-[10px]">Profil</span>
            </button>
          </div>

          {/* MODAL UPLOAD VIDÉO */}
          {showUploadModal && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="w-full sm:max-w-md bg-[#120c24] border border-white/10 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-in fade-in zoom-in duration-200">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-extrabold text-white">Publier une vidéo</h3>
                  <button onClick={() => setShowUploadModal(false)} className="text-gray-400 hover:text-white text-xl font-bold">✕</button>
                </div>

                <form onSubmit={handlePublish} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1.5">Fichier Vidéo (MP4)</label>
                    <input 
                      type="file" 
                      accept="video/*"
                      onChange={(e) => setSelectedFile(e.target.files[0])}
                      className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1.5">Description & Hashtags</label>
                    <textarea 
                      value={newCaption}
                      onChange={(e) => setNewCaption(e.target.value)}
                      placeholder="Décris ta vidéo avec des hashtags (#fyp, #dance...)"
                      rows="3"
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 resize-none"
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-white font-extrabold text-sm shadow-lg shadow-pink-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all">
                    Publier sur ClipClap 🚀
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL COMMENTAIRES */}
          {showCommentsModal && currentPost && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end justify-center">
              <div className="w-full max-w-md h-[65%] bg-[#120c24] border-t border-white/10 rounded-t-3xl flex flex-col shadow-2xl">
                <div className="flex items-center justify-between p-4 border-b border-white/10">
                  <h3 className="text-sm font-extrabold">{currentPost.commentsList?.length || 0} commentaires</h3>
                  <button onClick={() => setShowCommentsModal(false)} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {currentPost.commentsList && currentPost.commentsList.length > 0 ? (
                    currentPost.commentsList.map((c) => (
                      <div key={c.id} className="flex items-start gap-3">
                        <div className="w-8 h-8 rounded-full bg-pink-500 flex items-center justify-center font-bold text-xs">
                          {c.user.charAt(1).toUpperCase()}
                        </div>
                        <div className="flex-1">
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-gray-300">{c.user}</span>
                            <span className="text-[10px] text-gray-500">{c.time}</span>
                          </div>
                          <p className="text-xs text-white mt-0.5">{c.text}</p>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-gray-400 text-center">
                      <span className="text-3xl mb-2">💬</span>
                      <p className="text-xs">Aucun commentaire pour le moment. Sois le premier !</p>
                    </div>
                  )}
                </div>

                <form onSubmit={handleAddComment} className="p-3 border-t border-white/10 flex items-center gap-2 bg-[#0d081b]">
                  <input 
                    type="text"
                    value={newCommentText}
                    onChange={(e) => setNewCommentText(e.target.value)}
                    placeholder="Ajouter un commentaire..."
                    className="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-500"
                  />
                  <button type="submit" className="px-4 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full text-xs font-bold text-white shadow-md">
                    Envoyer
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL PROFIL CRÉATEUR (SWIPE DROITE / GESTION DU RETOUR) */}
          {viewingCreator && (
            <div 
              className="absolute inset-0 z-50 bg-[#07040f] overflow-y-auto p-4 pt-10 video-swipe-area"
              onTouchStart={handleProfileTouchStart}
              onTouchEnd={(e) => {
                const touchX = e.changedTouches[0].clientX;
                // Swipe gauche sur la vue créateur pour fermer et revenir au feed
                if (touchStartX - touchX > 80) {
                  playSound('click');
                  setViewingCreator(null);
                }
              }}
            >
              <button onClick={() => setViewingCreator(null)} className="mb-4 w-9 h-9 bg-white/10 rounded-full flex items-center justify-center text-white text-base font-bold">
                ‹
              </button>
              <div className="flex flex-col items-center mt-2">
                <div className="w-20 h-20 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 mb-3 shadow-lg">
                  <img src={viewingCreator.authorId === userTag ? userAvatar : (viewingCreator.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop")} alt="avatar" className="w-full h-full object-cover" />
                </div>
                <h2 className="text-lg font-extrabold text-white">{viewingCreator.user}</h2>
                <p className="text-xs text-gray-400 mb-3">{viewingCreator.authorId || "@createur"}</p>
                <div className="flex items-center gap-6 mb-4 text-center">
                  <div>
                    <span className="block font-bold text-sm">140</span>
                    <span className="text-[10px] text-gray-400">Abonnements</span>
                  </div>
                  <div className="w-[1px] h-5 bg-white/15"></div>
                  <div>
                    <span className="block font-bold text-sm">{creatorFollowers[viewingCreator.authorId || viewingCreator.user] || 1200}</span>
                    <span className="text-[10px] text-gray-400">Abonnés</span>
                  </div>
                  <div className="w-[1px] h-5 bg-white/15"></div>
                  <div>
                    <span className="block font-bold text-sm">45.2K</span>
                    <span className="text-[10px] text-gray-400">J'aime</span>
                  </div>
                </div>
                <button onClick={(e) => handleFollow(viewingCreator.authorId || viewingCreator.user, e)} className={`w-36 py-2 rounded-full text-xs font-bold transition-all ${following[viewingCreator.authorId || viewingCreator.user] ? 'bg-white/20 text-white' : 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg'}`}>
                  {following[viewingCreator.authorId || viewingCreator.user] ? 'Abonné' : 'S\'abonner'}
                </button>
              </div>
            </div>
          )}

          {/* MODAL MODIFIER PROFIL */}
          {isEditingProfile && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#120c24] border border-white/10 rounded-3xl p-6 shadow-2xl">
                <h3 className="text-base font-extrabold mb-4 text-center">Modifier mon profil</h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1">Nom d'affichage</label>
                    <input 
                      type="text" 
                      value={userName} 
                      onChange={(e) => setUserName(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1">Bio</label>
                    <textarea 
                      value={userBio} 
                      onChange={(e) => setUserBio(e.target.value)}
                      rows="2"
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"
                    ></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1">Photo de profil (Galerie)</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onloadend = () => {
                            setUserAvatar(reader.result);
                          };
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer"
                    />
                  </div>
                  <button 
                    onClick={() => { 
                      playSound('click'); 
                      setPosts(prevPosts => prevPosts.map(p => {
                        if (p.authorId === userTag || p.user === userTag) {
                          return { ...p, avatar: userAvatar };
                        }
                        return p;
                      }));
                      setIsEditingProfile(false); 
                      showToast("Profil et avatar mis à jour ! ✨"); 
                    }}
                    className="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-white font-extrabold text-xs shadow-md"
                  >
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DISCUSSION MESSAGERIE */}
          {activeChat && (
            <div className="absolute inset-0 z-50 bg-[#07040f] flex flex-col">
              <div className="p-4 border-b border-white/10 flex items-center gap-3 bg-[#0d081b]">
                <button onClick={() => setActiveChat(null)} className="text-white text-base font-bold">‹</button>
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-xs">
                  {activeChat.user.charAt(1).toUpperCase()}
                </div>
                <h3 className="text-sm font-extrabold">{activeChat.user}</h3>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {activeChat.messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === userTag ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-xs ${m.sender === userTag ? 'bg-pink-500 text-white rounded-br-none' : 'bg-white/10 text-white rounded-bl-none'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <form onSubmit={handleSendMessage} className="p-3 border-t border-white/10 flex items-center gap-2 bg-[#0d081b]">
                <input 
                  type="text"
                  value={newMessageText}
                  onChange={(e) => setNewMessageText(e.target.value)}
                  placeholder="Écrire un message..."
                  className="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-500"
                />
                <button type="submit" className="px-4 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full text-xs font-bold text-white shadow-md">
                  Envoyer
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
