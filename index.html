<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0719;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .video-swipe-area {
      touch-action: none;
    }
  </style>
</head>
<body class="text-white select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'like') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch(e) {}
    };

    const INITIAL_POSTS = [
      {
        id: 1,
        authorId: "@neon_vibes",
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes #fyp",
        music: "Son original - Neon Vibes 🎵",
        likes: 12400,
        comments: 842,
        bookmarks: 320,
        shares: 156,
        viewsCount: 145200,
        views: "145.2K",
        followers: 45200,
        followingCount: 120,
        totalLikes: 210000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4",
        commentsList: [
          { id: 1, user: "@lucas_92", text: "Incroyable cette vidéo ! 🔥", time: "Il y a 2h" },
          { id: 2, user: "@sarah_gfx", text: "Le rendu des néons est top 🌌", time: "Il y a 5h" }
        ],
        userPosts: [
          { id: 101, views: "145.2K", video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4", desc: "Mon ancienne vidéo néon 🌌" },
          { id: 102, views: "89.1K", video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4", desc: "Nature and chill 🌿" }
        ]
      },
      {
        id: 2,
        authorId: "@cyber_dancer",
        user: "@cyber_dancer",
        desc: "Session freestyle sous les néons 💃✨ #dance #cyberpunk",
        music: "Cyberpunk Beats 2077 🎶",
        likes: 45200,
        comments: 1200,
        bookmarks: 1450,
        shares: 430,
        viewsCount: 520800,
        views: "520.8K",
        followers: 128000,
        followingCount: 410,
        totalLikes: 890000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
        commentsList: [
          { id: 1, user: "@dance_King", text: "Quelle énergie ! 💃", time: "Il y a 1j" }
        ],
        userPosts: [
          { id: 201, views: "520.8K", video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4", desc: "Session freestyle 💃✨" }
        ]
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [searchQuery, setSearchQuery] = useState("");

      const [posts, setPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_posts');
          return saved ? JSON.parse(saved) : INITIAL_POSTS;
        } catch(e) {
          return INITIAL_POSTS;
        }
      });

      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedPosts, setLikedPosts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(() => 
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {})
      );
      const [savedCounts, setSavedCounts] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks }), {})
      );
      
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.authorId || post.user]: post.followers }), {})
      );

      const [toastMessage, setToastMessage] = useState("");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [newCaption, setNewCaption] = useState("");
      const [selectedFile, setSelectedFile] = useState(null);
      const [viewingCreator, setViewingCreator] = useState(null);
      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState("");

      const [userName, setUserName] = useState("Aziz Enbiri");
      const [userTag, setUserTag] = useState("@azizenbiri");
      const [userBio, setUserBio] = useState("Créateur de contenu néon ⚡");
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      const [userFollowersCount, setUserFollowersCount] = useState(1280);
      const [userFollowingCount, setUserFollowingCount] = useState(245);
      const [userLikesCount, setUserLikesCount] = useState(9420);

      const [chatConversations, setChatConversations] = useState([
        { id: 1, user: "@neon_vibes", lastMsg: "Salut super tes vidéos !", time: "Il y a 10m", unread: true, messages: [{ sender: "@neon_vibes", text: "Salut super tes vidéos !" }] },
        { id: 2, user: "@cyber_dancer", lastMsg: "On collabore quand ?", time: "Il y a 1h", unread: false, messages: [{ sender: "@cyber_dancer", text: "On collabore quand ?" }] }
      ]);
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState("");

      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const videoRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('clipclap_posts', JSON.stringify(posts));
        } catch(e) {}
      }, [posts]);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 300);
              return 100;
            }
            return prev + 10;
          });
        }, 40);
        return () => clearInterval(interval);
      }, []);

      const displayedPosts = posts.filter(post => {
        if (feedTab === 'following') {
          const authorKey = post.authorId || post.user;
          return following[authorKey] === true;
        }
        return true;
      });

      useEffect(() => {
        if (currentIndex >= displayedPosts.length) {
          setCurrentIndex(0);
        }
      }, [feedTab, displayedPosts.length]);

      useEffect(() => {
        if (!showSplash && displayedPosts[currentIndex]) {
          const currentPostId = displayedPosts[currentIndex].id;
          setPosts(prevPosts => {
            return prevPosts.map((p) => {
              if (p.id === currentPostId) {
                return { ...p, viewsCount: (p.viewsCount || 1000) + 1 };
              }
              return p;
            });
          });
        }
      }, [currentIndex, showSplash, feedTab]);

      useEffect(() => {
        if (!showSplash && videoRef.current && displayedPosts[currentIndex]) {
          if (viewingCreator || activeTab !== 'feed' || showUploadModal || showCommentsModal || activeChat) {
            videoRef.current.pause();
            setIsPlaying(false);
          } else {
            videoRef.current.muted = isMuted;
            videoRef.current.currentTime = 0;
            setIsPlaying(true);
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {});
            }
          }
        }
      }, [currentIndex, isMuted, showSplash, viewingCreator, activeTab, showUploadModal, showCommentsModal, activeChat, feedTab]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2200);
      };

      const togglePlayPause = () => {
        if (!videoRef.current) return;
        playSound('click');
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        playSound('like');
        const isLiked = likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({ ...prev, [postId]: isLiked ? prev[postId] - 1 : prev[postId] + 1 }));
        setUserLikesCount(prev => isLiked ? prev - 1 : prev + 1);
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        playSound('click');
        const isSaved = savedPosts[postId];
        setSavedPosts(prev => ({ ...prev, [postId]: !isSaved }));
        setSavedCounts(prev => ({ ...prev, [postId]: isSaved ? prev[postId] - 1 : prev[postId] + 1 }));
        showToast(isSaved ? "Vidéo retirée des favoris" : "Vidéo enregistrée ! 📌");
      };

      const handleFollow = (authorKey, e) => {
        e.stopPropagation();
        playSound('click');
        setFollowing(prev => {
          const willFollow = !prev[authorKey];
          showToast(willFollow ? `Abonné à ${authorKey} ! ✨` : `Désabonné de ${authorKey}`);
          setUserFollowingCount(c => willFollow ? c + 1 : Math.max(0, c - 1));
          setCreatorFollowers(counts => {
            const current = counts[authorKey] || 1000;
            return { ...counts, [authorKey]: willFollow ? current + 1 : Math.max(0, current - 1) };
          });
          return { ...prev, [authorKey]: willFollow };
        });
      };

      const handleShare = (e) => {
        e.stopPropagation();
        playSound('click');
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien de la vidéo copié ! 🔗");
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        playSound('click');
        const currentPost = displayedPosts[currentIndex];
        const newComment = { id: Date.now(), user: userTag, text: newCommentText.trim(), time: "À l'instant" };
        const updatedPosts = posts.map(post => {
          if (post.id === currentPost.id) {
            return { ...post, comments: (post.comments || 0) + 1, commentsList: [newComment, ...(post.commentsList || [])] };
          }
          return post;
        });
        setPosts(updatedPosts);
        setNewCommentText("");
        showToast("Commentaire publié ! 💬");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;
        playSound('click');
        const updated = chatConversations.map(conv => {
          if (conv.id === activeChat.id) {
            return { ...conv, lastMsg: newMessageText, time: "À l'instant", messages: [...conv.messages, { sender: userTag, text: newMessageText }] };
          }
          return conv;
        });
        setChatConversations(updated);
        setActiveChat(updated.find(c => c.id === activeChat.id));
        setNewMessageText("");
      };

      const handlePublish = (e) => {
        e.preventDefault();
        playSound('click');
        const createAndSavePost = (videoSrc) => {
          const myNewPostItem = {
            id: Date.now(),
            authorId: userTag,
            user: userTag,
            desc: newCaption || "Nouvelle vidéo ClipClap ! 🎬 #clipclap",
            music: `Son original - ${userName} 🎵`,
            likes: 1, comments: 0, bookmarks: 0, shares: 0,
            viewsCount: 1, views: "1", followers: 1, followingCount: 0, totalLikes: 1,
            video: videoSrc, commentsList: [], userPosts: []
          };
          const updatedPosts = [myNewPostItem, ...posts];
          setPosts(updatedPosts);
          setLikeCounts(prev => ({ ...prev, [myNewPostItem.id]: 1 }));
          setSavedCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setCreatorFollowers(counts => ({ ...counts, [userTag]: 1280 }));
          setShowUploadModal(false);
          setNewCaption("");
          setSelectedFile(null);
          setCurrentIndex(0);
          setFeedTab('foryou');
          showToast("Vidéo publiée et enregistrée ! 🚀");
        };

        if (selectedFile) {
          const reader = new FileReader();
          reader.readAsDataURL(selectedFile);
          reader.onloadend = () => { createAndSavePost(reader.result); };
        } else {
          createAndSavePost("https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4");
        }
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (displayedPosts.length === 0) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX > 40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(displayedPosts[currentIndex]);
          return;
        }

        if (Math.abs(diffY) > 40 && Math.abs(diffX) < 50) {
          if (diffY > 0) {
            setCurrentIndex(prev => (prev + 1) % displayedPosts.length);
          } else {
            setCurrentIndex(prev => (prev - 1 + displayedPosts.length) % displayedPosts.length);
          }
        }
      };

      const handleProfileTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleProfileTouchEnd = (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX < -40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(null);
        }
      };
      if (showSplash) {
        return (
          <div className="h-full w-full flex flex-col items-center justify-center bg-[#07040f] text-white select-none">
            <div className="relative mb-6">
              <div className="absolute -inset-4 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-3xl blur-xl opacity-70 animate-pulse"></div>
              <div className="relative w-24 h-24 bg-[#120c24] border border-white/10 rounded-3xl flex items-center justify-center shadow-2xl">
                <span className="text-4xl">🎬</span>
              </div>
            </div>
            <h1 className="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-2">
              ClipClap
            </h1>
            <p className="text-sm text-gray-400 mb-8 font-medium">L'application de courtes vidéos vibrantes</p>
            <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>
          </div>
        );
      }

      const currentPost = displayedPosts[currentIndex];

      return (
        <div className="h-full w-full flex flex-col bg-black overflow-hidden relative font-sans select-none">
          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-black/80 backdrop-blur-md border border-white/10 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2">
              <span>⚡</span> {toastMessage}
            </div>
          )}

          {/* CONTENU PRINCIPAL */}
          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 video-swipe-area"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
              >
                {displayedPosts.length > 0 && currentPost ? (
                  <div className="relative h-full w-full bg-black flex items-center justify-center">
                    <video
                      ref={videoRef}
                      src={currentPost.video}
                      className="absolute inset-0 h-full w-full object-cover"
                      loop
                      playsInline
                      autoPlay
                      muted={isMuted}
                      onClick={togglePlayPause}
                    />

                    {/* Effet de fondu gradient */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

                    {/* EN-TÊTE : Abonnements / Pour toi TOUT EN HAUT */}
                    <div className="absolute top-0 left-0 right-0 z-30 pt-4 pb-2 flex items-center justify-center gap-6 px-4 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('following'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'following' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Abonnements
                      </button>
                      <button 
                        onClick={() => { playSound('click'); setFeedTab('foryou'); }}
                        className={`text-sm font-bold transition-all ${feedTab === 'foryou' ? 'text-white border-b-2 border-pink-500 pb-1' : 'text-white/60 hover:text-white'}`}
                      >
                        Pour toi
                      </button>
                    </div>

                    {/* Indicateur Play/Pause */}
                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                        <div className="w-16 h-16 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center text-white text-2xl animate-ping">
                          {isPlaying ? '▶️' : '⏸️'}
                        </div>
                      </div>
                    )}

                    {/* BOUTON MUTE EN HAUT À GROUPE / DROITE */}
                    <button 
                      onClick={() => { playSound('click'); setIsMuted(!isMuted); }}
                      className="absolute top-16 right-4 z-30 w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white text-base shadow-lg"
                    >
                      {isMuted ? '🔇' : '🔊'}
                    </button>

                    {/* BOUTON SWIPE VERS PROFIL CRÉATEUR */}
                    <div className="absolute top-1/2 right-2 transform -translate-y-1/2 z-20 pointer-events-none opacity-40 flex flex-col items-center gap-1">
                      <span className="text-[10px] text-white font-semibold">Profil</span>
                      <span className="text-white text-xs animate-pulse">‹</span>
                    </div>

                    {/* BOUTONS D'ACTION LATÉRAUX (DROITE) */}
                    <div className="absolute right-3 bottom-20 z-30 flex flex-col items-center gap-4">
                      {/* Avatar & Follow */}
                      <div className="relative mb-1">
                        <div 
                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="w-11 h-11 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 cursor-pointer shadow-lg"
                        >
                          <img src={`https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop`} alt="avatar" className="w-full h-full object-cover" />
                        </div>
                        {!(following[currentPost.authorId || currentPost.user]) && (
                          <button 
                            onClick={(e) => handleFollow(currentPost.authorId || currentPost.user, e)}
                            className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md hover:scale-110 transition-transform"
                          >
                            +
                          </button>
                        )}
                      </div>

                      {/* Like */}
                      <button 
                        onClick={(e) => handleLike(currentPost.id, e)}
                        className="flex flex-col items-center group"
                      >
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${likedPosts[currentPost.id] ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">❤️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {likeCounts[currentPost.id]}
                        </span>
                      </button>

                      {/* Commentaires */}
                      <button 
                        onClick={() => { playSound('click'); setShowCommentsModal(true); }}
                        className="flex flex-col items-center group"
                      >
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">💬</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {currentPost.comments || 0}
                        </span>
                      </button>

                      {/* Favoris */}
                      <button 
                        onClick={(e) => handleSave(currentPost.id, e)}
                        className="flex flex-col items-center group"
                      >
                        <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ${savedPosts[currentPost.id] ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/50 scale-110' : 'bg-black/40 backdrop-blur-md border border-white/10 text-white'}`}>
                          <span className="text-lg">📌</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {savedCounts[currentPost.id]}
                        </span>
                      </button>

                      {/* Partager */}
                      <button 
                        onClick={handleShare}
                        className="flex flex-col items-center group"
                      >
                        <div className="w-11 h-11 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white transition-all">
                          <span className="text-lg">↗️</span>
                        </div>
                        <span className="text-[11px] font-bold mt-1 text-white shadow-text">
                          {currentPost.shares || 0}
                        </span>
                      </button>
                    </div>

                    {/* INFOS DU POST (BAS GAUCHE) */}
                    <div className="absolute left-4 bottom-20 right-16 z-30 pointer-events-auto">
                      <div className="flex items-center gap-2 mb-2">
                        <span 
                          onClick={() => { playSound('click'); setViewingCreator(currentPost); }}
                          className="font-extrabold text-base text-white cursor-pointer hover:underline"
                        >
                          {currentPost.user}
                        </span>
                        {following[currentPost.authorId || currentPost.user] && (
                          <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full text-white/90 font-medium">Abonné</span>
                        )}
                      </div>
                      <p className="text-sm text-gray-200 mb-2.5 font-normal leading-relaxed line-clamp-2">
                        {currentPost.desc}
                      </p>
                      <div className="flex items-center gap-2 text-xs text-gray-300 bg-black/30 backdrop-blur-md px-3 py-1.5 rounded-full w-fit border border-white/10">
                        <span>🎵</span>
                        <span className="truncate max-w-[200px]">{currentPost.music}</span>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center p-6 text-center text-gray-400">
                    <span className="text-4xl mb-2">📭</span>
                    <p className="text-sm font-medium">Aucune vidéo dans cet onglet</p>
                    <button 
                      onClick={() => setFeedTab('foryou')}
                      className="mt-4 px-4 py-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-full text-xs font-bold"
                    >
                      Voir "Pour toi"
                    </button>
                  </div>
                )}
              </div>
            )}
            {/* ONGLET RECHERCHE / DÉCOUVRIR */}
            {activeTab === 'search' && (
              <div className="absolute inset-0 bg-[#0b0719] flex flex-col pt-4 px-4 pb-20 overflow-y-auto">
                <h2 className="text-xl font-bold mb-4">Explorer</h2>
                <div className="relative mb-6">
                  <input 
                    type="text" 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Rechercher des vidéos, des tags, des créateurs..."
                    className="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 pl-10 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500"
                  />
                  <span className="absolute left-3 top-3.5 text-sm text-gray-400">🔍</span>
                </div>

                <div className="mb-6">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Tendances du moment</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {['#neon', '#cyberpunk', '#dance', '#vibes', '#art', '#music'].map((tag, idx) => (
                      <div 
                        key={idx}
                        onClick={() => { playSound('click'); setSearchQuery(tag); setActiveTab('feed'); }}
                        className="bg-white/5 border border-white/10 p-3 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-white/10 transition-colors"
                      >
                        <span className="text-sm font-semibold">{tag}</span>
                        <span className="text-xs text-pink-400">🔥 120k</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Vidéos populaires</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {posts.map((post) => (
                      <div 
                        key={post.id}
                        onClick={() => {
                          playSound('click');
                          const targetIdx = displayedPosts.findIndex(p => p.id === post.id);
                          if (targetIdx !== -1) setCurrentIndex(targetIdx);
                          setActiveTab('feed');
                        }}
                        className="relative h-48 rounded-2xl overflow-hidden bg-purple-900 border border-white/10 cursor-pointer group"
                      >
                        <video src={post.video} className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                        <div className="absolute bottom-2 left-2 right-2 flex items-center justify-between text-xs font-bold text-white">
                          <span>❤️ {post.likes}</span>
                          <span>👁️ {post.views}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ONGLET MESSAGES / INBOX */}
            {activeTab === 'inbox' && (
              <div className="absolute inset-0 bg-[#0b0719] flex flex-col pt-4 px-4 pb-20 overflow-y-auto">
                <h2 className="text-xl font-bold mb-4">Messages</h2>
                <div className="space-y-3">
                  {chatConversations.map((conv) => (
                    <div 
                      key={conv.id}
                      onClick={() => { playSound('click'); setActiveChat(conv); }}
                      className="bg-white/5 border border-white/10 p-3.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-white/10 transition-colors"
                    >
                      <div className="relative">
                        <div className="w-12 h-12 rounded-full border border-pink-500 overflow-hidden bg-purple-900">
                          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="avatar" className="w-full h-full object-cover" />
                        </div>
                        {conv.unread && <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-pink-500 rounded-full border-2 border-[#0b0719]"></span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between mb-1">
                          <h4 className="text-sm font-bold truncate">{conv.user}</h4>
                          <span className="text-[10px] text-gray-400">{conv.time}</span>
                        </div>
                        <p className="text-xs text-gray-300 truncate">{conv.lastMsg}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ONGLET PROFIL */}
            {activeTab === 'profile' && (
              <div className="absolute inset-0 bg-[#0b0719] flex flex-col pt-4 px-4 pb-20 overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-xl font-bold">Profil</h2>
                  <button 
                    onClick={() => { playSound('click'); setIsEditingProfile(!isEditingProfile); }}
                    className="text-xs bg-white/10 border border-white/10 px-3 py-1.5 rounded-full font-semibold hover:bg-white/20"
                  >
                    {isEditingProfile ? 'Enregistrer' : 'Modifier le profil'}
                  </button>
                </div>

                <div className="flex flex-col items-center mb-6">
                  <div className="w-20 h-20 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 mb-3 shadow-xl">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop" alt="avatar" className="w-full h-full object-cover" />
                  </div>
                  {isEditingProfile ? (
                    <div className="w-full space-y-2 mb-2">
                      <input 
                        type="text" 
                        value={userName} 
                        onChange={(e) => setUserName(e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-center text-sm font-bold text-white"
                      />
                      <input 
                        type="text" 
                        value={userBio} 
                        onChange={(e) => setUserBio(e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-center text-xs text-gray-300"
                      />
                    </div>
                  ) : (
                    <>
                      <h3 className="text-lg font-bold mb-0.5">{userName}</h3>
                      <p className="text-xs text-gray-400 mb-2">{userTag}</p>
                      <p className="text-xs text-center text-gray-300 mb-4 px-4">{userBio}</p>
                    </>
                  )}

                  <div className="flex items-center gap-6 text-center">
                    <div>
                      <span className="block text-base font-bold">{userFollowingCount}</span>
                      <span className="text-[11px] text-gray-400">Abonnements</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/10"></div>
                    <div>
                      <span className="block text-base font-bold">{userFollowersCount}</span>
                      <span className="text-[11px] text-gray-400">Abonnés</span>
                    </div>
                    <div className="w-[1px] h-6 bg-white/10"></div>
                    <div>
                      <span className="block text-base font-bold">{userLikesCount}</span>
                      <span className="text-[11px] text-gray-400">J'aime</span>
                    </div>
                  </div>
                </div>

                <div className="border-t border-white/10 pt-4">
                  <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Mes publications</h4>
                  <div className="grid grid-cols-2 gap-3">
                    {posts.filter(p => p.user === userTag).length > 0 ? (
                      posts.filter(p => p.user === userTag).map(p => (
                        <div key={p.id} className="relative h-44 rounded-2xl overflow-hidden bg-purple-900 border border-white/10">
                          <video src={p.video} className="absolute inset-0 w-full h-full object-cover" />
                          <div className="absolute bottom-2 left-2 right-2 text-xs font-bold text-white">❤️ {likeCounts[p.id] || p.likes}</div>
                        </div>
                      ))
                    ) : (
                      <div className="col-span-2 text-center py-8 text-gray-400 text-xs font-medium">
                        Tu n'as pas encore publié de vidéo. Appuie sur le bouton + pour commencer ! 🚀
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* BARRE DE NAVIGATION INFÉRIEURE */}
          <div className="absolute bottom-0 left-0 right-0 h-16 bg-[#0b0719]/90 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-2 z-40">
            <button 
              onClick={() => { playSound('click'); setActiveTab('feed'); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'feed' ? 'text-pink-500 scale-105' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">🏠</span>
              <span className="text-[10px] font-bold">Accueil</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setActiveTab('search'); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'search' ? 'text-pink-500 scale-105' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">🔍</span>
              <span className="text-[10px] font-bold">Découvrir</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setShowUploadModal(true); }}
              className="w-12 h-10 bg-gradient-to-r from-pink-500 to-cyan-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-pink-500/30 hover:scale-105 transition-transform"
            >
              <span className="text-xl font-bold">+</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setActiveTab('inbox'); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'inbox' ? 'text-pink-500 scale-105' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">💬</span>
              <span className="text-[10px] font-bold">Boîte de réception</span>
            </button>

            <button 
              onClick={() => { playSound('click'); setActiveTab('profile'); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'profile' ? 'text-pink-500 scale-105' : 'text-gray-400 hover:text-white'}`}
            >
              <span className="text-lg">👤</span>
              <span className="text-[10px] font-bold">Profil</span>
            </button>
          </div>

          {/* MODAL : PROFIL CRÉATEUR (SWIPE GAUCHE) */}
          {viewingCreator && (
            <div 
              className="absolute inset-0 bg-[#0b0719] z-50 flex flex-col pt-4 px-4 pb-6 overflow-y-auto animate-in slide-in-from-right duration-200"
              onTouchStart={handleProfileTouchStart}
              onTouchEnd={handleProfileTouchEnd}
            >
              <div className="flex items-center justify-between mb-4">
                <button 
                  onClick={() => { playSound('click'); setViewingCreator(null); }}
                  className="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center text-white font-bold"
                >
                  ‹
                </button>
                <span className="text-xs font-semibold text-gray-400">Glisser vers la droite pour fermer</span>
                <div className="w-9"></div>
              </div>

              <div className="flex flex-col items-center mb-6">
                <div className="w-20 h-20 rounded-full border-2 border-pink-500 overflow-hidden bg-purple-900 mb-3 shadow-xl">
                  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop" alt="avatar" className="w-full h-full object-cover" />
                </div>
                <h3 className="text-lg font-bold mb-0.5">{viewingCreator.user}</h3>
                <p className="text-xs text-gray-400 mb-4">{viewingCreator.authorId || viewingCreator.user}</p>

                <div className="flex items-center gap-6 text-center mb-4">
                  <div>
                    <span className="block text-base font-bold">{viewingCreator.followingCount || 120}</span>
                    <span className="text-[11px] text-gray-400">Abonnements</span>
                  </div>
                  <div className="w-[1px] h-6 bg-white/10"></div>
                  <div>
                    <span className="block text-base font-bold">{creatorFollowers[viewingCreator.authorId || viewingCreator.user] || viewingCreator.followers}</span>
                    <span className="text-[11px] text-gray-400">Abonnés</span>
                  </div>
                  <div className="w-[1px] h-6 bg-white/10"></div>
                  <div>
                    <span className="block text-base font-bold">{viewingCreator.totalLikes || 210000}</span>
                    <span className="text-[11px] text-gray-400">J'aime</span>
                  </div>
                </div>

                <button 
                  onClick={(e) => handleFollow(viewingCreator.authorId || viewingCreator.user, e)}
                  className={`w-40 py-2.5 rounded-full font-bold text-xs shadow-lg transition-transform hover:scale-105 ${following[viewingCreator.authorId || viewingCreator.user] ? 'bg-white/10 text-white border border-white/20' : 'bg-gradient-to-r from-pink-500 to-purple-600 text-white'}`}
                >
                  {following[viewingCreator.authorId || viewingCreator.user] ? 'Abonné(e)' : "S'abonner"}
                </button>
              </div>

              <div className="border-t border-white/10 pt-4 flex-1">
                <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Vidéos du créateur</h4>
                <div className="grid grid-cols-2 gap-3">
                  {(viewingCreator.userPosts && viewingCreator.userPosts.length > 0) ? viewingCreator.userPosts.map(p => (
                    <div key={p.id} className="relative h-44 rounded-2xl overflow-hidden bg-purple-900 border border-white/10">
                      <video src={p.video} className="absolute inset-0 w-full h-full object-cover" />
                      <div className="absolute bottom-2 left-2 text-xs font-bold text-white">👁️ {p.views}</div>
                    </div>
                  )) : (
                    <div className="relative h-44 rounded-2xl overflow-hidden bg-purple-900 border border-white/10">
                      <video src={viewingCreator.video} className="absolute inset-0 w-full h-full object-cover" />
                      <div className="absolute bottom-2 left-2 text-xs font-bold text-white">👁️ {viewingCreator.views}</div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL : COMMENTAIRES */}
          {showCommentsModal && currentPost && (
            <div className="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col justify-end animate-in fade-in duration-200">
              <div className="bg-[#0b0719] border-t border-white/10 rounded-t-3xl h-[60vh] flex flex-col p-4 animate-in slide-in-from-bottom duration-300">
                <div className="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                  <h3 className="text-sm font-bold">{currentPost.comments || 0} commentaires</h3>
                  <button onClick={() => setShowCommentsModal(false)} className="text-gray-400 hover:text-white font-bold text-base">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-4 mb-3 pr-1">
                  {currentPost.commentsList && currentPost.commentsList.length > 0 ? (
                    currentPost.commentsList.map(comment => (
                      <div key={comment.id} className="flex items-start gap-3">
                        <div className="w-8 h-8 rounded-full bg-purple-900 border border-pink-500 overflow-hidden flex-shrink-0">
                          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50&h=50&fit=crop" alt="avatar" className="w-full h-full object-cover" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-gray-300">{comment.user}</span>
                            <span className="text-[10px] text-gray-500">{comment.time}</span>
                          </div>
                          <p className="text-xs text-white mt-0.5 break-words">{comment.text}</p>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="text-center py-10 text-gray-400 text-xs">Aucun commentaire pour le moment. Sois le premier ! 💬</div>
                  )}
                </div>

                <form onSubmit={handleAddComment} className="flex items-center gap-2 pt-2 border-t border-white/10">
                  <input 
                    type="text" 
                    value={newCommentText} 
                    onChange={(e) => setNewCommentText(e.target.value)}
                    placeholder="Ajouter un commentaire..."
                    className="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-pink-500"
                  />
                  <button type="submit" className="bg-pink-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-md">Publier</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL : UPLOAD DE VIDÉO */}
          {showUploadModal && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-in fade-in duration-200">
              <div className="bg-[#120c24] border border-white/10 rounded-3xl w-full max-w-sm p-5 flex flex-col shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">Publier une vidéo 🎬</h3>
                  <button onClick={() => setShowUploadModal(false)} className="text-gray-400 hover:text-white font-bold text-base">✕</button>
                </div>

                <form onSubmit={handlePublish} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1.5">Fichier vidéo (MP4)</label>
                    <input 
                      type="file" 
                      accept="video/*" 
                      onChange={(e) => setSelectedFile(e.target.files[0])}
                      className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer"
                    />
                    <p className="text-[10px] text-gray-500 mt-1">Si aucun fichier n'est choisi, une vidéo par défaut sera utilisée.</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1.5">Légende & Hashtags</label>
                    <textarea 
                      value={newCaption} 
                      onChange={(e) => setNewCaption(e.target.value)}
                      placeholder="Décris ta vidéo... #fyp #viral"
                      rows="3"
                      className="w-full bg-white/5 border border-white/10 rounded-2xl p-3 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 resize-none"
                    />
                  </div>

                  <button 
                    type="submit" 
                    className="w-full py-3 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 text-white rounded-2xl text-xs font-bold shadow-lg shadow-pink-500/30 hover:opacity-95 transition-opacity"
                  >
                    Publier maintenant 🚀
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL : CHAT INDIVIDUEL */}
          {activeChat && (
            <div className="absolute inset-0 z-50 bg-[#0b0719] flex flex-col animate-in slide-in-from-right duration-200">
              <div className="flex items-center justify-between p-4 border-b border-white/10 bg-[#120c24]">
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveChat(null)} className="text-white font-bold text-base">‹</button>
                  <div className="w-9 h-9 rounded-full border border-pink-500 overflow-hidden bg-purple-900">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50&h=50&fit=crop" alt="avatar" className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <h4 className="text-sm font-bold">{activeChat.user}</h4>
                    <span className="text-[10px] text-green-400">En ligne</span>
                  </div>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {activeChat.messages.map((m, idx) => {
                  const isMe = m.sender === userTag;
                  return (
                    <div key={idx} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-pink-500 text-white rounded-br-none' : 'bg-white/10 text-white rounded-bl-none'}`}>
                        {m.text}
                      </div>
                    </div>
                  );
                })}
              </div>

              <form onSubmit={handleSendMessage} className="p-3 border-t border-white/10 bg-[#120c24] flex items-center gap-2">
                <input 
                  type="text" 
                  value={newMessageText} 
                  onChange={(e) => setNewMessageText(e.target.value)}
                  placeholder="Écris un message..."
                  className="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-pink-500"
                />
                <button type="submit" className="bg-pink-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-md">Envoyer</button>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
