<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipclap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Conteneur Format Smartphone */
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 750px;
      position: relative;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    /* ÉCRAN DE DÉMARRAGE (SPLASH SCREEN) */
    .splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 1.5s infinite alternate;
    }

    .tagline {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    /* Cache l'écran de démarrage */
    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* LECTEUR VIDÉO */
    .video-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Actions à droite */
    .sidebar {
      position: absolute;
      right: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .action-btn span { font-size: 12px; }
    .action-btn.liked { color: #e74c3c; }

    /* Infos vidéo */
    .video-info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 80px;
    }

    .username { font-weight: bold; margin-bottom: 5px; }
    .caption { font-size: 14px; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. Écran de démarrage -->
    <div class="splash-screen" id="splashScreen">
      <div class="logo">Clipclap</div>
      <div class="tagline">Regarde. Partage. Recommence.</div>
    </div>

    <!-- 2. Contenu principal (Vidéo) -->
    <video class="video-player" id="mainVideo" loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-vertical-video-of-a-city-at-night-41526-large.mp4"></video>

    <div class="sidebar">
      <button class="action-btn" id="likeBtn" onclick="toggleLike()">
        ❤️ <span id="likeCount">12.5k</span>
      </button>
      <button class="action-btn" onclick="shareVideo()">
        🔗 <span>Partager</span>
      </button>
    </div>

    <div class="video-info">
      <div class="username">@clipclap_user</div>
      <div class="caption">Bienvenue sur Clipclap ! 🚀 Mon premier clip.</div>
    </div>

  </div>

  <script>
    // Timer pour masquer le Splash Screen après 2.5 secondes
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        const video = document.getElementById('mainVideo');
        
        splash.classList.add('hidden');
        video.play(); // Lance la vidéo automatiquement
      }, 2500);
    });

    let isLiked = false;
    let count = 12500;

    function toggleLike() {
      const likeBtn = document.getElementById('likeBtn');
      const likeCount = document.getElementById('likeCount');
      
      isLiked = !isLiked;
      if (isLiked) {
        likeBtn.classList.add('liked');
        count++;
      } else {
        likeBtn.classList.remove('liked');
        count--;
      }
      likeCount.innerText = count;
    }

    function shareVideo() {
      alert("Lien de la vidéo copié !");
    }
  </script>
</body>
</html>
