<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0719;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .video-swipe-area {
      touch-action: none;
    }
  </style>
</head>
<body class="text-white select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ============================================================
       STOCKAGE DES VIDÉOS : IndexedDB (gros fichiers, persistant)
       ============================================================ */
    const DB_NAME = 'clipclap_db';
    const STORE = 'videos';

    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const saveVideoBlob = async (key, blob) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const loadVideoBlob = async (key) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const isImageSrc = (s) =>
      typeof s === 'string' && (s.startsWith('http') || s.startsWith('data:') || s.startsWith('blob:'));

    /* ============================================================
       PAGE BATTLE
       ============================================================ */
    function CompetitionPage({ onClose, posts = [] }) {
      const [votesData, setVotesData] = React.useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_battle_votes');
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }
      });

      const [hasVoted, setHasVoted] = React.useState(() => {
        return localStorage.getItem('clipclap_user_voted_id') || null;
      });

      const candidates = React.useMemo(() => {
        if (!posts || posts.length === 0) return [];
        const artistMap = {};

        posts.forEach((post) => {
          const rawAuthor = post.user || post.author || post.username || post.userHandle || '';
          if (!rawAuthor || rawAuthor.includes('Toi (Artiste)') || rawAuthor === '@Anonyme') {
            return;
          }

          const author = rawAuthor;
          const views = Number(post.viewsCount ?? post.views ?? 0) || 0;
          const avatar = post.avatar || post.userAvatar || '🎤';
          const role = post.category || post.musicTitle || 'Créateur';

          if (!artistMap[author]) {
            artistMap[author] = { id: author, name: author, role, viewsCount: views, avatar };
          } else {
            artistMap[author].viewsCount += views;
            if (post.avatar) artistMap[author].avatar = post.avatar;
          }
        });

        return Object.values(artistMap)
          .sort((a, b) => b.viewsCount - a.viewsCount)
          .map((artist, index) => ({
            ...artist,
            topRank: index + 1,
            votes: votesData[artist.id] || 0,
            viewsFormatted: artist.viewsCount >= 1000
              ? (artist.viewsCount / 1000).toFixed(1) + 'k'
              : artist.viewsCount.toString(),
          }));
      }, [posts, votesData]);

      const topCandidates = candidates.filter((c) => c.topRank <= 2);
      const challengers = candidates.filter((c) => c.topRank > 2);
      const totalTopVotes = topCandidates.reduce((acc, curr) => acc + curr.votes, 0);

      const handleVote = (artistId) => {
        if (hasVoted) return;
        const updatedVotes = { ...votesData, [artistId]: (votesData[artistId] || 0) + 1 };
        setVotesData(updatedVotes);
        setHasVoted(artistId);
        try {
          localStorage.setItem('clipclap_battle_votes', JSON.stringify(updatedVotes));
          localStorage.setItem('clipclap_user_voted_id', artistId);
        } catch (e) {}
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950 text-white overflow-y-auto flex flex-col">
          {/* HEADER */}
          <div className="sticky top-0 z-10 bg-slate-900/90 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between">
            <button
              onClick={onClose}
              className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-lg active:scale-95 transition"
            >
              ✕
            </button>
            <div className="text-center">
              <h1 className="font-bold text-base bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                BATTLE DE LA SEMAINE 🏆
              </h1>
              <p className="text-[10px] text-gray-400">Classement en direct selon vos vues & votes</p>
            </div>
            <div className="w-9" />
          </div>

          <div className="p-4 flex-1 max-w-md mx-auto w-full space-y-6">
            {/* BANNIÈRE STATUT */}
            <div className="bg-purple-900/30 border border-purple-500/30 rounded-2xl p-3 flex items-center justify-between text-xs">
              <div className="flex items-center gap-2">
                <span className="animate-pulse text-red-400">🔴</span>
                <span className="font-semibold text-gray-200">Phase Finale en direct</span>
              </div>
              <span className="bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-lg text-[10px] font-bold">
                Vote unique
              </span>
            </div>

            {/* TOP 2 */}
            {topCandidates.length > 0 ? (
              <div className="bg-slate-900/90 rounded-3xl p-4 border border-purple-500/30 shadow-xl space-y-4">
                <div className="text-center space-y-0.5">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-pink-400">
                    Affiche Principale
                  </span>
                  <h2 className="font-bold text-sm">Main Event • Top Créateurs</h2>
                </div>

                <div className={`grid ${topCandidates.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-3 relative`}>
                  {topCandidates.length > 1 && (
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black text-xs px-2.5 py-1 rounded-full border-2 border-slate-950 shadow-lg">
                      VS
                    </div>
                  )}

                  {topCandidates.map((artist) => {
                    const isVotedThis = hasVoted === artist.id;
                    return (
                      <div
                        key={artist.id}
                        className="bg-slate-800/60 rounded-2xl p-3 border border-white/5 flex flex-col items-center text-center space-y-2 relative overflow-hidden"
                      >
                        <span className="absolute top-2 left-2 bg-purple-500/20 text-purple-300 text-[9px] font-bold px-1.5 py-0.5 rounded-md border border-purple-500/30">
                          👁️ {artist.viewsFormatted}
                        </span>

                        <div className="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-0.5 mt-3">
                          <div className="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-2xl overflow-hidden">
                            {isImageSrc(artist.avatar) ? (
                              <img src={artist.avatar} alt="" className="w-full h-full object-cover" />
                            ) : (
                              artist.avatar
                            )}
                          </div>
                        </div>

                        <div>
                          <p className="font-bold text-xs truncate w-28">{artist.name}</p>
                          <p className="text-[9px] text-gray-400">{artist.role}</p>
                        </div>

                        <button
                          onClick={() => handleVote(artist.id)}
                          disabled={hasVoted !== null}
                          className={`w-full py-2 rounded-xl text-xs font-bold transition transform active:scale-95 ${
                            isVotedThis
                              ? 'bg-emerald-500 text-white'
                              : hasVoted !== null
                              ? 'bg-gray-800 text-gray-500'
                              : 'bg-purple-600 hover:bg-purple-500 text-white'
                          }`}
                        >
                          {isVotedThis ? 'Voté ! ✓' : 'Voter'}
                        </button>
                      </div>
                    );
                  })}
                </div>

                {topCandidates.length > 1 && (
                  <div className="space-y-1.5 pt-2">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-purple-400">
                        {totalTopVotes > 0
                          ? Math.round(((topCandidates[0]?.votes || 0) / totalTopVotes) * 100)
                          : 0}%
                      </span>
                      <span className="text-gray-400 text-[10px]">Total: {totalTopVotes} votes</span>
                      <span className="text-pink-400">
                        {totalTopVotes > 0 && topCandidates[1]
                          ? Math.round(((topCandidates[1]?.votes || 0) / totalTopVotes) * 100)
                          : 0}%
                      </span>
                    </div>
                    <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden flex border border-white/5">
                      <div
                        className="h-full bg-purple-500 transition-all duration-500"
                        style={{ width: `${totalTopVotes > 0 ? ((topCandidates[0]?.votes || 0) / totalTopVotes) * 100 : 50}%` }}
                      />
                      <div
                        className="h-full bg-pink-500 transition-all duration-500"
                        style={{ width: `${totalTopVotes > 0 && topCandidates[1] ? ((topCandidates[1]?.votes || 0) / totalTopVotes) * 100 : 50}%` }}
                      />
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-slate-900/60 rounded-2xl p-6 text-center border border-white/5">
                <p className="text-sm text-gray-400">Aucun créateur n'est encore inscrit à la Battle.</p>
              </div>
            )}

            {/* CHALLENGERS */}
            {challengers.length > 0 && (
              <div className="space-y-3">
                <h3 className="font-bold text-sm text-gray-200">Prétendants au Top 2 🚀</h3>
                <div className="space-y-2">
                  {challengers.map((challenger) => (
                    <div
                      key={challenger.id}
                      className="bg-slate-900/60 border border-white/5 rounded-2xl p-3 flex items-center justify-between"
                    >
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-bold text-gray-400 w-4 text-center">#{challenger.topRank}</span>
                        <div className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-base border border-white/10 overflow-hidden">
                          {isImageSrc(challenger.avatar) ? (
                            <img src={challenger.avatar} alt="" className="w-full h-full object-cover" />
                          ) : (
                            challenger.avatar
                          )}
                        </div>
                        <div>
                          <p className="font-bold text-xs">{challenger.name}</p>
                          <p className="text-[10px] text-gray-400">{challenger.role}</p>
                        </div>
                      </div>

                      <div className="flex items-center gap-3">
                        <div className="text-right">
                          <p className="text-xs font-bold text-purple-300">👁️ {challenger.viewsFormatted}</p>
                          <p className="text-[9px] text-gray-500">{challenger.votes} votes</p>
                        </div>
                        <button
                          onClick={() => handleVote(challenger.id)}
                          disabled={hasVoted !== null}
                          className={`text-xs px-3 py-1.5 rounded-xl font-medium transition active:scale-95 ${
                            hasVoted === challenger.id
                              ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                              : hasVoted !== null
                              ? 'bg-white/5 text-gray-600'
                              : 'bg-white/10 hover:bg-white/20 text-white'
                          }`}
                        >
                          {hasVoted === challenger.id ? 'Voté ✓' : 'Soutenir'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ============================================================
       SONS
       ============================================================ */
    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'like') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    };

    /* ============================================================
       TEMPS ÉCOULÉ
       ============================================================ */
    function TempsEcoule({ dateCreation }) {
      const [texte, setTexte] = React.useState("");

      React.useEffect(() => {
        if (typeof dateCreation === 'string') return;
        const calculerTemps = () => {
          const secondes = Math.floor((Date.now() - dateCreation) / 1000);
          const minutes = Math.floor(secondes / 60);
          const heures = Math.floor(minutes / 60);
          const jours = Math.floor(heures / 24);

          if (minutes < 1) setTexte("À l'instant");
          else if (minutes < 60) setTexte(`Il y a ${minutes} min`);
          else if (heures < 24) setTexte(`Il y a ${heures} h`);
          else setTexte(`Il y a ${jours} j`);
        };
        calculerTemps();
        const interval = setInterval(calculerTemps, 60000);
        return () => clearInterval(interval);
      }, [dateCreation]);

      if (typeof dateCreation === 'string') {
        return <span className="text-xs text-gray-500">{dateCreation}</span>;
      }
      return <span className="text-xs text-gray-500">{texte}</span>;
    }

    /* ============================================================
       APPLICATION PRINCIPALE
       ============================================================ */
    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou');
      const [searchQuery, setSearchQuery] = useState("");
      const [replyingTo, setReplyingTo] = useState(null);
      const [selectedInstru, setSelectedInstru] = useState(null);
      const [audioSrc, setAudioSrc] = useState(null);
      const [showCompetitionPage, setShowCompetitionPage] = useState(false);

      useEffect(() => {
        if (activeTab !== 'studio') {
          setSelectedInstru(null);
        }
      }, [activeTab]);

      const [isRecordingMode, setIsRecordingMode] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [videoBlob, setVideoBlob] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [lyricsText, setLyricsText] = useState("");

      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);
      const cameraRef = useRef(null);
      const instruAudioRef = useRef(null);

      const [userPosts, setUserPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_user_posts');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // Les posts sont rechargés depuis localStorage (sans les vidéos stockées dans IndexedDB)
      const [posts, setPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_posts');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedPosts, setLikedPosts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes || 0 }), {})
      );
      const [savedCounts, setSavedCounts] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks || 0 }), {})
      );

      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.authorId || post.user]: post.followers }), {})
      );
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [toastMessage, setToastMessage] = useState("");
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [newCaption, setNewCaption] = useState("");
      const [selectedFile, setSelectedFile] = useState(null);
      const [viewingCreator, setViewingCreator] = useState(null);
      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState("");

      const [userName, setUserName] = useState(() => localStorage.getItem('clipclap_user_name') || "Aziz Enbiri");
      const [userTag, setUserTag] = useState(() => localStorage.getItem('clipclap_user_tag') || "@azizenbiri");
      const [userBio, setUserBio] = useState(() => localStorage.getItem('clipclap_user_bio_v2') || "");
      const [userAvatar, setUserAvatar] = useState(() => localStorage.getItem('clipclap_user_avatar') || "");

      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [userFollowingCount, setUserFollowingCount] = useState(() => {
        const saved = localStorage.getItem('clipclap_user_following_v2');
        return saved !== null ? parseInt(saved, 10) : 0;
      });
      const [userFollowersCount, setUserFollowersCount] = useState(() => {
        const saved = localStorage.getItem('clipclap_user_followers');
        return saved !== null ? parseInt(saved, 10) : 0;
      });
      const [userLikesCount, setUserLikesCount] = useState(() => {
        const saved = localStorage.getItem('clipclap_user_likes');
        return saved !== null ? parseInt(saved, 10) : 0;
      });

      const [chatConversations, setChatConversations] = useState([]);
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState("");

      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const videoRef = useRef(null);

      // Demande au navigateur de ne pas effacer le stockage (vidéos) automatiquement
      useEffect(() => {
        try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
      }, []);

      // SAUVEGARDE : on retire l'URL vidéo (blob) si la vidéo est dans IndexedDB
      useEffect(() => {
        try {
          const light = posts.map(p => {
            if (p.videoKey) { const { video, ...rest } = p; return rest; }
            return p;
          });
          localStorage.setItem('clipclap_posts', JSON.stringify(light));
        } catch (e) { console.error('Sauvegarde posts impossible', e); }
      }, [posts]);

      // AU DÉMARRAGE : on recrée les URL vidéo depuis IndexedDB
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const hydrated = await Promise.all(posts.map(async (p) => {
            if (p.videoKey && !p.video) {
              try {
                const blob = await loadVideoBlob(p.videoKey);
                if (blob) return { ...p, video: URL.createObjectURL(blob) };
              } catch (e) {}
            }
            return p;
          }));
          if (!cancelled) {
            // On fusionne pour ne pas écraser un post publié pendant le chargement
            setPosts(prev => prev.map(p => {
              const h = hydrated.find(x => x.id === p.id);
              return (h && h.video && !p.video) ? { ...p, video: h.video } : p;
            }));
          }
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 300);
              return 100;
            }
            return prev + 10;
          });
        }, 40);
        return () => clearInterval(interval);
      }, []);

      const displayedPosts = posts.filter(post => {
        if (feedTab === 'following') {
          const authorKey = post.authorId || post.user;
          return following[authorKey] === true;
        }
        return true;
      });

      useEffect(() => {
        if (currentIndex >= displayedPosts.length) {
          setCurrentIndex(0);
        }
      }, [feedTab, displayedPosts.length]);

      useEffect(() => {
        if (!showSplash && displayedPosts[currentIndex]) {
          const currentPostId = displayedPosts[currentIndex].id;
          setPosts(prevPosts => prevPosts.map((p) => {
            if (p.id === currentPostId) {
              return { ...p, viewsCount: (p.viewsCount || 0) + 1 };
            }
            return p;
          }));
        }
      }, [currentIndex, showSplash, feedTab]);

      const currentVideoSrc = displayedPosts[currentIndex] ? displayedPosts[currentIndex].video : null;

      useEffect(() => {
        if (!showSplash && videoRef.current && displayedPosts[currentIndex]) {
          if (viewingCreator || activeTab !== 'feed' || showUploadModal || showCommentsModal || activeChat) {
            videoRef.current.pause();
            setIsPlaying(false);
          } else {
            videoRef.current.muted = isMuted;
            videoRef.current.currentTime = 0;
            setIsPlaying(true);
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {});
            }
          }
        }
      }, [currentIndex, isMuted, showSplash, viewingCreator, activeTab, showUploadModal, showCommentsModal, activeChat, feedTab, currentVideoSrc]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2200);
      };

      const togglePlayPause = () => {
        if (!videoRef.current) return;
        playSound('click');
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        playSound('like');
        const isLiked = likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({ ...prev, [postId]: (prev[postId] || 0) + (isLiked ? -1 : 1) }));
        setUserLikesCount(prev => isLiked ? prev - 1 : prev + 1);
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        playSound('click');
        const isSaved = savedPosts[postId];
        setSavedPosts(prev => ({ ...prev, [postId]: !isSaved }));
        setSavedCounts(prev => ({ ...prev, [postId]: (prev[postId] || 0) + (isSaved ? -1 : 1) }));
        showToast(isSaved ? "Vidéo retirée des favoris" : "Vidéo enregistrée ! 📌");

      const handleFollow = (authorKey, e) => {
        e.stopPropagation();
        playSound('click');
        setFollowing(prev => {
          const willFollow = !prev[authorKey];
          showToast(willFollow ? `Abonné à ${authorKey} ! ✨` : `Désabonné de ${authorKey}`);
          setUserFollowingCount(c => willFollow ? c + 1 : Math.max(0, c - 1));
          setCreatorFollowers(counts => {
            const current = counts[authorKey] || 1000;
            return { ...counts, [authorKey]: willFollow ? current + 1 : Math.max(0, current - 1) };
          });
          return { ...prev, [authorKey]: willFollow };
        });
      };

      const handleShare = (e) => {
        e.stopPropagation();
        playSound('click');
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien de la vidéo copié ! 🔗");
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        playSound('click');
        const currentPost = displayedPosts[currentIndex];
        const newComment = { id: Date.now(), user: userTag, text: newCommentText.trim(), time: "À l'instant" };
        const updatedPosts = posts.map(post => {
          if (post.id === currentPost.id) {
            return { ...post, comments: (post.comments || 0) + 1, commentsList: [newComment, ...(post.commentsList || [])] };
          }
          return post;
        });
        setPosts(updatedPosts);
        setNewCommentText("");
        showToast("Commentaire publié ! 💬");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;
        playSound('click');
        const updated = chatConversations.map(conv => {
          if (conv.id === activeChat.id) {
            return { ...conv, lastMsg: newMessageText, time: "À l'instant", messages: [...conv.messages, { sender: userTag, text: newMessageText }] };
          }
          return conv;
        });
        setChatConversations(updated);
        setActiveChat(updated.find(c => c.id === activeChat.id));
        setNewMessageText("");
      };

      // PUBLICATION depuis le bouton "+"
      const handlePublish = (e) => {
        e.preventDefault();
        playSound('click');

        const createAndSavePost = (videoSrc, videoKey) => {
          const myNewPostItem = {
            id: Date.now(),
            authorId: userTag,
            user: userTag,
            avatar: userAvatar,
            desc: newCaption || "Nouvelle vidéo ClipClap ! 🎬 #clipclap",
            music: `Son original - ${userName} 🎵`,
            likes: 0, comments: 0, bookmarks: 0, shares: 0,
            viewsCount: 0,
            views: "0",
            followers: userFollowersCount,
            followingCount: userFollowingCount,
            totalLikes: userLikesCount,
            video: videoSrc,
            videoKey: videoKey || null,
            commentsList: []
          };

          setPosts(prev => [myNewPostItem, ...prev]);
          setUserPosts(prev => [myNewPostItem, ...prev]);
          setLikeCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setSavedCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setCreatorFollowers(counts => ({ ...counts, [userTag]: 1280 }));
          setShowUploadModal(false);
          setNewCaption("");
          setSelectedFile(null);
          setCurrentIndex(0);
          setFeedTab('foryou');
          showToast("Vidéo publiée et enregistrée ! 🚀");
        };

        if (selectedFile) {
          const videoKey = 'video_' + Date.now();
          saveVideoBlob(videoKey, selectedFile)
            .then(() => createAndSavePost(URL.createObjectURL(selectedFile), videoKey))
            .catch(() => showToast("Erreur : vidéo non sauvegardée ❌"));
        } else {
          createAndSavePost("https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4", null);
        }
      };

      // PUBLICATION depuis le studio
      const handlePublishFreestyle = async () => {
        if (!videoBlob) return;
        const videoKey = 'video_' + Date.now();
        try {
          await saveVideoBlob(videoKey, videoBlob);
        } catch (e) {
          showToast("Erreur : vidéo non sauvegardée ❌");
          return;

        const newPost = {
          id: Date.now(),
          authorId: userTag,
          user: userTag,
          avatar: userAvatar,
          desc: `Freestyle sur ${selectedInstru || "une instru"} 🎤 #clipclap`,

          viewsCount: 0, views: "0",
          followers: userFollowersCount,
          video: previewUrl,

          commentsList: []

        setLikeCounts(prev => ({ ...prev, [newPost.id]: 0 }));
        setSavedCounts(prev => ({ ...prev, [newPost.id]: 0 }));
        setPreviewUrl(null);
        setVideoBlob(null);
        setIsRecordingMode(false);
        setSelectedInstru(null);
        setAudioSrc(null);
        setCurrentIndex(0);
        setFeedTab('foryou');
        setActiveTab('feed');

      };

      const stopInstru = () => {
        if (instruAudioRef.current) {
          try { instruAudioRef.current.pause(); } catch (e) {}
          instruAudioRef.current = null;
        }
      };

      const closeStudio = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.onstop = null; // on annule sans créer d'aperçu
          try { mediaRecorderRef.current.stop(); } catch (e) {}
        }
        stopCamera();
        stopInstru();
        setSelectedInstru(null);
        setAudioSrc(null);
        setIsRecording(false);
        setIsRecordingMode(false);
      };

      const toggleRecording = () => {
        if (!isRecording) {
          recordedChunksRef.current = [];
          const el = cameraRef.current;
          if (el && el.srcObject) {
            try {
              const options = (window.MediaRecorder && MediaRecorder.isTypeSupported('video/webm')) ? { mimeType: 'video/webm' } : {};
              const mediaRecorder = new MediaRecorder(el.srcObject, options);
              mediaRecorderRef.current = mediaRecorder;

              mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunksRef.current.push(event.data);
              };
              mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunksRef.current, { type: mediaRecorder.mimeType || 'video/webm' });
                setVideoBlob(blob);
                setPreviewUrl(URL.createObjectURL(blob));
              };

              mediaRecorder.start();
              setIsRecording(true);

              if (audioSrc) {

                instruAudioRef.current = a;
                a.play().catch(() => {});

                      {isMuted ? '🔇' : '🔊'}

                    <div className="absolute top-1/2 right-2 transform -translate-y-1/2 z-20 pointer-events-none opacity-40 flex flex-col items-center gap-1">

                <p className="text-gray-400 text-sm">Vérifie le rendu avant de valider</p>
              </div>

              <div className="w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl bg-black border border-gray-800">
                <video
                  src={previewUrl}
                  controls
                  autoPlay
                  playsInline
                  className="w-full h-auto max-h-[60vh] object-contain"
                />
              </div>

              <div className="w-full max-w-sm flex gap-4 pb-6">
                <button
                  onClick={() => {
                    setPreviewUrl(null);
                    setVideoBlob(null);
                    setIsRecordingMode(true);
                  }}
                  className="flex-1 py-3 px-4 rounded-xl bg-gray-800 text-white font-semibold hover:bg-gray-700 transition"
                >
                  Recommencer 🔄
                </button>

                <button
                  onClick={handlePublishFreestyle}
                  className="flex-1 py-3 px-4 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-500 transition shadow-lg shadow-red-600/30"
                >
                  Publier 🚀
                </button>
              </div>
            </div>
          )}

          {/* CAMÉRA & TÉLÉPROMPTEUR */}
          {isRecordingMode && (
            <div className="fixed inset-0 bg-black z-50 flex flex-col justify-between text-white overflow-hidden">
              <div className="absolute top-0 inset-x-0 z-50 flex items-center justify-between p-4 text-white">
                <div className="flex items-center gap-2 bg-pink-600/80 px-3 py-1.5 rounded-full backdrop-blur-md">
                  <span className="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
                  <span className="text-xs font-bold uppercase tracking-wider">Mode Studio Actif</span>
                </div>
                <button
                  onClick={closeStudio}
                  className="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white cursor-pointer relative z-50"
                >
                  ✕
                </button>
              </div>

              <div className="absolute inset-0 bg-zinc-900 flex items-center justify-center">
                <video
                  autoPlay
                  playsInline
                  muted
                  ref={(node) => {
                    cameraRef.current = node;
                    if (node && !node.srcObject) {
                      navigator.mediaDevices?.getUserMedia({ video: { facingMode: "user" }, audio: true })
                        .then(stream => { node.srcObject = stream; })
                        .catch(err => console.log("Caméra non accessible : ", err));
                    }
                  }}
                  className="w-full h-full object-cover transform scale-x-[-1]"
                ></video>
                <div className="absolute bottom-28 inset-x-4 text-center z-10 pointer-events-none">
                  <span className="bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full text-xs text-pink-400 font-medium border border-pink-500/30">
                    🎵 Instru : {selectedInstru || "aucune"}
                  </span>
                </div>
              </div>

              <div className="relative z-10 mt-20 mx-4 max-h-48 overflow-y-auto bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-4 text-center pointer-events-auto">
                <p className="text-xs uppercase tracking-widest text-pink-400 font-bold mb-2">Téléprompteur 📜</p>
                {lyricsText ? (
                  <p className="text-lg font-medium leading-relaxed whitespace-pre-wrap text-white">{lyricsText}</p>
                ) : (
                  <p className="text-sm text-gray-400 italic">Aucune parole écrite dans le bloc-notes... Écris tes rimes avant de lancer !</p>
                )}
              </div>

              <div className="relative z-10 p-6 pb-10 flex items-center justify-center bg-gradient-to-t from-black/90 via-black/50 to-transparent">
                <button
                  onClick={toggleRecording}
                  className={`group relative flex items-center justify-center w-20 h-20 rounded-full border-4 border-white cursor-pointer transition shadow-2xl ${
                    isRecording ? 'bg-red-600 animate-pulse' : 'bg-red-600 hover:bg-red-500'
                  }`}
                >
                  <div className={`transition-all bg-white ${
                    isRecording ? 'w-6 h-6 rounded-sm' : 'w-8 h-8 rounded-md group-hover:scale-90'
                  }`}></div>
                </button>
              </div>
            </div>
          )}

          {showCompetitionPage && (
            <CompetitionPage
              posts={posts}
              onClose={() => setShowCompetitionPage(false)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ClipClapApp />);
  </script>

  <!-- Script anti-Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</body>
</html>
