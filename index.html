<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07040f] text-white select-none overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FEATURED_CREATORS = [
      { id: 1, name: "NeonVibes", tag: "@neon_vibes", avatar: "🌌", live: true },
      { id: 2, name: "CyberDance", tag: "@cyber_dancer", avatar: "💃", live: false },
      { id: 3, name: "AlexBeat", tag: "@alex_beats", avatar: "🎧", live: true },
      { id: 4, name: "SoraArt", tag: "@sora_design", avatar: "🎨", live: false },
    ];

    const TRENDING_POSTS = [
      {
        id: 1,
        user: "@neon_vibes",
        title: "Lumières de la ville 🌌",
        views: "145.2K",
        likes: "12.4K",
        category: "Tendance 🔥",
        thumb: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=600",
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4"
      },
      {
        id: 2,
        user: "@cyber_dancer",
        title: "Session freestyle sous les néons 💃✨",
        views: "520.8K",
        likes: "45.2K",
        category: "Danse ⚡",
        thumb: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600",
        video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4"
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [activeTab, setActiveTab] = useState('home');
      const [selectedVideo, setSelectedVideo] = useState(null);
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [toastMessage, setToastMessage] = useState("");

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 300);
              return 100;
            }
            return prev + 10;
          });
        }, 40);
        return () => clearInterval(interval);
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2000);
      };

      if (showSplash) {
        return (
          <div class="h-dvh w-full max-w-md mx-auto bg-gradient-to-b from-[#181033] via-[#0d071d] to-[#07040f] flex flex-col items-center justify-between py-16 px-6 relative overflow-hidden border-x border-purple-900/20">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-[#ff3b96]/15 blur-[90px] rounded-full pointer-events-none"></div>
            <div></div>
            <div class="flex flex-col items-center text-center z-10 space-y-3">
              <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-[0_0_15px_#ff3b96]">ClipClap</h1>
              <p class="text-[10px] font-bold tracking-[0.22em] text-[#ff3b96] uppercase pt-1">Short Video Social Network</p>
            </div>
            <div class="w-full max-w-[240px] z-10">
              <div class="w-full h-[5px] bg-purple-950/90 rounded-full overflow-hidden border border-purple-800/30">
                <div class="h-full bg-gradient-to-r from-[#ff3b96] to-[#9d3bff] rounded-full shadow-[0_0_10px_#ff3b96] transition-all duration-75" style={{ width: `${progress}%` }}></div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div class="h-dvh w-full max-w-md mx-auto bg-[#07040f] flex flex-col relative overflow-hidden border-x border-white/5">
          
          {toastMessage && (
            <div class="absolute top-6 left-1/2 -translate-x-1/2 z-50 bg-[#ff3b96] text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">
              {toastMessage}
            </div>
          )}

          {/* Lecteur Plein Écran (Si vidéo sélectionnée) */}
          {selectedVideo && (
            <div class="absolute inset-0 z-50 bg-black flex flex-col justify-between">
              <button 
                onClick={() => setSelectedVideo(null)}
                class="absolute top-6 left-6 z-10 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center text-xl backdrop-blur-md border border-white/20"
              >
                ✕
              </button>
              <video 
                src={selectedVideo.video} 
                class="w-full h-full object-cover" 
                autoPlay 
                loop 
                playsInline 
              />
              <div class="absolute bottom-6 left-6 right-6 bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/10 space-y-1">
                <span class="text-xs font-bold text-[#ff3b96]">{selectedVideo.user}</span>
                <p class="text-sm text-white font-medium">{selectedVideo.title}</p>
              </div>
            </div>
          )}

          {/* Modal Envoi */}
          {showUploadModal && (
            <div class="absolute inset-0 z-50 bg-[#07040f]/95 backdrop-blur-xl p-6 flex flex-col justify-between">
              <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">Nouveau Clip 🎬</h2>
                <button onClick={() => setShowUploadModal(false)} class="text-gray-400 text-2xl">✕</button>
              </div>
              <div class="text-center space-y-4 my-auto">
                <div class="w-20 h-20 mx-auto rounded-full bg-[#ff3b96]/10 border-2 border-dashed border-[#ff3b96] flex items-center justify-center text-3xl">
                  📹
                </div>
                <p class="text-sm text-gray-300">Sélectionne une vidéo pour la publier sur ClipClap</p>
                <button 
                  onClick={() => { setShowUploadModal(false); showToast("Vidéo publiée ! 🚀"); }}
                  class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#ff3b96] to-purple-600 font-bold text-white shadow-[0_0_15px_#ff3b96]/40"
                >
                  Choisir un fichier
                </button>
              </div>
            </div>
          )}

          {/* HEADER CLIPCLAP */}
          <div class="p-5 pb-3 flex items-center justify-between border-b border-white/5 bg-[#07040f]/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#ff3b96] to-purple-600 flex items-center justify-center font-extrabold text-sm shadow-[0_0_10px_#ff3b96]">
                🎬
              </div>
              <span class="text-xl font-extrabold tracking-tight text-white drop-shadow-[0_0_8px_#ff3b96]">ClipClap</span>
            </div>
            <div class="flex items-center gap-3">
              <button onClick={() => showToast("Recherche bientôt dispo 🔍")} class="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-sm">🔍</button>
              <button onClick={() => showToast("Pas de nouvelles notifs 🔔")} class="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-sm relative">
                🔔
                <span class="absolute top-1 right-1 w-2 h-2 bg-[#ff3b96] rounded-full"></span>
              </button>
            </div>
          </div>

          {/* CORPS DE PAGE ACCUEIL */}
          <div class="flex-1 overflow-y-auto no-scrollbar p-5 space-y-6">
            
            {/* CARROUSEL CRÉATEURS */}
            <div class="space-y-3">
              <div class="flex justify-between items-center">
                <h3 class="text-xs font-extrabold tracking-wider uppercase text-gray-400">Créateurs ClipClap</h3>
                <span class="text-xs text-[#ff3b96] font-semibold">Voir tout</span>
              </div>
              <div class="flex gap-4 overflow-x-auto no-scrollbar py-1">
                {FEATURED_CREATORS.map(c => (
                  <div key={c.id} class="flex flex-col items-center gap-1.5 shrink-0">
                    <div class={`w-14 h-14 rounded-full p-0.5 relative ${c.live ? 'bg-gradient-to-tr from-[#ff3b96] to-cyan-400 shadow-[0_0_12px_#ff3b96]' : 'bg-white/10'}`}>
                      <div class="w-full h-full bg-[#07040f] rounded-full flex items-center justify-center text-xl">
                        {c.avatar}
                      </div>
                      {c.live && (
                        <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-[#ff3b96] text-[8px] font-extrabold px-1.5 py-0.2 rounded-full uppercase">
                          Live
                        </span>
                      )}
                    </div>
                    <span class="text-[11px] font-medium text-gray-300">{c.name}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* BANNIÈRE CLAP DIRECT */}
            <div class="p-4 rounded-2xl bg-gradient-to-r from-purple-900/40 via-[#ff3b96]/20 to-purple-900/40 border border-[#ff3b96]/30 flex items-center justify-between">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-[#ff3b96]">Lancer le flux</span>
                <h4 class="text-base font-bold text-white">Mode Zap Vidéos ⚡</h4>
              </div>
              <button 
                onClick={() => setSelectedVideo(TRENDING_POSTS[0])}
                class="px-4 py-2 rounded-xl bg-[#ff3b96] text-white font-bold text-xs shadow-[0_0_10px_#ff3b96] active:scale-95 transition"
              >
                Regarder ▶
              </button>
            </div>

            {/* FLUX DE TENDANCES (GRID CARDS) */}
            <div class="space-y-3">
              <h3 class="text-xs font-extrabold tracking-wider uppercase text-gray-400">À la une aujourd'hui</h3>
              
              <div class="space-y-4">
                {TRENDING_POSTS.map(post => (
                  <div 
                    key={post.id}
                    onClick={() => setSelectedVideo(post)}
                    class="group relative rounded-2xl overflow-hidden bg-white/5 border border-white/10 cursor-pointer active:scale-[0.98] transition"
                  >
                    <div class="aspect-[16/10] w-full relative overflow-hidden">
                      <img src={post.thumb} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                      
                      <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-[10px] font-bold text-cyan-400 border border-cyan-400/30">
                        {post.category}
                      </span>

                      <div class="absolute bottom-3 left-3 right-3 flex justify-between items-end">
                        <div class="space-y-0.5">
                          <span class="text-xs font-bold text-[#ff3b96]">{post.user}</span>
                          <h4 class="text-sm font-semibold text-white line-clamp-1">{post.title}</h4>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-[#ff3b96] text-white flex items-center justify-center text-sm font-bold shadow-[0_0_12px_#ff3b96]">
                          ▶
                        </div>
                      </div>
                    </div>

                    <div class="px-4 py-2.5 flex justify-between items-center text-xs text-gray-400 border-t border-white/5">
                      <span class="flex items-center gap-1">👁️ {post.views}</span>
                      <span class="flex items-center gap-1">♥ {post.likes}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>

          {/* BARRE DE NAVIGATION INFÉRIEURE */}
          <div class="h-16 shrink-0 bg-[#07040f]/90 backdrop-blur-lg border-t border-white/10 flex justify-around items-center z-40">
            <button class="flex flex-col items-center justify-center w-full h-full text-[#ff3b96] font-bold">
              <span class="text-xl">🏠</span>
              <span class="text-[10px]">Accueil</span>
            </button>

            <button 
              onClick={() => setShowUploadModal(true)}
              class="flex items-center justify-center w-12 h-9 rounded-xl bg-gradient-to-r from-[#ff3b96] to-purple-600 text-white font-extrabold text-xl shadow-[0_0_12px_rgba(255,59,150,0.6)] active:scale-90 transition"
            >
              +
            </button>

            <button onClick={() => showToast("Onglet Profil dans le menu vidéo")} class="flex flex-col items-center justify-center w-full h-full text-gray-400">
              <span class="text-xl">👤</span>
              <span class="text-[10px]">Profil</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClipClapApp />);
  </script>
</body>
</html>
