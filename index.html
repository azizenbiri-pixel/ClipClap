<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0719;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .video-swipe-area {
      touch-action: none;
    }
  </style>
</head>
<body class="text-white select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'like') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch(e) {}
    };

    const INITIAL_POSTS = [
      {
        id: 1,
        authorId: "@neon_vibes",
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes #fyp",
        music: "Son original - Neon Vibes 🎵",
        likes: 12400,
        comments: 842,
        bookmarks: 320,
        shares: 156,
        viewsCount: 145200,
        views: "145.2K",
        followers: 45200,
        followingCount: 120,
        totalLikes: 210000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4",
        commentsList: [
          { id: 1, user: "@lucas_92", text: "Incroyable cette vidéo ! 🔥", time: "Il y a 2h" },
          { id: 2, user: "@sarah_gfx", text: "Le rendu des néons est top 🌌", time: "Il y a 5h" }
        ],
        userPosts: [
          { id: 101, views: "145.2K", video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4", desc: "Mon ancienne vidéo néon 🌌" },
          { id: 102, views: "89.1K", video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4", desc: "Nature and chill 🌿" }
        ]
      },
      {
        id: 2,
        authorId: "@cyber_dancer",
        user: "@cyber_dancer",
        desc: "Session freestyle sous les néons 💃✨ #dance #cyberpunk",
        music: "Cyberpunk Beats 2077 🎶",
        likes: 45200,
        comments: 1200,
        bookmarks: 1450,
        shares: 430,
        viewsCount: 520800,
        views: "520.8K",
        followers: 128000,
        followingCount: 410,
        totalLikes: 890000,
        video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
        commentsList: [
          { id: 1, user: "@dance_King", text: "Quelle énergie ! 💃", time: "Il y a 1j" }
        ],
        userPosts: [
          { id: 201, views: "520.8K", video: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4", desc: "Session freestyle 💃✨" }
        ]
      }
    ];
    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [showPlayIcon, setShowPlayIcon] = useState(false);
      const [activeTab, setActiveTab] = useState('feed');
      const [feedTab, setFeedTab] = useState('foryou'); // 'following' ou 'foryou'
      const [searchQuery, setSearchQuery] = useState("");

      const [posts, setPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('clipclap_posts');
          return saved ? JSON.parse(saved) : INITIAL_POSTS;
        } catch(e) {
          return INITIAL_POSTS;
        }
      });

      const [currentIndex, setCurrentIndex] = useState(0);

      const [likedPosts, setLikedPosts] = useState({});
      const [savedPosts, setSavedPosts] = useState({});
      const [likeCounts, setLikeCounts] = useState(() => 
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.likes }), {})
      );
      const [savedCounts, setSavedCounts] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.id]: post.bookmarks }), {})
      );
      
      const [following, setFollowing] = useState({});
      const [creatorFollowers, setCreatorFollowers] = useState(() =>
        posts.reduce((acc, post) => ({ ...acc, [post.authorId || post.user]: post.followers }), {})
      );

      const [toastMessage, setToastMessage] = useState("");

      const [showUploadModal, setShowUploadModal] = useState(false);
      const [newCaption, setNewCaption] = useState("");
      const [selectedFile, setSelectedFile] = useState(null);
      const [viewingCreator, setViewingCreator] = useState(null);

      const [showCommentsModal, setShowCommentsModal] = useState(false);
      const [newCommentText, setNewCommentText] = useState("");

      const [userName, setUserName] = useState("Aziz Enbiri");
      const [userTag, setUserTag] = useState("@azizenbiri");
      const [userBio, setUserBio] = useState("Créateur de contenu néon ⚡");
      const [isEditingProfile, setIsEditingProfile] = useState(false);

      const [userFollowersCount, setUserFollowersCount] = useState(1280);
      const [userFollowingCount, setUserFollowingCount] = useState(245);
      const [userLikesCount, setUserLikesCount] = useState(9420);

      const [chatConversations, setChatConversations] = useState([
        { id: 1, user: "@neon_vibes", lastMsg: "Salut super tes vidéos !", time: "Il y a 10m", unread: true, messages: [{ sender: "@neon_vibes", text: "Salut super tes vidéos !" }] },
        { id: 2, user: "@cyber_dancer", lastMsg: "On collabore quand ?", time: "Il y a 1h", unread: false, messages: [{ sender: "@cyber_dancer", text: "On collabore quand ?" }] }
      ]);
      const [activeChat, setActiveChat] = useState(null);
      const [newMessageText, setNewMessageText] = useState("");

      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const videoRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('clipclap_posts', JSON.stringify(posts));
        } catch(e) {}
      }, [posts]);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 300);
              return 100;
            }
            return prev + 10;
          });
        }, 40);
        return () => clearInterval(interval);
      }, []);

      // Filtrage des vidéos en fonction du flux actif (Abonnements / Pour toi)
      const displayedPosts = posts.filter(post => {
        if (feedTab === 'following') {
          const authorKey = post.authorId || post.user;
          return following[authorKey] === true;
        }
        return true;
      });

      useEffect(() => {
        if (currentIndex >= displayedPosts.length) {
          setCurrentIndex(0);
        }
      }, [feedTab, displayedPosts.length]);

      useEffect(() => {
        if (!showSplash && displayedPosts[currentIndex]) {
          const currentPostId = displayedPosts[currentIndex].id;
          setPosts(prevPosts => {
            return prevPosts.map((p) => {
              if (p.id === currentPostId) {
                return { ...p, viewsCount: (p.viewsCount || 1000) + 1 };
              }
              return p;
            });
          });
        }
      }, [currentIndex, showSplash, feedTab]);

      useEffect(() => {
        if (!showSplash && videoRef.current && displayedPosts[currentIndex]) {
          if (viewingCreator || activeTab !== 'feed' || showUploadModal || showCommentsModal || activeChat) {
            videoRef.current.pause();
            setIsPlaying(false);
          } else {
            videoRef.current.muted = isMuted;
            videoRef.current.currentTime = 0;
            setIsPlaying(true);
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {});
            }
          }
        }
      }, [currentIndex, isMuted, showSplash, viewingCreator, activeTab, showUploadModal, showCommentsModal, activeChat, feedTab]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2200);
      };

      const togglePlayPause = () => {
        if (!videoRef.current) return;
        playSound('click');

        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }

        setShowPlayIcon(true);
        setTimeout(() => setShowPlayIcon(false), 800);
      };

      const handleLike = (postId, e) => {
        e.stopPropagation();
        playSound('like');
        const isLiked = likedPosts[postId];
        setLikedPosts(prev => ({ ...prev, [postId]: !isLiked }));
        setLikeCounts(prev => ({
          ...prev,
          [postId]: isLiked ? prev[postId] - 1 : prev[postId] + 1
        }));
        setUserLikesCount(prev => isLiked ? prev - 1 : prev + 1);
      };

      const handleSave = (postId, e) => {
        e.stopPropagation();
        playSound('click');
        const isSaved = savedPosts[postId];
        setSavedPosts(prev => ({ ...prev, [postId]: !isSaved }));
        setSavedCounts(prev => ({
          ...prev,
          [postId]: isSaved ? prev[postId] - 1 : prev[postId] + 1
        }));
        showToast(isSaved ? "Vidéo retirée des favoris" : "Vidéo enregistrée ! 📌");
      };

      const handleFollow = (authorKey, e) => {
        e.stopPropagation();
        playSound('click');
        setFollowing(prev => {
          const willFollow = !prev[authorKey];
          showToast(willFollow ? `Abonné à ${authorKey} ! ✨` : `Désabonné de ${authorKey}`);
          
          setUserFollowingCount(c => willFollow ? c + 1 : Math.max(0, c - 1));

          setCreatorFollowers(counts => {
            const current = counts[authorKey] || 1000;
            return {
              ...counts,
              [authorKey]: willFollow ? current + 1 : Math.max(0, current - 1)
            };
          });

          return { ...prev, [authorKey]: willFollow };
        });
      };

      const handleShare = (e) => {
        e.stopPropagation();
        playSound('click');
        if (navigator.share) {
          navigator.share({ title: 'ClipClap', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Lien de la vidéo copié ! 🔗");
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        playSound('click');

        const currentPost = displayedPosts[currentIndex];
        const newComment = {
          id: Date.now(),
          user: userTag,
          text: newCommentText.trim(),
          time: "À l'instant"
        };

        const updatedPosts = posts.map(post => {
          if (post.id === currentPost.id) {
            return {
              ...post,
              comments: (post.comments || 0) + 1,
              commentsList: [newComment, ...(post.commentsList || [])]
            };
          }
          return post;
        });

        setPosts(updatedPosts);
        setNewCommentText("");
        showToast("Commentaire publié ! 💬");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;
        playSound('click');

        const updated = chatConversations.map(conv => {
          if (conv.id === activeChat.id) {
            return {
              ...conv,
              lastMsg: newMessageText,
              time: "À l'instant",
              messages: [...conv.messages, { sender: userTag, text: newMessageText }]
            };
          }
          return conv;
        });

        setChatConversations(updated);
        setActiveChat(updated.find(c => c.id === activeChat.id));
        setNewMessageText("");
      };

      const handlePublish = (e) => {
        e.preventDefault();
        playSound('click');

        const createAndSavePost = (videoSrc) => {
          const myNewPostItem = {
            id: Date.now(),
            authorId: userTag,
            user: userTag,
            desc: newCaption || "Nouvelle vidéo ClipClap ! 🎬 #clipclap",
            music: `Son original - ${userName} 🎵`,
            likes: 1,
            comments: 0,
            bookmarks: 0,
            shares: 0,
            viewsCount: 1,
            views: "1",
            followers: 1,
            followingCount: 0,
            totalLikes: 1,
            video: videoSrc,
            commentsList: [],
            userPosts: []
          };

          const updatedPosts = [myNewPostItem, ...posts];
          setPosts(updatedPosts);
          setLikeCounts(prev => ({ ...prev, [myNewPostItem.id]: 1 }));
          setSavedCounts(prev => ({ ...prev, [myNewPostItem.id]: 0 }));
          setCreatorFollowers(counts => ({ ...counts, [userTag]: 1280 }));
          
          setShowUploadModal(false);
          setNewCaption("");
          setSelectedFile(null);
          setCurrentIndex(0);
          setFeedTab('foryou');
          showToast("Vidéo publiée et enregistrée ! 🚀");
        };

        if (selectedFile) {
          const reader = new FileReader();
          reader.readAsDataURL(selectedFile);
          reader.onloadend = () => {
            createAndSavePost(reader.result);
          };
        } else {
          createAndSavePost("https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-41561-large.mp4");
        }
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (displayedPosts.length === 0) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX > 40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(displayedPosts[currentIndex]);
          return;
        }

        if (Math.abs(diffY) > 40 && Math.abs(diffX) < 50) {
          if (diffY > 0) {
            setCurrentIndex(prev => (prev + 1) % displayedPosts.length);
          } else {
            setCurrentIndex(prev => (prev - 1 + displayedPosts.length) % displayedPosts.length);
          }
        }
      };

      const handleProfileTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleProfileTouchEnd = (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const diffX = touchStartX.current - touchEndX;
        const diffY = touchStartY.current - touchEndY;

        if (diffX < -40 && Math.abs(diffY) < 50) {
          playSound('click');
          setViewingCreator(null);
        }
      };
      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-[#070412] z-50 flex flex-col items-center justify-center p-6 text-center">
            <div className="relative mb-6">
              <div className="absolute -inset-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full blur-xl opacity-75 animate-pulse"></div>
              <div className="relative w-24 h-24 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-3xl flex items-center justify-center shadow-2xl border border-white/20">
                <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
            </div>
            <h1 className="text-4xl font-extrabold tracking-wider bg-gradient-to-r from-white via-pink-200 to-purple-300 bg-clip-text text-transparent mb-2">ClipClap</h1>
            <p className="text-purple-300/80 text-sm font-medium mb-10 tracking-wide">Plongez dans le flux infini</p>
            <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden backdrop-blur">
              <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300 rounded-full" style={{ width: `${progress}%` }}></div>
            </div>
          </div>
        );
      }

      const currentPost = displayedPosts[currentIndex];

      return (
        <div className="h-full w-full bg-[#0b0719] flex flex-col relative overflow-hidden text-white font-sans select-none">
          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-neutral-900/90 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl z-50 border border-white/10 backdrop-blur animate-bounce">
              {toastMessage}
            </div>
          )}

          <div className="flex-1 relative overflow-hidden">
            {activeTab === 'feed' && (
              <div 
                className="absolute inset-0 video-swipe-area flex flex-col justify-center items-center bg-black"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                onClick={togglePlayPause}
              >
                {currentPost ? (
                  <>
                    <video
                      ref={videoRef}
                      src={currentPost.video}
                      className="absolute inset-0 w-full h-full object-cover"
                      loop
                      playsInline
                      muted={isMuted}
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

                    {showPlayIcon && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                        <div className="bg-black/50 p-4 rounded-full backdrop-blur-md transform transition-all duration-300 scale-110">
                          {isPlaying ? (
                            <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          ) : (
                            <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          )}
                        </div>
                      </div>
                    )}

                    <div className="absolute top-12 left-0 right-0 flex justify-center items-center gap-6 z-30 pointer-events-auto">
                      <button 
                        onClick={(e) => { e.stopPropagation(); setFeedTab('following'); }}
                        className={`text-sm font-bold pb-1 transition-all ${feedTab === 'following' ? 'text-white border-b-2 border-white' : 'text-white/50'}`}
                      >
                        Abonnements
                      </button>
                      <button 
                        onClick={(e) => { e.stopPropagation(); setFeedTab('foryou'); }}
                        className={`text-sm font-bold pb-1 transition-all ${feedTab === 'foryou' ? 'text-white border-b-2 border-white' : 'text-white/50'}`}
                      >
                        Pour toi
                      </button>
                    </div>

                    <button 
                      onClick={(e) => { e.stopPropagation(); setIsMuted(!isMuted); playSound('click'); }}
                      className="absolute top-12 right-4 bg-black/40 p-2.5 rounded-full backdrop-blur-md z-30 pointer-events-auto border border-white/10"
                    >
                      {isMuted ? (
                        <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                        </svg>
                      ) : (
                        <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                      )}
                    </button>

                    <div className="absolute right-4 bottom-20 flex flex-col items-center gap-5 z-30 pointer-events-auto">
                      <div className="relative">
                        <div 
                          onClick={(e) => { e.stopPropagation(); setViewingCreator(currentPost); playSound('click'); }}
                          className="w-12 h-12 rounded-full border-2 border-pink-500 overflow-hidden cursor-pointer shadow-lg bg-purple-900 flex items-center justify-center font-bold text-lg"
                        >
                          {currentPost.user ? currentPost.user.substring(1, 3).toUpperCase() : "CC"}
                        </div>
                        {(!following[currentPost.authorId || currentPost.user]) && (
                          <button 
                            onClick={(e) => handleFollow(currentPost.authorId || currentPost.user, e)}
                            className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-pink-500 to-purple-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold shadow-md hover:scale-110 transition-transform"
                          >
                            +
                          </button>
                        )}
                      </div>

                      <button 
                        onClick={(e) => handleLike(currentPost.id, e)}
                        className="flex flex-col items-center gap-1 group"
                      >
                        <div className={`p-3 rounded-full backdrop-blur-md transition-transform group-active:scale-125 ${likedPosts[currentPost.id] ? 'bg-pink-500/30 text-pink-500' : 'bg-black/40 text-white border border-white/10'}`}>
                          <svg className="w-6 h-6" fill={likedPosts[currentPost.id] ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24">

          {showUploadModal && (
            <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#0b0719] border border-white/15 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-extrabold text-base bg-gradient-to-r from-white via-pink-200 to-purple-300 bg-clip-text text-transparent">Publier une vidéo</h2>
                  <button onClick={() => setShowUploadModal(false)} className="text-white/60 hover:text-white">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <form onSubmit={handlePublish} className="flex flex-col gap-4">
                  <div>
                    <label className="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-2">Sélectionner une vidéo</label>
                    <input 
                      type="file" 
                      accept="video/*"
                      onChange={(e) => setSelectedFile(e.target.files[0])}
                      className="w-full text-xs text-white/70 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gradient-to-r file:from-pink-500 file:to-purple-600 file:text-white file:cursor-pointer hover:file:opacity-90"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-2">Description & Hashtags</label>
                    <textarea 
                      rows="3"
                      placeholder="Décrivez votre vidéo... #clipclap #vibes"
                      value={newCaption}
                      onChange={(e) => setNewCaption(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-purple-500 resize-none"
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-xs font-extrabold shadow-lg tracking-wide uppercase mt-2">
                    Mettre en ligne 🚀
                  </button>
                </form>
              </div>
            </div>
          )}

          {activeChat && (
            <div className="absolute inset-0 bg-[#0b0719] z-50 flex flex-col">
              <div className="flex items-center gap-3 p-4 bg-black/40 border-b border-white/10 backdrop-blur">
                <button onClick={() => setActiveChat(null)} className="text-white/80">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-bold text-xs shadow">
                  {activeChat.user.substring(1, 3).toUpperCase()}
                </div>
                <h2 className="font-extrabold text-sm">{activeChat.user}</h2>
              </div>

              <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                {activeChat.messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === userTag ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-xs font-medium shadow-md ${m.sender === userTag ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-br-none' : 'bg-white/10 border border-white/10 text-white rounded-bl-none'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <form onSubmit={handleSendMessage} className="p-3 bg-black/40 border-t border-white/10 flex gap-2">
                <input 
                  type="text"
                  placeholder="Écrivez un message..."
                  value={newMessageText}
                  onChange={(e) => setNewMessageText(e.target.value)}
                  className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-purple-500"
                />
                <button type="submit" className="bg-gradient-to-r from-pink-500 to-purple-600 px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg">
                  Envoyer
                </button>
              </form>
            </div>
          )}

          {isEditingProfile && (
            <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#0b0719] border border-white/15 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-extrabold text-base bg-gradient-to-r from-white via-pink-200 to-purple-300 bg-clip-text text-transparent">Modifier le profil</h2>
                  <button onClick={() => setIsEditingProfile(false)} className="text-white/60 hover:text-white">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="flex flex-col gap-4">
                  <div>
                    <label className="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-2">Nom</label>
                    <input 
                      type="text"
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-2">Identifiant (@)</label>
                    <input 
                      type="text"
                      value={userTag}
                      onChange={(e) => setUserTag(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-2">Bio</label>
                    <textarea 
                      rows="2"
                      value={userBio}
                      onChange={(e) => setUserBio(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-500 resize-none"
                    ></textarea>
                  </div>
                  <button 
                    onClick={() => { setIsEditingProfile(false); playSound('click'); }}
                    className="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-xs font-extrabold shadow-lg tracking-wide uppercase mt-2"
                  >
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<ClipClapApp />, document.getElementById('root'));
  </script>
</body>
</html>
