<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipClap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0813] text-white select-none overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const POSTS = [
      {
        id: 1,
        user: "@neon_vibes",
        desc: "Lumières de la ville 🌌 #neon #city #vibes",
        music: "Son original - Neon Vibes",
        likes: 12400,
        comments: 842,
        shares: 156,
        image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 2,
        user: "@cyber_dancer",
        desc: "Session night lights 💃🎆 #dance #cyber",
        music: "Cyberpunk Beats 2077",
        likes: 45200,
        comments: 1200,
        shares: 430,
        image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80"
      }
    ];

    function ClipClapApp() {
      const [showSplash, setShowSplash] = useState(true);
      const [progress, setProgress] = useState(0);
      const [activeTab, setActiveTab] = useState('feed');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedPosts, setLikedPosts] = useState({});

      useEffect(() => {
        // Animation de la barre de chargement néon
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setShowSplash(false), 400);
              return 100;
            }
            return prev + 5;
          });
        }, 80);

        return () => clearInterval(interval);
      }, []);

      // Écran d'accueil exact selon ta maquette
      if (showSplash) {
        return (
          <div class="h-screen w-full max-w-md mx-auto bg-gradient-to-b from-[#110c24] via-[#0b0813] to-[#07040d] flex flex-col items-center justify-between py-16 px-6 relative overflow-hidden font-sans border-x border-purple-900/30">
            
            {/* Effet d'éclat lumineux en arrière-plan */}
            <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-pink-600/20 blur-[100px] rounded-full pointer-events-none"></div>

            {/* Espace supérieur */}
            <div></div>

            {/* Contenu central : Logo & Titres */}
            <div class="flex flex-col items-center text-center z-10 space-y-4">
              
              {/* Logo Clap de cinéma Néon */}
              <div class="relative mb-2">
                <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-[0_0_20px_rgba(255,0,128,0.8)]">
                  {/* Haut du clap (incliné) */}
                  <path d="M15 25 L75 12 L85 28 L25 41 Z" fill="url(#neon-grad)" stroke="#ff2a8d" stroke-width="2" />
                  <path d="M30 22 L40 38" stroke="#ffffff" stroke-width="3" opacity="0.8" />
                  <path d="M50 17 L60 33" stroke="#ffffff" stroke-width="3" opacity="0.8" />
                  
                  {/* Corps du clap */}
                  <rect x="15" y="38" width="70" height="50" rx="10" fill="none" stroke="url(#neon-grad)" stroke-width="4" />
                  
                  {/* Bouton lecture intérieur */}
                  <polygon points="52,55 52,71 66,63" fill="#ffffff" class="drop-shadow-[0_0_8px_rgba(255,255,255,0.9)]" />
                  
                  {/* Cercle avec note de musique à gauche */}
                  <circle cx="35" cy="63" r="12" fill="#0b0813" stroke="#ff2a8d" stroke-width="2" />
                  <text x="31" y="68" fill="#ff79c6" font-size="12" font-weight="bold">🎵</text>

                  {/* Dégradé SVG */}
                  <defs>
                    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ff2a8d" />
                      <stop offset="50%" stop-color="#b142fe" />
                      <stop offset="100%" stop-color="#7928ca" />
                    </linearGradient>
                  </defs>
                </svg>
              </div>

              {/* Titre ClipClap */}
              <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-[0_0_15px_rgba(255,255,255,0.6)]">
                ClipClap
              </h1>

              {/* Sous-titres */}
              <p class="text-[11px] font-bold tracking-[0.25em] text-pink-400 uppercase">
                Short Video Social Network
              </p>

              <p class="text-xs text-purple-300/80 font-medium tracking-wide pt-1">
                Connecting Stories, Creating Ripples
              </p>
            </div>

            {/* Barre de chargement en bas */}
            <div class="w-full max-w-xs z-10 px-4">
              <div class="w-full h-1.5 bg-purple-950/80 rounded-full overflow-hidden border border-purple-800/40">
                <div 
                  class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 rounded-full shadow-[0_0_12px_rgba(255,42,141,0.9)] transition-all duration-150 ease-out"
                  style={{ width: `${progress}%` }}
                ></div>
              </div>
            </div>

          </div>
        );
      }

      const currentPost = POSTS[currentIndex];

      return (
        <div class="h-screen w-full max-w-md mx-auto bg-[#0b0813] flex flex-col relative overflow-hidden">
          
          <div class="flex-1 relative">
            {activeTab === 'feed' ? (
              <div class="h-full w-full relative flex flex-col justify-end p-6 select-none">
                <img src={currentPost.image} alt="Post content" class="absolute inset-0 w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/90"></div>

                {/* Barre d'actions latérale */}
                <div class="absolute right-4 bottom-20 flex flex-col items-center gap-5 z-20">
                  <button onClick={() => setLikedPosts(p => ({...p, [currentPost.id]: !p[currentPost.id]}))} class="flex flex-col items-center">
                    <div class={`w-12 h-12 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center border text-xl ${likedPosts[currentPost.id] ? 'border-pink-500 text-pink-500 shadow-[0_0_15px_rgba(255,42,141,0.8)]' : 'border-white/30 text-white'}`}>
                      ♥
                    </div>
                    <span class="text-xs mt-1 font-bold text-white">{currentPost.likes}</span>
                  </button>

                  <button class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center border border-white/30 text-cyan-400 text-xl">
                      💬
                    </div>
                    <span class="text-xs mt-1 font-bold text-white">{currentPost.comments}</span>
                  </button>
                </div>

                <div class="relative z-10 space-y-2 pr-16 mb-4">
                  <h3 class="font-bold text-lg text-cyan-400">{currentPost.user}</h3>
                  <p class="text-sm text-gray-100">{currentPost.desc}</p>
                  <p class="text-xs text-pink-400 flex items-center gap-1">🎵 {currentPost.music}</p>
                </div>
              </div>
            ) : (
              <div class="h-full w-full p-6 overflow-y-auto bg-[#0b0813] space-y-6">
                <div class="text-center space-y-3 mt-4">
                  <div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-tr from-pink-500 to-purple-600">
                    <div class="w-full h-full bg-[#0b0813] rounded-full flex items-center justify-center text-3xl">
                      👾
                    </div>
                  </div>
                  <h2 class="text-2xl font-bold text-white">Aziz Enbiri</h2>
                  <p class="text-sm text-cyan-400">@azizenbiri</p>
                </div>
              </div>
            )}
          </div>

          {/* Navigation bas */}
          <div class="h-16 bg-[#0b0813] border-t border-white/10 flex justify-around items-center z-50">
            <button onClick={() => setActiveTab('feed')} class={`flex flex-col items-center ${activeTab === 'feed' ? 'text-pink-500 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">🏠</span>
              <span class="text-[10px]">Accueil</span>
            </button>
            <button onClick={() => setActiveTab('profile')} class={`flex flex-col items-center ${activeTab === 'profile' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">👤</span>
              <span class="text-[10px]">Profil</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClipClapApp />);
  </script>
</body>
</html>
